<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Genesys Cloud — Conversation Schema</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#F4F5F7;--surface:#fff;--border:#E2E5EA;--text:#1A1D23;--text-muted:#6B7280;
  --accent:#0F62FE;--accent-light:#E8F0FE;
  --header-bg:#0D1117;--header-text:#F0F3F6;
  --score-1:#DC2626;--score-1-bg:#FEF2F2;--score-1-light:#FCA5A5;
  --score-2:#EA580C;--score-2-bg:#FFF7ED;--score-2-light:#FB923C;
  --score-3:#374151;--score-3-bg:#FFFFFF;--score-3-border:#D1D5DB;
  --score-4:#1D4ED8;--score-4-bg:#1D4ED8;
  --score-5:#059669;--score-5-bg:#059669;
  --ovr-1:#991B1B;
  --ovr-2:#C2410C;
  --ovr-3:#64748B;--ovr-3-bg:#FFFFFF;--ovr-3-border:#CBD5E1;
  --ovr-4:#1E40AF;
  --ovr-5:#047857;
  --gold:#D4A017;--gold-bg:#FFFBEB;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 4px 12px rgba(0,0,0,.1);
  --shadow-xl:0 8px 24px rgba(0,0,0,.12);
  --radius:8px;--radius-lg:12px;
  --font-display:'Plus Jakarta Sans',sans-serif;
  --font-body:'DM Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn .5s cubic-bezier(.16,1,.3,1) backwards}
.fade-in-up{animation:fadeInUp .6s cubic-bezier(.16,1,.3,1) backwards}
.tab-fade-in{animation:fadeInUp .55s cubic-bezier(.16,1,.3,1) backwards}
.cards{animation:fadeIn .6s cubic-bezier(.16,1,.3,1) backwards}
.cards > .card{animation:fadeInUp .65s cubic-bezier(.16,1,.3,1) backwards}
.cards > .card:nth-child(1){animation-delay:45ms}
.cards > .card:nth-child(2){animation-delay:90ms}
.cards > .card:nth-child(3){animation-delay:135ms}
.cards > .card:nth-child(4){animation-delay:180ms}
.cards > .card:nth-child(5){animation-delay:225ms}
.cards > .card:nth-child(6){animation-delay:270ms}
.grid-section{animation:fadeInUp .65s cubic-bezier(.16,1,.3,1) backwards;animation-delay:120ms}

/* ───────────── HEADER ───────────── */
.header{background:#1F6FBA;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.header-left{display:flex;align-items:center;gap:14px}
.header h1{font-family:var(--font-display);color:#fff;font-size:18px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:10px;margin:0}
.header h1 .icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:rgba(255,255,255,.16);border-radius:8px;border:1px solid rgba(255,255,255,.2)}
.header-meta{color:rgba(255,255,255,.82);font-size:12px;font-weight:600;margin-top:2px}
.header-action-btn{display:inline-flex;align-items:center;padding:9px 18px;background:#7C3AED;color:#fff;text-decoration:none;border:1px solid #6D28D9;border-radius:8px;font-family:var(--font-display);font-size:12.5px;font-weight:700;letter-spacing:.3px;white-space:nowrap;box-shadow:0 2px 6px rgba(124,58,237,.35);transition:all .15s}
.header-action-btn:hover{background:#6D28D9;border-color:#5B21B6;transform:translateY(-1px);box-shadow:0 4px 12px rgba(124,58,237,.45)}

/* ───────────── TABS ───────────── */
.tabs{display:flex;background:var(--header-bg);padding:0 32px;border-bottom:1px solid rgba(255,255,255,.08);overflow-x:auto}
.tab{padding:12px 24px;color:rgba(240,243,246,.5);cursor:pointer;font-family:var(--font-display);font-size:13px;font-weight:600;border-bottom:2px solid transparent;transition:all .2s;letter-spacing:.2px;white-space:nowrap}
.tab:hover{color:var(--header-text)}
.tab.active{color:var(--header-text);border-bottom-color:var(--accent)}

/* ───────────── FILTERS ───────────── */
.filters{display:flex;gap:16px;padding:16px 32px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-group label{font-family:var(--font-display);font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.8px}
.filter-group input,.filter-group select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font-body);font-size:13px;background:var(--surface);color:var(--text);transition:border .2s}
.filter-group input{min-width:340px}
.filter-group select{min-width:180px}
.filter-group input:focus,.filter-group select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,98,254,.08)}

/* ───────────── CONTENT ───────────── */
.content{padding:24px 32px}

/* ───────────── KPI CARDS ───────────── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:24px}
.card{background:var(--surface);padding:18px 16px;border-radius:var(--radius-lg);box-shadow:var(--shadow);border-left:4px solid var(--border);transition:all .15s}
.card:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.card.overall{border-left-color:var(--gold)}
.card.s1{border-left-color:var(--ovr-1)}
.card.s2{border-left-color:var(--ovr-2)}
.card.s3{border-left-color:var(--ovr-3-border)}
.card.s4{border-left-color:var(--ovr-4)}
.card.s5{border-left-color:var(--ovr-5)}
.card .label{font-family:var(--font-display);font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:.8px;margin-bottom:8px}
.card .value{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.5px;color:var(--text)}
.card .sub{font-size:11px;color:var(--text-muted);margin-top:6px;font-weight:500}

/* ───────────── LEGEND BAR ───────────── */
.legend-bar{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:20px;border:1px solid var(--border);flex-wrap:wrap}
.legend-bar .legend-title{font-family:var(--font-display);font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.8px;margin-right:8px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text)}
.legend-swatch{width:14px;height:14px;border-radius:3px}

/* ───────────── GRID SECTIONS ───────────── */
.grid-section{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:24px;margin-bottom:24px;border:1px solid var(--border);position:relative}
.grid-section h3{font-family:var(--font-display);font-size:13px;font-weight:700;margin-bottom:16px;letter-spacing:.5px}
.section-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.section-header h3{margin:0;flex:1;min-width:0}
.section-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.desc-block{color:var(--text);font-size:13.5px;line-height:1.7;max-width:80ch}
.desc-block + .desc-block{margin-top:8px;color:var(--text-muted);font-style:italic;font-size:12.5px}

/* Section groups (collapsible row dividers) */
details.section-group{margin:24px 0 0 0}
details.section-group:first-of-type{margin-top:8px}
details.section-group > summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;user-select:none;padding:6px 2px 10px;border-bottom:1px solid var(--border);margin-bottom:14px;font-family:var(--font-display);font-size:12.5px;font-weight:700;letter-spacing:0;color:var(--text-muted)}
details.section-group > summary > :first-child{flex:1;min-width:0}
details.section-group > summary::-webkit-details-marker{display:none}
details.section-group > summary::marker{display:none}
details.section-group > summary::after{content:'▾';color:var(--text-muted);font-size:12px;transition:transform .2s ease;line-height:1}
details.section-group[open] > summary::after{transform:rotate(180deg)}
details.section-group > summary:hover{color:var(--text)}

/* ───────────── TABLES ───────────── */
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:10px 12px;text-align:left;font-family:var(--font-display);font-weight:700;color:var(--text-muted);font-size:10px;letter-spacing:.8px;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-weight:500;vertical-align:top}
tr{transition:background .1s}
tr:hover td{background:var(--bg)}
.pending-table th,.pending-table td{text-align:center;vertical-align:middle}

/* Field table — left-aligned for readability of long descriptions */
.field-table th{text-align:left}
.field-table td{text-align:left;vertical-align:top}
.field-table td.field-name{font-family:'JetBrains Mono','Consolas',monospace;font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;width:230px}
.field-table td.field-type{width:180px;white-space:nowrap}
.field-table td.field-req{width:90px;text-align:center}
.field-table td.field-desc{color:var(--text);font-size:12.5px;line-height:1.55}
.field-table td.field-desc small{display:block;margin-top:4px;color:var(--text-muted);font-size:11px;font-style:italic}

/* ───────────── VALUE PILLS / BADGES ───────────── */
.val-cell{display:inline-block;border-radius:4px;padding:3px 8px;font-family:var(--font-display);font-weight:700;font-size:11px;text-align:center;letter-spacing:.2px}
.vc-string{background:var(--accent-light);color:var(--accent);border:1px solid rgba(15,98,254,.3)}
.vc-number{background:#ECFDF5;color:var(--score-5-bg);border:1px solid #6EE7B7}
.vc-bool{background:var(--score-2-bg);color:var(--score-2);border:1px solid var(--score-2-light)}
.vc-datetime{background:#F3E8FF;color:#7C3AED;border:1px solid #C4B5FD}
.vc-enum{background:var(--bg);color:var(--score-3);border:1px solid var(--score-3-border)}
.vc-array{background:#FFFBEB;color:#92400E;border:1px solid var(--gold)}
.vc-map{background:#FEF2F2;color:var(--score-1);border:1px solid var(--score-1-light)}
.vc-ref{background:#FFFBEB;color:#92400E;border:1px solid var(--gold);cursor:pointer;text-decoration:none;transition:all .15s}
.vc-ref:hover{background:var(--gold);color:#fff;border-color:#92400E}

.req-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.3px}
.req-yes{background:#FEF2F2;color:var(--score-1);border:1px solid var(--score-1-light)}
.req-no{background:var(--bg);color:var(--text-muted);border:1px solid var(--border)}

.status-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.2px;white-space:nowrap}

/* ───────────── ENUM PILLS (inline below field description) ───────────── */
.enum-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.enum-pill{font-family:'JetBrains Mono','Consolas',monospace;font-size:10.5px;color:var(--text);background:var(--bg);border:1px solid var(--border);padding:2px 7px;border-radius:3px;font-weight:500}

/* ───────────── ROSTER-STYLE RELATED ENTITIES ───────────── */
.roster-section{margin-top:0;margin-bottom:24px;background:var(--surface);border:1px solid #C4B5FD;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.roster-section > summary{padding:14px 20px;cursor:pointer;list-style:none;font-family:var(--font-display);font-size:13px;font-weight:700;color:#5B21B6;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:10px;user-select:none;background:#EDE9FE;transition:background .15s}
.roster-section > summary:hover{background:#DDD6FE}
.roster-section > summary::-webkit-details-marker{display:none}
.roster-section > summary::marker{display:none}
.roster-section > summary::after{content:'▾';font-size:11px;color:#6D28D9;transition:transform .2s ease}
.roster-section[open] > summary::after{transform:rotate(180deg)}
.roster-section[open] > summary{border-bottom:1px solid #C4B5FD}
.roster-section .roster-count{font-size:10px;font-weight:700;color:#6D28D9;letter-spacing:.4px;background:var(--surface);padding:3px 8px;border-radius:10px;border:1px solid #C4B5FD}
.roster-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:14px 20px}
.roster-btn{padding:8px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font-display);font-size:12px;font-weight:600;color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap;line-height:1.2;display:inline-flex;align-items:center;gap:8px}
.roster-btn:hover{border-color:var(--accent);background:var(--accent-light);color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.roster-btn .rel-dot{width:7px;height:7px;border-radius:50%;background:var(--rel-color,var(--accent));flex-shrink:0}

/* ───────────── HIERARCHY DIAGRAM ───────────── */
.hierarchy{display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:20px}
.hier-node{display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:14px 24px;background:var(--surface);border:2px solid var(--rel-color,var(--accent));border-radius:var(--radius);min-width:200px;cursor:pointer;transition:all .2s;text-align:center;box-shadow:var(--shadow-sm)}
.hier-node:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.hier-node .hier-label{font-family:var(--font-display);font-size:13px;font-weight:800;color:var(--text);letter-spacing:-.2px}
.hier-node .hier-sub{font-size:10.5px;color:var(--text-muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.hier-conn{width:2px;height:24px;background:var(--border);position:relative}
.hier-conn::after{content:'';position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-right:2px solid var(--text-muted);border-bottom:2px solid var(--text-muted);transform:rotate(45deg);background:transparent}
.hier-branch{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}

/* ───────────── BUTTONS ───────────── */
.btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;font-family:var(--font-display);font-size:10.5px;font-weight:600;color:var(--text-muted);letter-spacing:.3px;transition:all .15s;line-height:1;text-decoration:none}
.btn-ghost:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}

/* Field name CSR-link style for clickable type refs */
.csr-link{color:var(--text);cursor:pointer;text-decoration:none;font-weight:600;transition:color .15s}
.csr-link:hover{text-decoration:underline;color:var(--accent)}

/* Highlighting search matches */
.match-row td{background:linear-gradient(90deg,rgba(15,98,254,.06) 0%,transparent 80%)!important}
.match-row td.field-name{background:linear-gradient(90deg,rgba(15,98,254,.12) 0%,rgba(15,98,254,.04) 100%)!important}

/* No data */
.no-data{text-align:center;padding:60px;color:var(--text-muted)}
.no-data .icon-lg{font-size:48px;margin-bottom:12px;opacity:.3}
.no-data .title{font-family:var(--font-display);font-size:15px;font-weight:600}
.no-data .sub{font-size:13px;margin-top:6px}

/* Footer attribution */
.footer-note{margin-top:24px;padding-top:18px;border-top:1px solid var(--border);color:var(--text-muted);font-size:11.5px;font-style:italic;line-height:1.5}

/* Scrollbars */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#9CA3AF}

/* ───────────── SCHEMA MAP (SVG) ───────────── */
.schema-map-wrap{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px 12px 12px;
  position:relative;
  /* Subtle dot grid backdrop helps SVG nodes feel anchored to a "canvas" */
  background-image:radial-gradient(circle, #D8DCE2 1px, transparent 1px);
  background-size:18px 18px;
  background-position:0 0;
}
.schema-svg{width:100%;height:auto;display:block;max-height:680px}
.schema-svg .conn{
  stroke:#94A3B8;
  stroke-width:1.5;
  fill:none;
  stroke-linecap:round;
  transition:stroke 0.25s, stroke-width 0.25s, opacity 0.25s;
}
.schema-svg .conn.dimmed{opacity:.15}
.schema-svg .conn.highlighted{stroke:var(--accent);stroke-width:2.5;opacity:1}
.schema-svg .entity-node{cursor:pointer;transition:transform 0.2s ease, opacity 0.25s ease}
.schema-svg .entity-node:hover{transform:translateY(-3px)}
.schema-svg .entity-node.dimmed{opacity:.2}
.schema-svg .entity-node.highlighted .entity-box{stroke-width:2.5}
.schema-svg .entity-node .entity-box{
  fill:#fff;
  stroke:var(--node-color,#9CA3AF);
  stroke-width:1.5;
  transition:all 0.2s ease;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.08));
}
.schema-svg .entity-node:hover .entity-box{
  stroke-width:2.5;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.15));
}
.schema-svg .entity-strip{fill:var(--node-color,#9CA3AF)}
.schema-svg .entity-name{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:12px;
  font-weight:800;
  fill:var(--text);
  letter-spacing:.6px;
  pointer-events:none;
}
.schema-svg .entity-count{
  font-family:'DM Sans',sans-serif;
  font-size:10.5px;
  font-weight:500;
  fill:var(--text-muted);
  pointer-events:none;
}
.schema-svg .entity-badge{
  font-family:'JetBrains Mono','Consolas',monospace;
  font-size:9px;
  font-weight:700;
  fill:var(--node-color);
  letter-spacing:1px;
  text-transform:uppercase;
  pointer-events:none;
}
.map-legend{
  display:flex;align-items:center;
  padding:10px 14px;
  font-family:var(--font-display);
  font-size:11px;font-weight:600;
  color:var(--text-muted);
  margin-top:4px;
  background:var(--surface);
  border-radius:var(--radius);
  border:1px solid var(--border);
  flex-wrap:wrap;gap:8px 18px;
}

/* Hover-path indicator — small badge above the diagram showing which path is
   currently traced. Updated by setupMapHoverTracing on mouseenter/leave. */
.map-path-indicator{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 12px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:99px;
  font-family:'JetBrains Mono','Consolas',monospace;
  font-size:10.5px;font-weight:600;
  color:var(--text-muted);
  letter-spacing:.5px;
  margin-bottom:12px;
  transition:all 0.2s ease;
  min-height:30px;
}
.map-path-indicator.active{
  background:var(--accent-light);
  border-color:var(--accent);
  color:var(--accent);
}
.map-path-indicator .crumb-sep{color:#9CA3AF;margin:0 2px}

/* ───────────── ERD (Entity Relationship Diagram) ───────────── */
/* The Schema Map tab now contains only the ERD. Every field is rendered, with
   PK rows tinted in amber and FK rows marked with blue indicators. Relationship
   lines emerge from the PK row of the parent entity and route orthogonally to
   the child, making the lineage visually traceable from the literal source row. */
.erd-wrap{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  overflow:auto;
  max-height:82vh;
  /* Soft grid backdrop so boxes feel anchored on a canvas */
  background-image:
    linear-gradient(to right, #E8ECF1 1px, transparent 1px),
    linear-gradient(to bottom, #E8ECF1 1px, transparent 1px);
  background-size:24px 24px;
}
.erd-svg{
  display:block;
  width:1320px;
  height:auto;
  min-width:1320px;
}
.erd-entity{cursor:pointer;transition:transform 0.2s ease}
.erd-entity:hover{transform:translateY(-2px)}
.erd-entity .erd-box{
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.06));
  transition:filter 0.2s ease;
}
.erd-entity:hover .erd-box{
  filter:drop-shadow(0 14px 32px rgba(0,0,0,.2));
}
.erd-title{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:12px;
  font-weight:800;
  fill:#fff;
  letter-spacing:1.2px;
  text-transform:uppercase;
  pointer-events:none;
}
.erd-field-text{
  font-family:'JetBrains Mono','Consolas',monospace;
  font-size:11px;
  fill:var(--text);
  pointer-events:none;
}
.erd-pk-text{font-weight:700;fill:#8B6914;letter-spacing:.2px}
.erd-fk-text{fill:var(--text)}
.erd-tag-text{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:9px;
  font-weight:800;
  letter-spacing:.7px;
  pointer-events:none;
}
.erd-type-text{

/* ───────────── PASSWORD GATE ───────────── */
/* Horizontal split card: dark slate brand panel on the left carrying the title
   + a miniature SVG of the actual schema hierarchy (telegraphing what's behind
   the gate), white form panel on the right. Visually distinct from any standard
   centered modal — reads as a custom developer-tool entry point. */
.password-gate{
  position:fixed;inset:0;
  background:rgba(13,17,23,.62);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  z-index:10000;padding:20px;
  animation:fadeIn .35s ease;
}
.password-gate.hidden{display:none}
.password-card{
  display:flex;flex-direction:row;
  background:var(--surface);
  border-radius:var(--radius-lg);
  box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.04);
  max-width:580px;width:100%;
  min-height:320px;
  overflow:hidden;
  animation:fadeInUp .5s cubic-bezier(.16,1,.3,1);
}

/* LEFT: dark brand panel */
.pw-brand{
  flex:0 0 240px;
  background:#0D1117;
  /* Soft color washes from the entity palette suggest the rainbow without
     drawing a hard stripe — feels integrated rather than decorative */
  background-image:
    radial-gradient(circle at 20% 25%, rgba(15,98,254,.22) 0%, transparent 55%),
    radial-gradient(circle at 85% 85%, rgba(124,58,237,.18) 0%, transparent 55%),
    radial-gradient(circle at 60% 10%, rgba(212,160,23,.12) 0%, transparent 45%);
  color:#fff;
  padding:30px 24px 22px;
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;
  overflow:hidden;
}
/* Thin entity-palette accent strip running down the right edge separates the
   panels and ties the gate to the schema color system */
.pw-brand::after{
  content:'';
  position:absolute;top:0;right:0;bottom:0;width:2px;
  background:linear-gradient(180deg,
    #D4A017 0%, #C2410C 17%, #DC2626 33%,
    #1E40AF 50%, #0EA5E9 66%, #047857 83%, #7C3AED 100%);

}
.pw-eyebrow{
  font-family:'JetBrains Mono','Consolas',monospace;
  font-size:10px;font-weight:600;

  text-transform:uppercase;
  margin-bottom:10px;
  position:relative;
}
.pw-brand h2{

  font-size:21px;font-weight:700;

}

.pw-mini-schema{

}

.pw-mini-caption{

  font-size:9px;font-weight:500;
  color:rgba(255,255,255,.4);
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin-top:10px;
  text-align:center;
}

/* RIGHT: white form panel */
.pw-body{
  flex:1;
  padding:30px 30px 24px;
  display:flex;flex-direction:column;
  background:var(--surface);
}
.pw-body p{
  font-size:13px;color:var(--text-muted);
  margin:0 0 18px;line-height:1.55;
}
.password-form{display:flex;flex-direction:column;gap:10px}
.password-form input{
  padding:12px 14px;
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  font-family:var(--font-body);
  font-size:14px;
  letter-spacing:1.5px;

  background:var(--surface);color:var(--text);
}
.password-form input::placeholder{letter-spacing:.5px;color:#9CA3AF}
.password-form input:focus{

  box-shadow:0 0 0 4px rgba(15,98,254,.12);
}
.password-form input.error{
  border-color:var(--score-1);
  background:var(--score-1-bg);
  animation:shake .4s;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%,60%{transform:translateX(-6px)}
  40%,80%{transform:translateX(6px)}
}
.password-form button{
  padding:11px 18px;
  background:#1F6FBA;color:#fff;
  border:none;border-radius:var(--radius);
  font-family:var(--font-display);
  font-size:13px;font-weight:700;
  letter-spacing:.4px;cursor:pointer;
  transition:all .15s;
}
.password-form button:hover{

}
.password-form button:active{transform:translateY(0)}
.password-error{

.password-footer{

  line-height:1.4;
}

}

const ACCESS_PASSWORD = 'schemademo';

function checkPassword(){
  const input = document.getElementById('passwordInput');
  const errEl = document.getElementById('passwordError');
  const gate = document.getElementById('passwordGate');
  if((input.value || '').trim() === ACCESS_PASSWORD){
    try { sessionStorage.setItem('schemaAccess','granted'); } catch(e){}
    gate.classList.add('hidden');
    errEl.textContent = '';
  } else {
    input.classList.add('error');
    errEl.textContent = 'Incorrect password. Try again.';
    setTimeout(()=>{
      input.classList.remove('error');
      input.value = '';
      input.focus();
    }, 450);
  }
}

// Skip the gate if already unlocked this session

  if(sessionStorage.getItem('schemaAccess') === 'granted'){

const ENTITY_BADGE = {
  Conversation: 'ROOT',
  Participant:  'L1',
  Session:      'L2',
  Segment:      'L3',
  Flow:         'L3',
  MediaEndpointStat: 'L3',
  Survey:       'L1',
  Evaluation:   'L1'
};

/* Box positions on a 960×640 viewBox. Width 170 × height 76 with rounded
   corners. Arranged so connection lines bezier cleanly between parent and
   child rows without crossing. */
const DIAGRAM_LAYOUT = {
  Conversation:      { x: 395, y: 30  },
  Survey:            { x: 100, y: 190 },
  Participant:       { x: 395, y: 190 },
  Evaluation:        { x: 690, y: 190 },
  Session:           { x: 395, y: 360 },
  Segment:           { x: 100, y: 530 },
  Flow:              { x: 395, y: 530 },
  MediaEndpointStat: { x: 690, y: 530 }
};

/* ───────────────── JSON SYNTAX HIGHLIGHTER ───────────────── */
/* Two-pass tokenizer with placeholder extraction. Strings are extracted FIRST
   into Unicode private-use-area markers (\uE001 … \uE002) so that ISO
   timestamps like "2026-05-15T14:23:01.420Z" — which contain inner colons
   that would otherwise trigger the number regex — are protected. After
   booleans/numbers are wrapped on the remaining (string-free) source,
   strings are restored and classified as keys or values by checking for a
   trailing colon. */
function highlightJSON(obj){
  let s = JSON.stringify(obj, null, 2);
  s = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // 1) Stash strings safely
  const strings = [];
  s = s.replace(/"(?:[^"\\]|\\.)*"/g, m => {
    strings.push(m);
    return '\uE001' + (strings.length - 1) + '\uE002';
  });

  // 2) Anchor non-string tokens to a preceding `:` so digits inside placeholder
  //    indices (e.g. \uE0014\uE002) are never matched as numbers.
  s = s.replace(/(:\s*)(true|false|null)\b/g, '$1<span class="j-bool">$2</span>');
  s = s.replace(/(:\s*)(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g, '$1<span class="j-num">$2</span>');

  // 3) Restore strings. Trailing `:` → key; otherwise value/array item.
  s = s.replace(/\uE001(\d+)\uE002(\s*:)?/g, (match, idx, colon) => {
    const str = strings[parseInt(idx, 10)];
    return colon
      ? '<span class="j-key">' + str + '</span>' + colon
      : '<span class="j-str">' + str + '</span>';
  });

  return s;
}

function buildSampleJSONSection(entityId){
  if(!SAMPLE_JSON[entityId]) return '';
  const obj = SAMPLE_JSON[entityId];
  const jsonStr = JSON.stringify(obj, null, 2);
  // Escape for safe attribute embedding (single quotes + ampersands handled by data-)
  const encoded = encodeURIComponent(jsonStr);
  return '<div class="grid-section">' +
    '<div class="section-header"><h3>Sample Shape</h3></div>' +
    '<div class="desc-block" style="margin-bottom:14px">An illustrative <strong>' + esc(entityId) + '</strong> record as returned by the Conversation Detail Query. UUIDs are abbreviated for readability; nested entities are condensed to a single example each.</div>' +
    '<pre class="json-block"><button class="json-copy-btn" data-json="' + encoded + '" onclick="copyJSON(this)">Copy</button>' + highlightJSON(obj) + '</pre>' +
  '</div>';
}

function copyJSON(btn){
  try {
    const json = decodeURIComponent(btn.dataset.json);
    navigator.clipboard.writeText(json).then(() => {
      const originalText = btn.textContent;
      btn.textContent = '✓ Copied';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = originalText;
        btn.classList.remove('copied');
      }, 1500);
    });
  } catch(e){
    console.warn('Copy failed:', e);
  }
}

/* ───────────────── RELATIONSHIP TRACING ───────────────── */
/* Single-parent hierarchy. Used by setupMapHoverTracing to compute the full
   ancestor-chain + descendant-tree of any node on mouseenter. */
const ENTITY_RELATIONS = {
  Conversation:      { parent: null,           children: ['Survey','Participant','Evaluation'] },
  Survey:            { parent: 'Conversation', children: [] },
  Participant:       { parent: 'Conversation', children: ['Session'] },
  Evaluation:        { parent: 'Conversation', children: [] },
  Session:           { parent: 'Participant',  children: ['Segment','Flow','MediaEndpointStat'] },
  Segment:           { parent: 'Session',      children: [] },
  Flow:              { parent: 'Session',      children: [] },
  MediaEndpointStat: { parent: 'Session',      children: [] }
};

/* Order matches buildConnections() — index N in this array corresponds to the
   Nth <path> element in the rendered SVG, so the hover handler can flip the
   correct connection lines without DOM querying. */
const CONNECTION_PAIRS = [
  ['Conversation','Survey'],
  ['Conversation','Participant'],
  ['Conversation','Evaluation'],
  ['Participant','Session'],
  ['Session','Segment'],
  ['Session','Flow'],
  ['Session','MediaEndpointStat']
];

function getRelatedSet(id){
  const set = new Set([id]);
  // Walk up the parent chain
  let cur = id;
  while(ENTITY_RELATIONS[cur] && ENTITY_RELATIONS[cur].parent){
    cur = ENTITY_RELATIONS[cur].parent;
    set.add(cur);
  }
  // Walk down all descendants (BFS)
  const queue = [id];
  while(queue.length){
    const e = queue.shift();
    (ENTITY_RELATIONS[e] && ENTITY_RELATIONS[e].children || []).forEach(child => {
      if(!set.has(child)){
        set.add(child);
        queue.push(child);
      }
    });
  }
  return set;
}

function buildBreadcrumb(id){
  // Walks up to Root, returns the path string e.g. "Conversation › Participant › Session"
  const chain = [id];
  let cur = id;
  while(ENTITY_RELATIONS[cur] && ENTITY_RELATIONS[cur].parent){
    cur = ENTITY_RELATIONS[cur].parent;
    chain.unshift(cur);
  }
  return chain.map(e => '<span>' + e + '</span>').join('<span class="crumb-sep">›</span>');
}

function setupMapHoverTracing(){
  const svg = document.querySelector('.schema-svg');
  if(!svg) return;
  const nodes = svg.querySelectorAll('.entity-node');
  const paths = svg.querySelectorAll('.connections .conn');
  const indicator = document.getElementById('mapPathIndicator');

  nodes.forEach(node => {
    const eid = node.getAttribute('data-entity');
    node.addEventListener('mouseenter', () => {
      const related = getRelatedSet(eid);
      nodes.forEach(n => {
        const nid = n.getAttribute('data-entity');
        n.classList.toggle('dimmed', !related.has(nid));
        n.classList.toggle('highlighted', related.has(nid));
      });
      paths.forEach((p, i) => {
        const pair = CONNECTION_PAIRS[i];
        const onPath = related.has(pair[0]) && related.has(pair[1]);
        p.classList.toggle('dimmed', !onPath);
        p.classList.toggle('highlighted', onPath);
      });
      if(indicator){
        indicator.innerHTML = buildBreadcrumb(eid);
        indicator.classList.add('active');
      }
    });
    node.addEventListener('mouseleave', () => {
      nodes.forEach(n => { n.classList.remove('dimmed','highlighted'); });
      paths.forEach(p => p.classList.remove('dimmed','highlighted'));
      if(indicator){
        indicator.innerHTML = 'Hover any entity to trace its hierarchy path';
        indicator.classList.remove('active');
      }
    });
  });
}

/* ───────────────── ERD (ENTITY RELATIONSHIP DIAGRAM) ───────────────── */
/* The Schema Map tab now shows a single refined ERD. Every field of every
   entity is rendered. The parent's primary key drives the relationship
   visually — connection lines emerge from the right or left edge of the
   parent's PK row (whichever is closer to the child), route orthogonally,
   and terminate with a crow's-foot at the child entity. Connection lines
   carry the parent's entity color so lineage is identifiable by hue. */

/* Primary-key field name for each entity. Segment and MediaEndpointStat have
   no surrogate PK in the Genesys data model (they're identified by position
   inside the parent array), so connection lines from a parent that targets
   them still arrive at the top of the child box; they just don't outgoing-
   originate from a PK row since neither has children. */
const ENTITY_PK = {
  Conversation:      'conversationId',
  Participant:       'participantId',
  Session:           'sessionId',
  Survey:            'surveyId',
  Evaluation:        'evaluationId',
  Flow:              'flowId',
  Segment:           null,
  MediaEndpointStat: null
};

function getPKRowIndex(entityId){
  const pkName = ENTITY_PK[entityId];
  if(!pkName) return -1;
  const fields = SCHEMA[entityId].fields;
  for(let i = 0; i < fields.length; i++){
    if(fields[i].n === pkName) return i;
  }
  return -1;
}

/* FK detection: any field whose name ends in "Id" or "Ids" and isn't the
   entity's own primary key. Matches the Genesys convention where foreign
   references to User, Queue, Team, Form, etc. always use that suffix. */
function isFKField(entityId, fieldName){
  if(fieldName === ENTITY_PK[entityId]) return false;
  return /Id$|Ids$/.test(fieldName);
}

/* Abbreviated type label for the right column of each row. Keeps the row
   width contained while still surfacing the field's shape. */
function abbrevType(f){
  const t = f.t || '';
  const s = f.subt || '';
  if(t === 'array')    return s ? 'arr<' + s + '>' : 'arr';
  if(t === 'datetime') return 'ts';
  if(t === 'enum')     return 'enum';
  if(t === 'boolean')  return 'bool';
  if(t === 'number')   return 'num';
  if(t === 'object')   return 'obj';
  if(t === 'string')   return s && s.toLowerCase() === 'uuid' ? 'uuid' : 'str';
  return t;
}

const ERD_BOX_W      = 280;
const ERD_HEADER_H   = 38;
const ERD_ROW_H      = 22;
const ERD_PAD_BOTTOM = 14;
const ERD_COL_X      = [80, 520, 960];
const ERD_ROWS = [
  ['Conversation'],
  ['Survey', 'Participant', 'Evaluation'],
  ['Session'],
  ['Segment', 'Flow', 'MediaEndpointStat']
];
const ERD_ROW_GAP    = 90;
const ERD_MARGIN_TOP = 30;
const ERD_VIEWBOX_W  = 1320;

const ERD_CONNECTIONS = [
  ['Conversation', 'Survey'],
  ['Conversation', 'Participant'],
  ['Conversation', 'Evaluation'],
  ['Participant',  'Session'],
  ['Session',      'Segment'],
  ['Session',      'Flow'],
  ['Session',      'MediaEndpointStat']
];

// Set of entities that have at least one outgoing relationship. Used by the
// box renderer to decide whether to draw the lineage spine.
const ERD_PARENTS = new Set(ERD_CONNECTIONS.map(pair => pair[0]));

/* Dynamic layout — each row's vertical span is governed by its tallest entity,
   so Session (26 fields) gets the room it needs without compressing the rows
   around it. Returns both the {id: {x,y,h}} map and the total canvas height. */
function computeERDLayout(){
  const layout = {};
  let y = ERD_MARGIN_TOP;
  ERD_ROWS.forEach(rowEntities => {
    let maxH = 0;
    rowEntities.forEach(id => {
      const h = ERD_HEADER_H + SCHEMA[id].fields.length * ERD_ROW_H + ERD_PAD_BOTTOM;
      if(h > maxH) maxH = h;
    });
    if(rowEntities.length === 1){
      layout[rowEntities[0]] = { x: ERD_COL_X[1], y: y, h: ERD_HEADER_H + SCHEMA[rowEntities[0]].fields.length * ERD_ROW_H + ERD_PAD_BOTTOM };
    } else {
      rowEntities.forEach((id, i) => {
        layout[id] = { x: ERD_COL_X[i], y: y, h: ERD_HEADER_H + SCHEMA[id].fields.length * ERD_ROW_H + ERD_PAD_BOTTOM };
      });
    }
    y += maxH + ERD_ROW_GAP;
  });
  const totalHeight = y - ERD_ROW_GAP + ERD_MARGIN_TOP;
  return { layout, totalHeight };
}

function buildERDBox(id, pos){
  const fields = SCHEMA[id].fields;
  const color = ENTITY_COLORS[id];
  const w = ERD_BOX_W;
  const h = pos.h;
  const pkIdx = getPKRowIndex(id);

  let svg = '<g class="erd-entity" data-entity="' + id + '" onclick="navigateToEntity(\'' + id + '\')" transform="translate(' + pos.x + ',' + pos.y + ')">';

  // Body
  svg += '<rect class="erd-box" width="' + w + '" height="' + h + '" rx="6" fill="#fff" stroke="' + color + '" stroke-width="1.5"/>';

  // Header (rounded top corners via overlay technique)
  svg += '<rect width="' + w + '" height="' + ERD_HEADER_H + '" rx="6" fill="' + color + '"/>';
  svg += '<rect y="' + (ERD_HEADER_H - 8) + '" width="' + w + '" height="8" fill="' + color + '"/>';
  svg += '<text class="erd-title" x="' + (w / 2) + '" y="' + (ERD_HEADER_H / 2 + 4.5) + '" text-anchor="middle">' + ENTITY_DISPLAY[id] + '</text>';

  // Field rows
  fields.forEach((f, i) => {
    const rowTop = ERD_HEADER_H + i * ERD_ROW_H;
    const textY = rowTop + ERD_ROW_H / 2 + 4;
    const isPK = i === pkIdx;
    const isFK = isFKField(id, f.n);

    // PK row background tint (subtle amber wash, only on the PK row)
    if(isPK){
      svg += '<rect class="erd-pk-row-bg" x="1" y="' + rowTop + '" width="' + (w - 2) + '" height="' + ERD_ROW_H + '"/>';
    }

    // Row divider above each row except the first
    if(i > 0){
      svg += '<line class="erd-row-divider" x1="10" y1="' + rowTop + '" x2="' + (w - 10) + '" y2="' + rowTop + '"/>';
    }

    // Role indicator dot (PK amber / FK blue / regular small gray)
    if(isPK){
      svg += '<circle cx="14" cy="' + (rowTop + ERD_ROW_H / 2) + '" r="3.8" fill="#D4A017"/>';
    } else if(isFK){
      svg += '<circle cx="14" cy="' + (rowTop + ERD_ROW_H / 2) + '" r="3.5" fill="#1F6FBA"/>';
    } else {
      svg += '<circle cx="14" cy="' + (rowTop + ERD_ROW_H / 2) + '" r="1.6" fill="#CBD5E1"/>';
    }

    // Field name
    const nameCls = isPK ? 'erd-field-text erd-pk-text' : 'erd-field-text';
    svg += '<text class="' + nameCls + '" x="26" y="' + textY + '">' + esc(f.n) + '</text>';

    // PK / FK tag (right-aligned)
    if(isPK){
      svg += '<text class="erd-tag-text" x="' + (w - 12) + '" y="' + textY + '" text-anchor="end" style="fill:#D4A017">PK</text>';
    } else if(isFK){
      svg += '<text class="erd-tag-text" x="' + (w - 12) + '" y="' + textY + '" text-anchor="end" style="fill:#1F6FBA">FK</text>';
    }
  });

  // Lineage spine — only for entities that own outgoing relationships. The
  // spine is a vertical entity-color line running along the box's left margin,
  // anchored at the top of the PK row and exiting at the bottom edge of the
  // box. It tucks just inside the colored border at x=7 so it never crosses
  // field text. The outgoing connection line (drawn separately) starts at the
  // exact same point at which the spine exits, so the two read as one
  // continuous stroke from the PK row all the way to the child entity.
  const hasChildren = ERD_PARENTS.has(id);
  if(hasChildren && pkIdx >= 0){
    const spineTopY = ERD_HEADER_H + pkIdx * ERD_ROW_H;
    svg += '<line x1="7" y1="' + spineTopY + '" x2="7" y2="' + h + '" stroke="' + color + '" stroke-width="2" stroke-linecap="round"/>';
    // Small notch at the spine's origin so the eye lands on the PK row when
    // tracing a relationship backward.
    svg += '<circle cx="7" cy="' + (spineTopY + ERD_ROW_H / 2) + '" r="3" fill="' + color + '"/>';
  }

  svg += '</g>';
  return svg;
}

function buildERDConnection(parentId, childId, layout){
  const p = layout[parentId];
  const c = layout[childId];
  const w = ERD_BOX_W;
  const parentColor = ENTITY_COLORS[parentId];

  // The connection line starts at the same point where the lineage spine
  // exits the parent box (x = p.x + 7, y = bottom of box). This makes the
  // spine + connection read as one continuous PK-rooted stroke.
  const exitX = p.x + 7;
  const exitY = p.y + p.h;
  const ccx = c.x + w / 2;
  const cTopY = c.y;
  const midY = (exitY + cTopY) / 2;
  const endY = cTopY - 10; // stop short to leave room for the crow's foot

  let svg = '';

  // Orthogonal connection: down to the mid corridor, across to the child's
  // column, down to the child's top. Same x-origin for every child of this
  // parent so the children visually fan out from one anchor point.
  svg += '<path class="erd-conn" d="M ' + exitX + ' ' + exitY +
         ' V ' + midY +
         ' H ' + ccx +
         ' V ' + endY + '" stroke="' + parentColor + '" stroke-width="2"/>';

  // "One" notation — horizontal bar perpendicular to the initial vertical
  // descent, placed close to the parent so the cardinality reads near its
  // owner.
  const oneY = exitY + 14;
  svg += '<line class="erd-cardinality" x1="' + (exitX - 7) + '" y1="' + oneY + '" x2="' + (exitX + 7) + '" y2="' + oneY + '" stroke="' + parentColor + '" stroke-width="2.2"/>';

  // Crow's foot at the child end — three lines fanning into the child's top
  svg += '<g class="erd-cardinality" stroke="' + parentColor + '" stroke-width="1.8">';
  svg += '<line x1="' + ccx + '" y1="' + endY + '" x2="' + (ccx - 9) + '" y2="' + cTopY + '"/>';
  svg += '<line x1="' + ccx + '" y1="' + endY + '" x2="' + ccx + '" y2="' + cTopY + '"/>';
  svg += '<line x1="' + ccx + '" y1="' + endY + '" x2="' + (ccx + 9) + '" y2="' + cTopY + '"/>';
  svg += '</g>';

  return svg;
}

function buildERD(){
  const { layout, totalHeight } = computeERDLayout();
  const viewBox = '0 0 ' + ERD_VIEWBOX_W + ' ' + totalHeight;

  let svg = '<svg class="erd-svg" viewBox="' + viewBox + '" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="height:' + totalHeight + 'px">';

  // Draw connections first so entity boxes render on top of any crossings
  ERD_CONNECTIONS.forEach(pair => {
    svg += buildERDConnection(pair[0], pair[1], layout);
  });
  // Then all entity boxes
  Object.keys(layout).forEach(id => {
    svg += buildERDBox(id, layout[id]);
  });
  svg += '</svg>';
  return svg;
}

/* ───────────────── SCHEMA MAP RENDERER ───────────────── */
function buildEntityNode(id, viewMode){
  const e = SCHEMA[id];
  const pos = DIAGRAM_LAYOUT[id];
  const color = ENTITY_COLORS[id];
  const w = 170, h = 76;
  const cx = pos.x + w/2;
  const reqCount = e.fields.filter(f => f.req).length;

  let subtitle = e.fields.length + ' fields';
  if(viewMode === 'required') subtitle = reqCount + ' required · ' + e.fields.length + ' total';
  else if(viewMode === 'counts') subtitle = e.fields.length + ' fields · ' + (e.fields.filter(f => f.enums).length) + ' enums';

  return '<g class="entity-node" data-entity="' + id + '" style="--node-color:' + color + '" onclick="navigateToEntity(\'' + id + '\')">' +
    '<rect class="entity-box" x="' + pos.x + '" y="' + pos.y + '" width="' + w + '" height="' + h + '" rx="8"/>' +
    '<rect class="entity-strip" x="' + pos.x + '" y="' + pos.y + '" width="' + w + '" height="4" rx="2"/>' +
    '<text class="entity-badge" x="' + (pos.x + 12) + '" y="' + (pos.y + 22) + '">' + ENTITY_BADGE[id] + '</text>' +
    '<text class="entity-name" x="' + cx + '" y="' + (pos.y + 44) + '" text-anchor="middle">' + ENTITY_DISPLAY[id] + '</text>' +
    '<text class="entity-count" x="' + cx + '" y="' + (pos.y + 62) + '" text-anchor="middle">' + subtitle + '</text>' +
  '</g>';
}

function buildConnections(){
  const paths = [
    'M 480 106 C 480 145, 185 145, 185 190',  // Conversation → Survey
    'M 480 106 L 480 190',                     // Conversation → Participant
    'M 480 106 C 480 145, 775 145, 775 190',  // Conversation → Evaluation
    'M 480 266 L 480 360',                     // Participant → Session
    'M 480 436 C 480 480, 185 480, 185 530',  // Session → Segment
    'M 480 436 L 480 530',                     // Session → Flow
    'M 480 436 C 480 480, 775 480, 775 530'   // Session → MediaEndpointStat
  ];
  return paths.map(d => '<path class="conn" d="' + d + '"/>').join('');
}

  html += '<span class="erd-legend-item"><span class="dot" style="background:#1F6FBA"></span><strong style="color:#1F6FBA">FK</strong> Foreign key (external entity)</span>';

  container.innerHTML = html;

/* ───────────────── SCHEMA DATA ───────────────── */
const ENTITY_COLORS = {
  Conversation: '#D4A017',
  Participant:  '#C2410C',
  Session:      '#1E40AF',
  Segment:      '#7C3AED',
  Flow:         '#047857',
  MediaEndpointStat: '#EA580C',
  Survey:       '#DC2626',
  Evaluation:   '#0EA5E9',
  Metrics:      '#92400E'
};

const SCHEMA = {
  Conversation: {
    parent: null,
    desc: "The top-level interaction record. Aggregates every actor, channel, and lifecycle event involved in a single customer conversation across voice, chat, email, message, callback, social, and video.",
    note: "Returned by the Conversation Detail Query, the Analytics Aggregates Query, and the conversations notification topic.",
    fields: [
      { n: "conversationId", t: "string", subt: "UUID", req: true, d: "Unique identifier for the conversation. Stable across the entire interaction lifecycle." },
      { n: "conversationStart", t: "datetime", req: true, d: "Timestamp when the conversation began (first participant connected)." },
      { n: "conversationEnd", t: "datetime", d: "Timestamp when the conversation terminated. Absent for in-progress conversations." },
      { n: "originatingDirection", t: "enum", d: "Direction the conversation started in.", enums: ["inbound", "outbound"] },

/* ───────────────── HELPERS ───────────────── */
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function typeBadge(f){
  // Returns the type as a styled pill matching the val-cell convention
  if(f.t === 'ref' || f.t === 'ref-array'){
    const arrSuffix = f.t === 'ref-array' ? '[]' : '';
    return '<span class="val-cell vc-ref" onclick="navigateToEntity(\''+f.ref+'\')" title="Go to '+f.ref+' definition">'+esc(f.ref)+arrSuffix+'</span>';
  }
  let cls = 'vc-'+f.t;
  if(f.t === 'array') cls = 'vc-array';
  if(f.t === 'map') cls = 'vc-map';
  let label = f.t;
  if(f.t === 'array' && f.subt) label = f.subt+'[]';
  else if(f.t === 'map' && f.subt) label = 'Map<'+f.subt+'>';
  else if(f.t === 'integer') { label = 'integer'; cls = 'vc-number'; }
  else if(f.subt && f.t === 'string') label = f.subt;
  else if(f.subt && f.t === 'integer') label = f.subt;
  return '<span class="val-cell '+cls+'">'+esc(label)+'</span>';
}

function legendHTML(){
  return '<div class="legend-bar"><span class="legend-title">Type Legend</span>'+
    '<div class="legend-item"><div class="legend-swatch" style="background:var(--accent-light);border:1px solid rgba(15,98,254,.3)"></div><span style="color:var(--accent);font-weight:600">string</span></div>'+
    '<div class="legend-item"><div class="legend-swatch" style="background:#ECFDF5;border:1px solid #6EE7B7"></div><span style="color:var(--score-5-bg);font-weight:600">number/integer</span></div>'+
    '<div class="legend-item"><div class="legend-swatch" style="background:var(--score-2-bg);border:1px solid var(--score-2-light)"></div><span style="color:var(--score-2);font-weight:600">boolean</span></div>'+
    '<div class="legend-item"><div class="legend-swatch" style="background:#F3E8FF;border:1px solid #C4B5FD"></div><span style="color:#7C3AED;font-weight:600">datetime</span></div>'+
    '<div class="legend-item"><div class="legend-swatch" style="background:var(--bg);border:1px solid var(--score-3-border)"></div><span style="color:var(--score-3);font-weight:600">enum</span></div>'+
    '<div class="legend-item"><div class="legend-swatch" style="background:#FFFBEB;border:1px solid var(--gold)"></div><span style="color:#92400E;font-weight:600">array / reference</span></div>'+
    '<div class="legend-item"><div class="legend-swatch" style="background:#FEF2F2;border:1px solid var(--score-1-light)"></div><span style="color:var(--score-1);font-weight:600">map</span></div>'+
  '</div>';
}

/* ───────────────── ENTITY RENDERING ───────────────── */
function renderEntity(id, containerId, searchTerm){
  const e = SCHEMA[id];
  const container = document.getElementById(containerId);
  if(!e || !container) return;
  const color = ENTITY_COLORS[id];
  const reqCount = e.fields.filter(f => f.req).length;
  const refs = [...new Set(e.fields.filter(f => f.ref).map(f => f.ref))];
  const children = Object.entries(SCHEMA).filter(([k,v]) => v.parent === id).map(([k]) => k);
  const enumCount = e.fields.filter(f => f.enums).length;

  let html = '';

  // Type Legend bar
  html += legendHTML();

  // KPI cards
  html += '<div class="cards">';
  html += '<div class="card overall"><div class="label">Entity</div><div class="value" style="color:'+color+'">'+esc(id)+'</div><div class="sub">'+(e.parent ? 'Child of '+e.parent : 'Root entity')+'</div></div>';
  html += '<div class="card s4"><div class="label">Total Fields</div><div class="value">'+e.fields.length+'</div><div class="sub">Across this entity</div></div>';
  html += '<div class="card s1"><div class="label">Required</div><div class="value">'+reqCount+'</div><div class="sub">Always populated</div></div>';
  html += '<div class="card s2"><div class="label">Enums</div><div class="value">'+enumCount+'</div><div class="sub">Constrained value sets</div></div>';
  html += '<div class="card s5"><div class="label">References</div><div class="value">'+refs.length+'</div><div class="sub">Nested entity types</div></div>';
  if(children.length){
    html += '<div class="card s3"><div class="label">Direct Children</div><div class="value">'+children.length+'</div><div class="sub">Entities under this</div></div>';
  }
  html += '</div>';

  // About this entity
  html += '<div class="grid-section">';
  html += '<h3>About '+esc(id)+'</h3>';
  html += '<div class="desc-block">'+esc(e.desc)+'</div>';
  if(e.note) html += '<div class="desc-block">'+esc(e.note)+'</div>';
  html += '</div>';

  // Fields table
  const q = (searchTerm || '').trim().toLowerCase();
  const visibleFields = e.fields.filter(f => {
    if(!q) return true;
    return f.n.toLowerCase().includes(q) ||
      (f.d && f.d.toLowerCase().includes(q)) ||
      (f.t && f.t.toLowerCase().includes(q)) ||
      (f.subt && f.subt.toLowerCase().includes(q)) ||
      (f.ref && f.ref.toLowerCase().includes(q)) ||
      (f.enums && f.enums.some(en => en.toLowerCase().includes(q)));
  });

  html += '<div class="grid-section">';
  html += '<div class="section-header"><h3>Fields · '+visibleFields.length+(q ? ' of '+e.fields.length+' matching "'+esc(q)+'"' : '')+'</h3></div>';
  if(!visibleFields.length){
    html += '<div class="no-data"><div class="icon-lg">🔍</div><div class="title">No fields match your search</div><div class="sub">Try a different term or clear the filter</div></div>';
  } else {
    html += '<div style="overflow-x:auto"><table class="field-table"><thead><tr>';
    html += '<th>Field</th><th>Type</th><th style="text-align:center">Required</th><th>Description</th>';
    html += '</tr></thead><tbody>';
    visibleFields.forEach(f => {
      const isMatch = q && (f.n.toLowerCase().includes(q) || (f.d && f.d.toLowerCase().includes(q)));
      html += '<tr'+(isMatch ? ' class="match-row"' : '')+'>';
      html += '<td class="field-name">'+esc(f.n)+'</td>';
      html += '<td class="field-type">'+typeBadge(f)+'</td>';
      html += '<td class="field-req">'+(f.req ? '<span class="req-pill req-yes">REQUIRED</span>' : '<span class="req-pill req-no">optional</span>')+'</td>';
      html += '<td class="field-desc">'+esc(f.d || '');
      if(f.enums){
        html += '<div class="enum-pills">';
        f.enums.forEach(en => { html += '<span class="enum-pill">'+esc(en)+'</span>'; });
        html += '</div>';
      }
      html += '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  // Sample shape — illustrative JSON example for this entity
  html += buildSampleJSONSection(id);

  // Direct Children section (if any)
  if(children.length){
    html += '<details class="roster-section" open><summary>Direct Children <span class="roster-count">'+children.length+'</span></summary><div class="roster-buttons">';
    children.forEach(cid => {
      const cc = ENTITY_COLORS[cid];
      html += '<button class="roster-btn" style="--rel-color:'+cc+'" onclick="navigateToEntity(\''+cid+'\')"><span class="rel-dot"></span>'+esc(cid)+'</button>';
    });
    html += '</div></details>';
  }

  // Referenced types section (if any)
  if(refs.length){
    html += '<details class="roster-section" open><summary>Referenced Entity Types <span class="roster-count">'+refs.length+'</span></summary><div class="roster-buttons">';
    refs.forEach(rid => {
      const cc = ENTITY_COLORS[rid] || '#6B7280';
      html += '<button class="roster-btn" style="--rel-color:'+cc+'" onclick="navigateToEntity(\''+rid+'\')"><span class="rel-dot"></span>'+esc(rid)+'</button>';
    });
    html += '</div></details>';
  }

  html += '<div class="footer-note">Sourced from the Genesys Cloud Platform API Conversation Detail data model. Treat the OpenAPI spec at developer.genesys.cloud as authoritative for production work — preview fields and tenant-specific custom attributes are not represented here.</div>';

  container.innerHTML = html;
}

/* ───────────────── OVERVIEW TAB ───────────────── */
function renderOverview(searchTerm, filterMode){
  const container = document.getElementById('overviewContent');
  if(!container) return;
  const q = (searchTerm || '').trim().toLowerCase();
  const filter = filterMode || 'all';

  // Schema-wide stats
  const allEntities = Object.keys(SCHEMA);
  let totalFields = 0, totalRequired = 0, totalRefs = 0, totalEnums = 0;
  allEntities.forEach(eid => {
    const e = SCHEMA[eid];
    totalFields += e.fields.length;
    totalRequired += e.fields.filter(f => f.req).length;
    totalRefs += e.fields.filter(f => f.ref).length;
    totalEnums += e.fields.filter(f => f.enums).length;
  });

  let html = '';
  html += legendHTML();

  // KPI cards — schema-wide
  html += '<div class="cards">';
  html += '<div class="card overall"><div class="label">Total Entities</div><div class="value">'+allEntities.length+'</div><div class="sub">In the conversation model</div></div>';
  html += '<div class="card s4"><div class="label">Total Fields</div><div class="value">'+totalFields+'</div><div class="sub">Across all entities</div></div>';
  html += '<div class="card s1"><div class="label">Required Fields</div><div class="value">'+totalRequired+'</div><div class="sub">Always populated</div></div>';
  html += '<div class="card s2"><div class="label">Enums</div><div class="value">'+totalEnums+'</div><div class="sub">Constrained value sets</div></div>';
  html += '<div class="card s5"><div class="label">Nested References</div><div class="value">'+totalRefs+'</div><div class="sub">Entity relationships</div></div>';
  html += '<div class="card s3"><div class="label">Hierarchy Depth</div><div class="value">4</div><div class="sub">Conversation → Segment</div></div>';
  html += '</div>';

  // If searching, show a flat result table across all entities
  if(q || filter !== 'all'){
    const results = [];
    allEntities.forEach(eid => {
      const e = SCHEMA[eid];
      e.fields.forEach(f => {
        // Apply filter
        if(filter === 'required' && !f.req) return;
        if(filter === 'ref' && !f.ref) return;
        if(filter === 'enum' && !f.enums) return;
        // Apply search
        if(q){
          const matches = f.n.toLowerCase().includes(q) ||
            (f.d && f.d.toLowerCase().includes(q)) ||
            (f.t && f.t.toLowerCase().includes(q)) ||
            (f.subt && f.subt.toLowerCase().includes(q)) ||
            (f.ref && f.ref.toLowerCase().includes(q)) ||
            (f.enums && f.enums.some(en => en.toLowerCase().includes(q))) ||
            eid.toLowerCase().includes(q);
          if(!matches) return;
        }
        results.push({entity: eid, field: f});
      });
    });

    html += '<div class="grid-section">';
    html += '<div class="section-header"><h3>Search Results · '+results.length+' field'+(results.length===1?'':'s')+(q?' matching "'+esc(q)+'"':'')+'</h3></div>';
    if(!results.length){
      html += '<div class="no-data"><div class="icon-lg">🔍</div><div class="title">No matches found</div><div class="sub">Try a different search term or filter</div></div>';
    } else {
      html += '<div style="overflow-x:auto"><table class="field-table"><thead><tr>';
      html += '<th>Entity</th><th>Field</th><th>Type</th><th style="text-align:center">Required</th><th>Description</th>';
      html += '</tr></thead><tbody>';
      results.slice(0, 200).forEach(r => {
        const color = ENTITY_COLORS[r.entity];
        html += '<tr class="match-row">';
        html += '<td style="white-space:nowrap"><span class="csr-link" onclick="navigateToEntity(\''+r.entity+'\')" style="color:'+color+'">'+esc(r.entity)+'</span></td>';
        html += '<td class="field-name">'+esc(r.field.n)+'</td>';
        html += '<td class="field-type">'+typeBadge(r.field)+'</td>';
        html += '<td class="field-req">'+(r.field.req ? '<span class="req-pill req-yes">REQUIRED</span>' : '<span class="req-pill req-no">optional</span>')+'</td>';
        html += '<td class="field-desc">'+esc(r.field.d || '');
        if(r.field.enums){
          html += '<div class="enum-pills">';
          r.field.enums.forEach(en => { html += '<span class="enum-pill">'+esc(en)+'</span>'; });
          html += '</div>';
        }
        html += '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      if(results.length > 200){
        html += '<div style="text-align:center;padding:14px;color:var(--text-muted);font-size:12px;font-style:italic">Showing first 200 of '+results.length+' results — refine your search to narrow.</div>';
      }
    }
    html += '</div>';
  }

  // Hierarchy diagram
  html += '<div class="grid-section">';
  html += '<div class="section-header"><h3>Conversation Hierarchy</h3></div>';
  html += '<p style="font-size:13px;color:var(--text-muted);margin-bottom:8px;line-height:1.6">The Genesys Cloud conversation model is a nested hierarchy. A <strong>Conversation</strong> contains one or more <strong>Participants</strong> (customer, IVR, ACD, agent, external). Each participant has one or more <strong>Sessions</strong> — one per media type they engaged on. Each session is sliced into <strong>Segments</strong> representing state intervals (alert, talk, hold, wrapup, etc.).</p>';
  html += '<div class="hierarchy">';
  html += '<div class="hier-node" style="--rel-color:'+ENTITY_COLORS.Conversation+'" onclick="navigateToEntity(\'Conversation\')"><div class="hier-sub">Root</div><div class="hier-label">Conversation</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px">'+SCHEMA.Conversation.fields.length+' fields</div></div>';
  html += '<div class="hier-conn"></div>';
  html += '<div class="hier-node" style="--rel-color:'+ENTITY_COLORS.Participant+'" onclick="navigateToEntity(\'Participant\')"><div class="hier-sub">Level 1</div><div class="hier-label">Participant</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px">'+SCHEMA.Participant.fields.length+' fields</div></div>';
  html += '<div class="hier-conn"></div>';
  html += '<div class="hier-node" style="--rel-color:'+ENTITY_COLORS.Session+'" onclick="navigateToEntity(\'Session\')"><div class="hier-sub">Level 2</div><div class="hier-label">Session</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px">'+SCHEMA.Session.fields.length+' fields</div></div>';
  html += '<div class="hier-conn"></div>';
  html += '<div class="hier-branch">';
  ['Segment','Flow','MediaEndpointStat'].forEach(id => {
    html += '<div class="hier-node" style="--rel-color:'+ENTITY_COLORS[id]+'" onclick="navigateToEntity(\''+id+'\')"><div class="hier-sub">Level 3</div><div class="hier-label">'+id+'</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px">'+SCHEMA[id].fields.length+' fields</div></div>';
  });
  html += '</div>';
  html += '</div>';
  html += '<p style="font-size:11.5px;color:var(--text-muted);margin-top:14px;font-style:italic;text-align:center"><strong>Survey</strong> and <strong>Evaluation</strong> attach as siblings at the Conversation level. See the Reference tab for full details.</p>';
  html += '</div>';

  // Entity quick-access — roster-style
  html += '<details class="roster-section" open><summary>All Entities <span class="roster-count">'+allEntities.length+'</span></summary><div class="roster-buttons">';
  allEntities.forEach(eid => {
    const cc = ENTITY_COLORS[eid];
    html += '<button class="roster-btn" style="--rel-color:'+cc+'" onclick="navigateToEntity(\''+eid+'\')"><span class="rel-dot"></span>'+esc(eid)+' · '+SCHEMA[eid].fields.length+' fields</button>';
  });
  html += '</div></details>';

  // Where to go next
  html += '<div class="grid-section">';
  html += '<div class="section-header"><h3>Working With This Schema</h3></div>';
  html += '<div class="desc-block"><strong>Reading conversation data:</strong> Use the Conversation Detail Query at <code style="background:var(--bg);padding:2px 6px;border-radius:3px;font-family:monospace;font-size:12px">/api/v2/analytics/conversations/details/query</code> to pull historical conversations with all participants, sessions, and segments inline.</div>';
  html += '<div class="desc-block"><strong>Real-time streams:</strong> The conversations notification topic delivers the same shape as participant/session/segment state changes, ideal for live dashboards.</div>';
  html += '<div class="desc-block"><strong>Authoritative reference:</strong> The OpenAPI spec at <a href="https://developer.genesys.cloud/devapps/api-explorer" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600">developer.genesys.cloud/devapps/api-explorer</a> is the single source of truth — preview fields and tenant-specific custom attributes only appear there.</div>';
  html += '</div>';

  container.innerHTML = html;
}

/* ───────────────── REFERENCE TAB ───────────────── */
function renderReference(searchTerm){
  const container = document.getElementById('referenceContent');
  if(!container) return;
  const refEntities = ['Flow','MediaEndpointStat','Survey','Evaluation','Metrics'];
  const q = (searchTerm || '').trim().toLowerCase();

  let totalRefFields = 0;
  refEntities.forEach(eid => { totalRefFields += SCHEMA[eid].fields.length; });

  let html = '';
  html += legendHTML();

  // KPI cards
  html += '<div class="cards">';
  html += '<div class="card overall"><div class="label">Reference Entities</div><div class="value">'+refEntities.length+'</div><div class="sub">Supporting types</div></div>';
  html += '<div class="card s4"><div class="label">Total Fields</div><div class="value">'+totalRefFields+'</div><div class="sub">Across reference set</div></div>';
  html += '<div class="card s5"><div class="label">Metric Definitions</div><div class="value">'+SCHEMA.Metrics.fields.length+'</div><div class="sub">Count + time metrics</div></div>';
  html += '<div class="card s2"><div class="label">Quality Surfaces</div><div class="value">3</div><div class="sub">MOS · Survey · Eval</div></div>';
  html += '</div>';

  html += '<div class="grid-section"><div class="section-header"><h3>Reference Types</h3></div>';
  html += '<div class="desc-block">These entities support the core hierarchy without being primary nodes in it. <strong>Flow</strong> and <strong>MediaEndpointStat</strong> nest inside Session. <strong>Survey</strong> and <strong>Evaluation</strong> attach at the Conversation level. <strong>Metrics</strong> aren\'t a document of their own — they appear on participants, sessions, and segments — but understanding them is essential for querying.</div></div>';

  // Render each reference entity in its own section-group
  refEntities.forEach(eid => {
    const e = SCHEMA[eid];
    const color = ENTITY_COLORS[eid];
    const reqCount = e.fields.filter(f => f.req).length;

    const visibleFields = e.fields.filter(f => {
      if(!q) return true;
      return f.n.toLowerCase().includes(q) ||
        (f.d && f.d.toLowerCase().includes(q)) ||
        (f.t && f.t.toLowerCase().includes(q)) ||
        (f.subt && f.subt.toLowerCase().includes(q)) ||
        (f.enums && f.enums.some(en => en.toLowerCase().includes(q)));
    });

    if(q && !visibleFields.length) return;

    html += '<details class="section-group" '+(q ? 'open' : (eid==='Flow' ? 'open' : ''))+'>';
    html += '<summary><span style="color:'+color+';font-weight:800">'+esc(eid)+'</span> <span style="color:var(--text-muted);font-weight:600;text-transform:none;letter-spacing:0">· '+visibleFields.length+(q ? ' of '+e.fields.length : '')+' field'+(e.fields.length===1?'':'s')+(e.parent ? ' · child of '+e.parent : '')+'</span></summary>';

    // Description inline
    html += '<div class="grid-section">';
    html += '<div class="desc-block">'+esc(e.desc)+'</div>';
    if(e.note) html += '<div class="desc-block">'+esc(e.note)+'</div>';

    // Field table
    html += '<div style="overflow-x:auto;margin-top:14px"><table class="field-table"><thead><tr>';
    html += '<th>Field</th><th>Type</th><th style="text-align:center">Required</th><th>Description</th>';
    html += '</tr></thead><tbody>';
    visibleFields.forEach(f => {
      const isMatch = q && (f.n.toLowerCase().includes(q) || (f.d && f.d.toLowerCase().includes(q)));
      html += '<tr'+(isMatch ? ' class="match-row"' : '')+'>';
      html += '<td class="field-name">'+esc(f.n)+'</td>';
      html += '<td class="field-type">'+typeBadge(f)+'</td>';
      html += '<td class="field-req">'+(f.req ? '<span class="req-pill req-yes">REQUIRED</span>' : '<span class="req-pill req-no">optional</span>')+'</td>';
      html += '<td class="field-desc">'+esc(f.d || '');
      if(f.enums){
        html += '<div class="enum-pills">';
        f.enums.forEach(en => { html += '<span class="enum-pill">'+esc(en)+'</span>'; });
        html += '</div>';
      }
      html += '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    // Sample shape — inline within the same grid-section so it renders right
    // beneath the field table for that reference entity. Only emitted when a
    // sample exists in SAMPLE_JSON (Flow, MediaEndpointStat, Survey, Evaluation,
    // and Metrics all have one).
    if(SAMPLE_JSON[eid]){
      const encoded = encodeURIComponent(JSON.stringify(SAMPLE_JSON[eid], null, 2));
      html += '<div style="margin-top:18px">';
      html += '<div style="font-family:var(--font-display);font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px">Sample Shape</div>';
      html += '<pre class="json-block"><button class="json-copy-btn" data-json="' + encoded + '" onclick="copyJSON(this)">Copy</button>' + highlightJSON(SAMPLE_JSON[eid]) + '</pre>';
      html += '</div>';
    }
    html += '</div>';
    html += '</details>';
  });

  html += '<div class="footer-note">Sourced from the Genesys Cloud Platform API Conversation Detail data model. Treat the OpenAPI spec at developer.genesys.cloud as authoritative for production work.</div>';

  container.innerHTML = html;
}

/* ───────────────── NAVIGATION ───────────────── */
const ENTITY_TO_TAB = {
  Conversation: 1,
  Participant: 2,
  Session: 3,
  Segment: 4,
  Flow: 5,
  MediaEndpointStat: 5,
  Survey: 5,
  Evaluation: 5,
  Metrics: 5
};

function navigateToEntity(id){
  const tabIdx = ENTITY_TO_TAB[id];
  if(tabIdx == null) return;
  switchTab(tabIdx);
}

function switchTab(n){
  document.querySelectorAll('.tab').forEach((t,i)=>{ t.classList.toggle('active', i===n); });
  for(let i=0; i<=6; i++){
    const el = document.getElementById('tab'+i);
    if(!el) continue;
    el.style.display = i===n ? '' : 'none';
    if(i===n){
      el.classList.remove('tab-fade-in');
      void el.offsetWidth;
      el.classList.add('tab-fade-in');
    }
  }
  // Render the appropriate tab content
  if(n === 0){
    renderOverview(document.getElementById('searchGlobal').value, document.getElementById('filterGlobal').value);
  } else if(n === 1){
    const s = document.querySelector('.entity-search[data-entity="Conversation"]').value;
    renderEntity('Conversation', 'conversationContent', s);
  } else if(n === 2){
    const s = document.querySelector('.entity-search[data-entity="Participant"]').value;
    renderEntity('Participant', 'participantContent', s);
  } else if(n === 3){
    const s = document.querySelector('.entity-search[data-entity="Session"]').value;
    renderEntity('Session', 'sessionContent', s);
  } else if(n === 4){
    const s = document.querySelector('.entity-search[data-entity="Segment"]').value;
    renderEntity('Segment', 'segmentContent', s);
  } else if(n === 5){
    renderReference(document.getElementById('searchReference').value);
  } else if(n === 6){
    renderMap();
  }
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* ───────────────── EVENT BINDINGS ───────────────── */
document.addEventListener('DOMContentLoaded', () => {
  // Overview search
  document.getElementById('searchGlobal').addEventListener('input', e => {
    renderOverview(e.target.value, document.getElementById('filterGlobal').value);
  });
  document.getElementById('filterGlobal').addEventListener('change', e => {
    renderOverview(document.getElementById('searchGlobal').value, e.target.value);
  });

  // Per-entity searches
  document.querySelectorAll('.entity-search').forEach(input => {
    input.addEventListener('input', () => {
      const ent = input.dataset.entity;
      const map = {Conversation:'conversationContent', Participant:'participantContent', Session:'sessionContent', Segment:'segmentContent'};
      renderEntity(ent, map[ent], input.value);
    });
  });

  // Reference search
  document.getElementById('searchReference').addEventListener('input', e => {
    renderReference(e.target.value);
  });

  // Initial render
  renderOverview('', 'all');
  renderEntity('Conversation', 'conversationContent', '');
  renderEntity('Participant', 'participantContent', '');
  renderEntity('Session', 'sessionContent', '');
  renderEntity('Segment', 'segmentContent', '');
  renderReference('');
  renderMap();
});
</script>
