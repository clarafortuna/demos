button{width:100%;margin-top:14px;background:#0F62FE;color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:background .2s}
button:hover{background:#0353E9}

.err{display:none;margin-top:12px;font-size:12.5px;color:#C2410C;background:#FFF7ED;border:1px solid #FED7AA;border-radius:8px;padding:9px 12px}

.foot{margin-top:20px;font-size:11px;color:#9CA3AF;text-align:center}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(){
  const btn = document.getElementById('go'), err = document.getElementById('err');
  const pw = document.getElementById('pw').value;
  if(!pw) return;
  btn.disabled = true; btn.textContent = 'Unlocking\u2026'; err.classList.remove('show');
  try {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt: b64(PAYLOAD.s), iterations: PAYLOAD.it, hash:'SHA-256'},
      keyMaterial, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: b64(PAYLOAD.i)}, key, b64(PAYLOAD.c));
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  } catch(e) {
    btn.disabled = false; btn.textContent = 'View the projection';
    err.classList.add('show');
    document.getElementById('pw').select();
  }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); });
