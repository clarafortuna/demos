const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try{
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64d(BLOB.salt), iterations:BLOB.iter, hash:'SHA-256'},
      baseKey, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(BLOB.iv)}, key, b64d(BLOB.ct));
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  }catch(e){
    err.textContent = 'Incorrect password. Please try again.';
  }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });
