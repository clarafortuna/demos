/* ===========================================================================
   18. VIEW: REPORTING DESK BOARD
   ---------------------------------------------------------------------------
   One board, not three. Grouping is a control rather than a separate mode,
   because three boards means three places a card can be missed.

   The Done column holds forty nine of the seventy eight rows, so it shows the
   most recently completed and keeps the rest behind a control. Otherwise the
   column that matters least takes the most room.

   Cards carry no priority flag: the tracker has no priority column. Age is
   the urgency signal instead, and it is real.
   =========================================================================== */
var DONE_SHOWN = 6;

function bdFiltered(){
  var b = S.bd, q = b.q.toLowerCase().trim();
  return TICKETS.filter(function(t){
    if (b.sys !== 'all' && t.sys !== b.sys) return false;
    if (b.fn !== 'all' && (t.fn || 'none') !== b.fn) return false;
    if (b.assignee !== 'all' && (t.assignee || 'none') !== b.assignee) return false;
    if (b.qf.mine && t.assignee !== ME && t.reporter !== ME) return false;
    if (b.qf.blocked && !t.blocked) return false;
    if (b.qf.aged && !t.aged) return false;
    if (b.qf.unassigned && t.assignee) return false;
    if (b.qf.linked && !t.ini) return false;
    if (q && (t.key + ' ' + t.title + ' ' + t.sys + ' ' + (t.statusText||'') + ' ' +
              (t.statusCode||'') + ' ' + (t.additional||'')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function kcard(t){
  var p = person(t.assignee);
  var ini = t.ini ? initiative(t.ini) : null;
  return '<article class="kcard" draggable="true" data-key="' + t.key + '" data-open-t="' + t.key + '">' +
    '<div class="kt">' + esc(capFirst(t.title)) + '</div>' +
    '<div class="kepics">' + sysChip(t.sys) + fnChip(t.fn) +
      (ini ? '<span class="tag" style="border-color:var(--brand-line);color:var(--brand-ink)" data-tip="' +
        esc(tipRows(ini.c + ' ' + ini.n, [['Value', VALUE[ini.value].label], ['Effort', EFFORT[ini.effort].label],
          ['Status', STATUSES[ini.status].label],
          ['Why linked', 'This request covers the same subject']])) + '">' + ini.c + '</span>' : '') +
    '</div>' +
    (t.blocked ? '<div class="note" style="padding:5px 8px;font-size:11px;border-left-color:var(--watch);background:var(--watch-tint);margin-bottom:7px">' +
      '<b>On hold.</b> ' + esc(t.blocked) + '</div>' : '') +
    (t.contra ? '<div class="note" style="padding:5px 8px;font-size:11px;border-left-color:var(--risk);background:var(--risk-tint);margin-bottom:7px">' +
      '<b>Source conflict.</b> ' + esc(t.contra) + '</div>' : '') +
    (t.dup ? '<div class="note" style="padding:5px 8px;font-size:11px;margin-bottom:7px">' +
      '<b>Duplicate batch.</b> ' + esc(t.dup.label) + '</div>' : '') +
    '<div class="kfoot">' +
      sysGlyph(t.sys) +
      '<span class="kkey' + (t.done ? ' done' : '') + '">' + t.key + '</span>' +
      (t.blocked ? '<span class="kblock" title="On hold" aria-label="On hold" style="color:var(--watch)">' + I.block + '</span>' : '') +
      '<span class="kspacer"></span>' +
      ageChip(t) +
      avatar(p, 'sm') +
    '</div>' +
  '</article>';
}

function viewBoard(){
  var b = S.bd, rows = bdFiltered(), d = deskRollup();
  var analysts = PEOPLE.filter(function(p){ return p.role === 'analyst'; });
  var opt = function(v,l,cur){ return '<option value="' + v + '"' + (cur === v ? ' selected' : '') + '>' + esc(l) + '</option>'; };

  var qfDefs = [
    { k:'mine',       label:'My requests', n:TICKETS.filter(function(t){ return t.assignee === ME || t.reporter === ME; }).length },
    { k:'aged',       label:'Open over ' + AGED_DAYS + ' days', n:TICKETS.filter(function(t){ return t.aged; }).length },
    { k:'blocked',    label:'On hold', n:TICKETS.filter(function(t){ return t.blocked; }).length },
    { k:'unassigned', label:'No analyst', n:TICKETS.filter(function(t){ return !t.assignee && !t.done; }).length },
    { k:'linked',     label:'Linked to an initiative', n:TICKETS.filter(function(t){ return t.ini; }).length }
  ];

  var toolbar =
    '<div class="boardbar">' +
      '<label class="searchwrap">' + I.search + '<input class="field" id="bdq" placeholder="Search requests" value="' + esc(b.q) + '"></label>' +
      '<div class="avstack" style="margin:0 4px">' + analysts.slice(0,7).map(function(p){ return avatar(p, 'sm'); }).join('') +
        (analysts.length > 7 ? '<span class="more">+' + (analysts.length - 7) + '</span>' : '') + '</div>' +
      '<select class="field" id="bdsys" style="width:auto">' + opt('all','System',b.sys) +
        SYS_KEYS.map(function(k){ return opt(k, SYSTEMS[k].label, b.sys); }).join('') + '</select>' +
      '<select class="field" id="bdfn" style="width:auto">' + opt('all','Business area',b.fn) +
        FUNC_KEYS.map(function(k){ return opt(k, FUNCS[k].label, b.fn); }).join('') + opt('none','Not classified',b.fn) + '</select>' +
      '<select class="field" id="bdas" style="width:auto">' + opt('all','Analyst',b.assignee) +
        analysts.map(function(p){ return opt(p.id, p.name, b.assignee); }).join('') + opt('none','Unassigned',b.assignee) + '</select>' +
      qfDefs.map(function(q){
        return '<button class="qf" data-qf="' + q.k + '" aria-pressed="' + b.qf[q.k] + '">' + esc(q.label) + ' <span class="n">' + q.n + '</span></button>';
      }).join('') +
      '<div class="grow"></div>' +
      '<select class="field" id="bdgroup" style="width:auto">' +
        opt('none','No grouping',b.group) + opt('sys','Group by system',b.group) +
        opt('fn','Group by business area',b.group) + opt('assignee','Group by analyst',b.group) + '</select>' +
      '<button class="btn btn-primary btn-sm" data-go="intake">' + I.plus + 'New</button>' +
    '</div>';

  function columnsFor(items, title){
    return (title ? '<div class="row gap-8" style="margin:14px 0 8px"><h3>' + esc(title) + '</h3>' +
      '<span class="tag">' + items.length + '</span></div>' : '') +
      '<div class="boardwrap"><div class="board">' + COLUMNS.map(function(c){
        var all = items.filter(function(t){ return t.col === c.key; });
        var col = all, hidden = 0;
        var overWip = c.wip && all.length > c.wip;
        if (c.done && !S.bd.allDone && all.length > DONE_SHOWN){
          col = all.slice().sort(function(a,b){
            return asDate(b.completedAt || b.created) - asDate(a.completedAt || a.created);
          });
          hidden = col.length - DONE_SHOWN;
          col = col.slice(0, DONE_SHOWN);
        }
        return '<section class="bcol" data-col="' + c.key + '">' +
          '<div class="bcol-hd"><span class="nm">' + esc(c.label) + '</span>' +
            '<span class="ct">' + all.length + '</span>' +
            (overWip ? '<span class="wip" data-tip="' + esc(tipRows('Work in progress limit',
              [['Limit', c.wip], ['Now', all.length]])) + '">Over ' + c.wip + '</span>' : '') +
          '</div>' +
          '<div class="bcol-body">' + (col.length ? col.map(kcard).join('') :
            '<div class="colempty">Nothing here</div>') +
            (hidden ? '<button class="colempty" data-alldone="1" style="cursor:pointer;border-style:solid">' +
              'Show ' + hidden + ' older completed</button>' : '') +
            (c.done && S.bd.allDone && all.length > DONE_SHOWN ?
              '<button class="colempty" data-alldone="0" style="cursor:pointer;border-style:solid">Show recent only</button>' : '') +
          '</div>' +
        '</section>';
      }).join('') + '</div></div>';
  }

  var boards;
  if (b.group === 'none'){
    boards = columnsFor(rows, null);
  } else {
    var keyer = b.group === 'sys' ? function(t){ return t.sys; } :
                b.group === 'fn' ? function(t){ return t.fn || 'none'; } :
                function(t){ return t.assignee || 'none'; };
    var namer = b.group === 'sys' ? function(k){ return SYSTEMS[k] ? SYSTEMS[k].full : k; } :
                b.group === 'fn' ? function(k){ return k === 'none' ? 'Not classified' : FUNCS[k].label; } :
                function(k){ return k === 'none' ? 'No analyst recorded' : person(k).name; };
    var order = b.group === 'sys' ? SYS_KEYS :
                b.group === 'fn' ? FUNC_KEYS.concat(['none']) :
                analysts.map(function(p){ return p.id; }).concat(['none']);
    boards = order.filter(function(k){ return rows.some(function(t){ return keyer(t) === k; }); })
      .map(function(k){ return columnsFor(rows.filter(function(t){ return keyer(t) === k; }), namer(k)); }).join('');
  }

  return '<div class="row between wrap gap-12" style="margin-bottom:14px">' +
      '<div><h1>Reporting desk board</h1>' +
      '<p class="small muted">' + rows.length + ' of ' + TICKETS.length + ' requests from the tracker. ' +
        d.open + ' open, ' + d.aged + ' open longer than ' + AGED_DAYS + ' days, ' + d.unassigned + ' with no analyst recorded. ' +
        'Median time to complete is ' + (d.medianCycle == null ? 'not measurable' : d.medianCycle + ' days') +
        ', across the ' + d.measuredCycle + ' rows that carry both a request and a completion date.</p></div>' +
      '<div class="row gap-8"><button class="btn btn-ghost btn-sm" data-go="queue">' + I.list + 'Open as a list</button></div>' +
    '</div>' + toolbar + boards;
}

/* ===========================================================================
   19. VIEW: QUEUE
   =========================================================================== */
function qvFiltered(){
  var f = S.qv, q = f.q.toLowerCase().trim();
  var out = TICKETS.filter(function(t){
    if (f.col !== 'all' && t.col !== f.col) return false;
    if (f.sys !== 'all' && t.sys !== f.sys) return false;
    if (f.fn !== 'all' && (t.fn || 'none') !== f.fn) return false;
    if (q && (t.key + ' ' + t.title + ' ' + t.sys + ' ' + (t.statusText||'')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  var s = f.sort, dir = f.dir;
  out.sort(function(a,b){
    var va, vb;
    if (s === 'created'){ va = a.created ? asDate(a.created).getTime() : 0; vb = b.created ? asDate(b.created).getTime() : 0; }
    else if (s === 'age'){ va = a.ageDays||0; vb = b.ageDays||0; }
    else if (s === 'cycle'){ va = a.cycleDays == null ? -1 : a.cycleDays; vb = b.cycleDays == null ? -1 : b.cycleDays; }
    else if (s === 'col'){ va = COL[a.col].idx; vb = COL[b.col].idx; }
    else if (s === 'sys'){ va = a.sys; vb = b.sys; }
    else { va = a.n; vb = b.n; }
    return va < vb ? -dir : va > vb ? dir : 0;
  });
  return out;
}

function viewQueue(){
  var f = S.qv, rows = qvFiltered(), d = deskRollup();
  var pages = Math.max(1, Math.ceil(rows.length / PAGE));
  f.page = Math.min(f.page, pages);
  var slice = rows.slice((f.page-1)*PAGE, f.page*PAGE);
  var opt = function(v,l,cur){ return '<option value="' + v + '"' + (cur === v ? ' selected' : '') + '>' + esc(l) + '</option>'; };
  function th(k, label, cls){
    return '<th class="sortable ' + (cls||'') + '" data-sort="' + k + '">' + esc(label) +
      (f.sort === k ? '<span style="font-size:9px;margin-left:3px">' + (f.dir === 1 ? '&#9650;' : '&#9660;') + '</span>' : '') + '</th>';
  }

  return '<div class="row between wrap gap-12" style="margin-bottom:14px">' +
      '<div><h1>Request queue</h1><p class="small muted">Every tracker row as a sortable list. ' +
      d.unassigned + ' open requests have no analyst recorded and ' + d.unclassified +
      ' could not be classified into a business area from their text.</p></div>' +
      '<div class="row gap-8"><button class="btn btn-ghost btn-sm" data-export="tickets">' + I.dl + 'Export</button>' +
      '<button class="btn btn-ghost btn-sm" data-go="board">' + I.board + 'Open as a board</button>' +
      '<button class="btn btn-primary btn-sm" data-go="intake">' + I.plus + 'New</button></div>' +
    '</div>' +
    '<div class="row wrap gap-8" style="margin-bottom:14px">' +
      '<label class="searchwrap" style="width:240px">' + I.search +
        '<input class="field" id="qvq" placeholder="Search requests" value="' + esc(f.q) + '"></label>' +
      '<select class="field" id="qvcol" style="width:auto">' + opt('all','All columns',f.col) +
        COL_KEYS.map(function(k){ return opt(k, COL[k].label, f.col); }).join('') + '</select>' +
      '<select class="field" id="qvsys" style="width:auto">' + opt('all','All systems',f.sys) +
        SYS_KEYS.map(function(k){ return opt(k, SYSTEMS[k].label, f.sys); }).join('') + '</select>' +
      '<select class="field" id="qvfn" style="width:auto">' + opt('all','All business areas',f.fn) +
        FUNC_KEYS.map(function(k){ return opt(k, FUNCS[k].label, f.fn); }).join('') + opt('none','Not classified',f.fn) + '</select>' +
      (f.q || f.col !== 'all' || f.sys !== 'all' || f.fn !== 'all' ?
        '<button class="btn btn-ghost btn-sm" id="qvclear">Clear filters</button>' : '') +
    '</div>' +
    '<section class="panel"><div class="tablewrap"><table><thead><tr>' +
      th('n','Number') + '<th>Request</th>' + th('sys','System') + '<th>Business area</th>' +
      '<th>Analyst</th><th>Requester</th>' + th('col','Column') + th('age','Age','n') +
      th('cycle','Days to complete','n') + th('created','Raised','n') +
    '</tr></thead><tbody>' +
    (slice.length ? slice.map(function(t){
      return '<tr class="clickable" data-open-t="' + t.key + '">' +
        '<td><span class="row gap-6">' + sysGlyph(t.sys) + '<span class="mono tiny' + (t.done ? ' done' : '') + '">' + t.key + '</span></span></td>' +
        '<td style="min-width:250px"><div style="font-weight:500">' + esc(capFirst(t.title)) + '</div>' +
          (t.blocked ? '<div class="tiny" style="color:var(--watch);font-weight:600">On hold</div>' : '') +
          (t.contra ? '<div class="tiny" style="color:var(--risk);font-weight:600">Source conflict</div>' : '') +
          (t.ini ? '<div class="tiny" style="color:var(--brand-ink);font-weight:600">Evidence for ' + t.ini + '</div>' : '') + '</td>' +
        '<td class="tiny">' + esc(SYSTEMS[t.sys] ? SYSTEMS[t.sys].label : t.sys) + '</td>' +
        '<td>' + fnChip(t.fn) + '</td>' +
        '<td>' + personChip(t.assignee) + '</td>' +
        '<td>' + personChip(t.reporter) + '</td>' +
        '<td><span class="tag">' + esc(COL[t.col].label) + '</span>' +
          (t.resolution && t.resolution !== 'Complete' ? '<div class="tiny faint">' + esc(t.resolution) + '</div>' : '') + '</td>' +
        '<td class="n num">' + (t.done ? '<span class="tiny faint">Closed</span>' :
          '<span class="pill ' + t.ageTone + '" style="font-size:11px"><i class="dot"></i>' + t.ageDays + 'd</span>') + '</td>' +
        '<td class="n num">' + (t.cycleDays == null ? '<span class="faint">&#183;</span>' : t.cycleDays) + '</td>' +
        '<td class="n tiny faint nowrap">' + fmtDate(t.created) + '</td>' +
      '</tr>';
    }).join('') : '<tr><td colspan="10" class="empty">No request matches these filters.</td></tr>') +
    '</tbody></table></div>' +
    '<div class="row between pad-sm" style="border-top:1px solid var(--line)">' +
      '<span class="tiny faint num">' + (rows.length ? 'Showing ' + ((f.page-1)*PAGE + 1) + ' to ' +
        Math.min(f.page*PAGE, rows.length) + ' of ' + rows.length : '0') + ' requests. ' +
        d.noCompletionDate + ' completed rows have no completion date, so their time to complete is blank.</span>' +
      '<div class="row gap-4">' + Array.apply(null, { length:pages }).map(function(_, i){
        return '<button class="btn ' + (i+1 === f.page ? 'btn-primary' : 'btn-ghost') + ' btn-sm" data-page="' + (i+1) + '" style="min-width:29px">' + (i+1) + '</button>';
      }).join('') + '</div>' +
    '</div></section>';
}

/* ===========================================================================
   20. REQUEST DETAIL
   ---------------------------------------------------------------------------
   Laid out the way the team already reads a request: breadcrumb, title, the
   status note, the source row, activity on the left; the field panel on the
   right.

   Every section either shows what the tracker holds or says plainly that the
   tracker holds nothing. Priority, estimates, subtasks and linked work items
   are all in that second group. A section invented to look complete is worse
   than an honest gap, and an executive who spots one invented field stops
   trusting the rest of the screen.
   =========================================================================== */
var EV_META = {
  created:   ['var(--navy-deep)', I.plus,  function(e){ return 'Request raised'; }],
  code:      ['var(--s7)',        I.pencil, function(e){ return 'Status code recorded as ' + e.to; }],
  completed: ['var(--ok)',        I.check, function(e){ return e.to ? 'Closed, recorded as ' + e.to.toLowerCase() : 'Marked complete'; }]
};

function ticketDrawer(key){
  var t = TBY[key]; if (!t) return '';
  var ini = t.ini ? initiative(t.ini) : null;
  var all = activityFor(t);
  var feed = S.act === 'comments' ? all.filter(function(f){ return f.kind === 'comment' || f.kind === 'note'; }) :
             S.act === 'history'  ? all.filter(function(f){ return f.kind === 'event'; }) :
             S.act === 'worklog'  ? [] : all;

  function feedItem(f){
    if (f.kind === 'comment' || f.kind === 'note'){
      var p = person(f.who);
      return '<div class="fitem">' + avatar(p, 'sm') + '<div class="fc">' +
        '<div class="fmeta"><span class="fname">' + esc(p ? p.name : 'Not recorded') + '</span>' +
        '<span class="ftime">' + (f.at ? relTime(f.at) : 'No date') + '</span>' +
        (f.kind === 'note' ? '<span class="tag">Status note from the tracker</span>' : '') +
        (f.unsaved ? '<span class="pill watch" style="font-size:10.5px"><i class="dot"></i>Not saved</span>' : '') +
        '</div><div class="ftext">' + esc(f.body) + '</div></div></div>';
    }
    var m = EV_META[f.ev] || EV_META.created, pe = person(f.who);
    return '<div class="fitem ev"><span class="evdot" style="background:' + m[0] + '">' + m[1] + '</span><div class="fc">' +
      '<div class="fmeta"><span class="fname">' + esc(pe ? pe.name : 'Not recorded') + '</span>' +
      '<span class="ftime">' + (f.at ? fmtDate(f.at) : 'No date') + '</span></div>' +
      '<div class="ftext">' + esc(m[2](f)) + '</div></div></div>';
  }

  var statusOptions = COLUMNS.map(function(c){
    return '<option value="' + c.key + '"' + (t.col === c.key ? ' selected' : '') + '>' + esc(c.label) + '</option>';
  }).join('');

  return '<div class="drawer-in">' +
    '<div class="drawer-hd">' +
      '<div class="crumb">' + sysChip(t.sys) + '<span class="sep">/</span>' +
        sysGlyph(t.sys) + '<span class="mono" style="font-weight:600">' + t.key + '</span>' +
        '<span class="tiny faint">Row ' + t.n + ' of the tracker</span>' +
      '</div>' +
      '<div class="grow"></div>' +
      (t.blocked ? '<span class="pill watch"><i class="dot"></i>On hold</span>' : '') +
      (t.aged ? '<span class="pill risk"><i class="dot"></i>Open ' + t.ageDays + ' days</span>' : '') +
      '<button class="btn btn-quiet" data-close aria-label="Close">' + I.x + '</button>' +
    '</div>' +

    '<div class="drawer-body">' +
      '<div class="drawer-main">' +
        '<h1 style="font-size:20px;max-width:62ch;margin-bottom:14px">' + esc(capFirst(t.title)) + '</h1>' +

        '<div class="row gap-8 wrap" style="margin-bottom:20px">' +
          (ini ? '<button class="btn btn-ghost btn-sm" data-open="' + ini.c + '">' + I.spark + 'Open ' + ini.c + '</button>' : '') +
          '<button class="btn btn-ghost btn-sm" data-export="one:' + t.key + '">' + I.dl + 'Export row</button>' +
        '</div>' +

        (t.contra ? '<div class="note" style="border-left-color:var(--risk);background:var(--risk-tint);margin-bottom:16px">' +
          '<b>The source row contradicts itself.</b> ' + esc(t.contra) +
          ' The portal follows the Complete column, which is why this sits in ' + esc(COL[t.col].label.toLowerCase()) + '.</div>' : '') +

        (t.dup ? '<div class="note" style="margin-bottom:16px"><b>' + esc(t.dup.label) + '.</b> ' + esc(t.dup.note) +
          ' Rows in the batch: ' + t.dup.keys.map(function(k){
            return '<button class="fadd" data-open-t="' + k + '" style="background:none;border:0;padding:0">' + k + '</button>';
          }).join(', ') + '.</div>' : '') +

        '<div class="dsec"><h3>Status note from the tracker</h3>' +
          '<div class="dbody"><ul>' + t.desc.map(function(b){ return '<li>' + esc(capFirst(b)) + '</li>'; }).join('') + '</ul></div>' +
          (t.blocked ? '<div class="note" style="margin-top:11px;border-left-color:var(--watch);background:var(--watch-tint)">' +
            '<b>On hold.</b> ' + esc(t.blocked) + '</div>' : '') +
        '</div>' +

        (ini ? '<div class="dsec"><h3>Why this is linked to ' + ini.c + '</h3>' +
          '<div class="linked" data-open="' + ini.c + '" style="cursor:pointer">' +
            '<span class="lrel">Evidence for</span><span class="mono tiny">' + ini.c + '</span>' +
            '<span class="st trunc">' + esc(ini.n) + '</span>' + valueTag(ini.value) + statusPill(ini.status) + '</div>' +
          '<p class="tiny faint" style="margin-top:7px;line-height:1.55">The match is a judgement recorded against the initiative, not an automatic link. ' +
          'Rows with no match are demand that no initiative is pointed at, which the demand signals view reports rather than hides.</p>' +
        '</div>' : '') +

        '<div class="dsec"><h3>Subtasks and linked work</h3>' +
          '<p class="small muted" style="line-height:1.6">The tracker has no subtask or issue link column, so nothing is shown here. ' +
          'The one relationship it does record is the duplicate batch above.</p></div>' +

        '<div class="dsec"><h3>Activity</h3>' +
          '<div class="actbar" role="tablist">' +
            [['all','All'],['comments','Notes'],['history','History'],['worklog','Work log']].map(function(a){
              return '<button role="tab" data-act="' + a[0] + '" aria-selected="' + (S.act === a[0]) + '">' + a[1] + '</button>';
            }).join('') + '</div>' +

          (S.act === 'comments' || S.act === 'all' ?
          '<div class="composer">' + avatar(person(ME), 'sm') +
            '<div class="cin"><textarea id="cbody" placeholder="Add a note"></textarea>' +
            '<div class="quickchips">' +
              ['Chasing requirements','Waiting on the requester','Ready to promote','Needs a decision'].map(function(q){
                return '<button data-quick="' + esc(q) + '">' + esc(q) + '</button>';
              }).join('') +
              '<button class="btn btn-primary btn-sm" data-comment="' + t.key + '" style="margin-left:auto">Add note</button>' +
            '</div>' +
            '<p class="tiny faint" style="margin-top:7px">Notes added here stay in this browser session. Nothing is written back to the tracker.</p>' +
            '</div></div>' : '') +

          (S.act === 'worklog' ?
            '<div class="empty" style="padding:26px">The tracker records no time against a request, so there is no work log.</div>' :
            '<div class="feed">' + (feed.length ? feed.map(feedItem).join('') :
              '<div class="empty" style="padding:26px">Nothing recorded here.</div>') + '</div>') +
        '</div>' +
      '</div>' +

      '<div class="drawer-side">' +
        '<div class="row gap-8" style="margin-bottom:16px">' +
          '<select class="field" id="tstatus" style="width:auto;font-weight:600">' + statusOptions + '</select>' +
          (t.done ? '<span class="pill ok"><i class="dot"></i>' + esc(t.resolution || 'Complete') + '</span>' :
            '<span class="pill ' + t.ageTone + '"><i class="dot"></i>' + t.ageDays + ' days open</span>') +
        '</div>' +

        '<details class="detbox" open><summary><span class="caret">' + I.caret + '</span>From the tracker</summary>' +
          '<div class="dcontent">' +
            '<div class="frow"><span class="fk">Analyst</span><span class="fv">' + personChip(t.assignee) + '</span></div>' +
            '<div class="frow"><span class="fk">Requester</span><span class="fv">' + personChip(t.reporter) + '</span></div>' +
            '<div class="frow"><span class="fk">Also involved</span><span class="fv">' +
              (t.additional ? esc(t.additional) : '<span class="faint">Nobody recorded</span>') + '</span></div>' +
            '<div class="frow"><span class="fk">System</span><span class="fv">' + esc(t.sysDef.full) + '</span></div>' +
            '<div class="frow"><span class="fk">Raised</span><span class="fv">' + fmtDate(t.created) + '</span></div>' +
            '<div class="frow"><span class="fk">Completed</span><span class="fv">' +
              (t.completedAt ? fmtDate(t.completedAt) : '<span class="faint">No completion date recorded</span>') + '</span></div>' +
            '<div class="frow"><span class="fk">Status code</span><span class="fv">' +
              (t.statusCode ? '<span class="pill ' + codeTone(t.statusCode) + '"><i class="dot"></i>' + esc(capFirst(t.statusCode)) + '</span>'
                            : '<span class="faint">Blank in the tracker</span>') + '</span></div>' +
          '</div></details>' +

        '<details class="detbox" open><summary><span class="caret">' + I.caret + '</span>Derived by this portal' +
          '<span class="sum">3 fields</span></summary>' +
          '<div class="dcontent">' +
            '<div class="frow"><span class="fk">Column</span><span class="fv"><span class="tag">' + esc(COL[t.col].label) + '</span></span></div>' +
            '<div class="frow"><span class="fk">Business area</span><span class="fv">' + fnChip(t.fn) + '</span></div>' +
            '<div class="frow"><span class="fk">Initiative</span><span class="fv">' +
              (ini ? '<span class="tag" data-open="' + ini.c + '" style="cursor:pointer;border-color:var(--brand-line);color:var(--brand-ink)">' + ini.c + '</span>'
                   : '<span class="faint">Not linked</span>') + '</span></div>' +
            '<p class="tiny faint" style="margin-top:9px;line-height:1.55">The column comes from Complete, then the status code, then the status text. ' +
            'The business area comes from a keyword match on the request text. Both are this portal reading the tracker, not fields the tracker holds.</p>' +
          '</div></details>' +

        '<details class="detbox"><summary><span class="caret">' + I.caret + '</span>Timing' +
          '<span class="sum">' + (t.done ? (t.cycleDays == null ? 'No dates' : t.cycleDays + ' days') : t.ageDays + ' days open') + '</span></summary>' +
          '<div class="dcontent">' +
            '<div class="frow"><span class="fk">Age</span><span class="fv num">' + (t.ageDays == null ? 'No request date' : t.ageDays + ' days since raised') + '</span></div>' +
            '<div class="frow"><span class="fk">Time to complete</span><span class="fv num">' +
              (t.cycleDays == null ? '<span class="faint">Not measurable</span>' : t.cycleDays + ' days') + '</span></div>' +
            '<div class="frow"><span class="fk">Aged past</span><span class="fv num">' + AGED_DAYS + ' days</span></div>' +
            '<p class="tiny faint" style="margin-top:9px;line-height:1.55">The ' + AGED_DAYS + ' day threshold is a convention of this portal. ' +
            'The tracker sets no target, so nothing here is measured against a commitment anyone made.</p>' +
          '</div></details>' +

        '<details class="detbox"><summary><span class="caret">' + I.caret + '</span>Not captured in the tracker' +
          '<span class="sum">4 fields</span></summary>' +
          '<div class="dcontent">' +
            '<div class="frow"><span class="fk">Priority</span><span class="fv faint">No priority column</span></div>' +
            '<div class="frow"><span class="fk">Estimate</span><span class="fv faint">No estimate column</span></div>' +
            '<div class="frow"><span class="fk">Service level</span><span class="fv faint">No target is set</span></div>' +
            '<div class="frow"><span class="fk">Last updated</span><span class="fv faint">No update timestamp</span></div>' +
            '<p class="tiny faint" style="margin-top:9px;line-height:1.55">These are listed rather than defaulted. A priority of medium on every row would read as though somebody had set it.</p>' +
          '</div></details>' +

        '<div class="tiny faint" style="margin-top:14px;line-height:1.7">' +
          'Raised ' + fmtDate(t.created) + '<br>' +
          (t.completedAt ? 'Completed ' + fmtDate(t.completedAt) : 'Not yet completed') +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

/* ===========================================================================
   21. INITIATIVE DETAIL
   ---------------------------------------------------------------------------
   Short, because the record is short. What the list says, the notes verbatim,
   the tracker requests that evidence it, and an explicit statement of what the
   list does not carry.
   =========================================================================== */
function initiativeDrawer(code){
  var x = initiative(code); if (!x) return '';
  var deps = DEPS_BY[x.c] || [];
  var open = x.tickets.filter(function(t){ return !t.done; });
  var saysNoDemand = x.notes.some(function(n){ return /no direct requests|content with current state/i.test(n); });

  return '<div class="drawer-in">' +
    '<div class="drawer-hd">' +
      '<div class="crumb"><span class="tag">' + esc(FUNCS[x.f].label) + '</span><span class="sep">/</span>' +
        '<span class="mono" style="font-weight:600">' + x.c + '</span></div>' +
      '<div class="grow"></div>' + statusPill(x.status) + valueTag(x.value) + effortTag(x.effort) +
      '<button class="btn btn-quiet" data-close aria-label="Close">' + I.x + '</button>' +
    '</div>' +
    '<div class="drawer-body">' +
      '<div class="drawer-main">' +
        '<h1 style="font-size:21px;max-width:60ch;margin-bottom:16px">' + esc(x.n) + '</h1>' +

        '<div class="grid g3" style="margin-bottom:20px">' +
          '<div class="tile"><div class="k">Value</div><div class="v" style="font-size:20px">' + esc(VALUE[x.value].label) + '</div>' +
            '<div class="sub">As recorded</div></div>' +
          '<div class="tile"><div class="k">Effort</div><div class="v" style="font-size:20px">' + esc(EFFORT[x.effort].label) + '</div>' +
            '<div class="sub">As recorded</div></div>' +
          '<div class="tile"><div class="k">Impacted users</div><div class="v" style="font-size:20px">' + nfmt(x.users) + '</div>' +
            '<div class="sub">Approximate in the source</div></div>' +
        '</div>' +

        '<div class="dsec"><h3>What the record says</h3>' +
          '<div class="dbody"><ul>' + x.notes.map(function(b){ return '<li>' + esc(b) + '</li>'; }).join('') + '</ul></div>' +
        '</div>' +

        (deps.length ? '<div class="dsec"><h3>Stated dependency</h3>' +
          deps.map(function(dd){
            return '<div class="note" style="border-left-color:var(' + (dd.open ? '--watch' : '--ok') + ');background:var(' +
              (dd.open ? '--watch-tint' : '--ok-tint') + ');margin-bottom:9px">' +
              '<b>' + esc(dd.label) + '.</b> ' + esc(dd.note) + '</div>' +
            dd.rows.map(function(t){
              return '<div class="linked" data-open-t="' + t.key + '" style="cursor:pointer">' +
                '<span class="lrel">' + (t.done ? 'Complete' : 'Open') + '</span>' +
                sysGlyph(t.sys) + '<span class="mono tiny">' + t.key + '</span>' +
                '<span class="st trunc">' + esc(capFirst(t.title)) + '</span>' +
                '<span class="tag">' + esc(COL[t.col].label) + '</span>' + avatar(person(t.assignee), 'xs') + '</div>';
            }).join('');
          }).join('') + '</div>' : '') +

        '<div class="dsec"><h3>Requests that evidence this</h3>' +
          (x.tickets.length ?
            '<div class="tiny faint" style="margin-bottom:8px">' + x.tickets.length + ' of the ' + TICKETS.length +
              ' tracker rows cover this subject, ' + open.length + ' still open. ' +
              'The match is a judgement recorded against this initiative, not an automatic link.</div>' +
            (saysNoDemand ? '<div class="note" style="border-left-color:var(--risk);background:var(--risk-tint);margin-bottom:10px">' +
              '<b>This contradicts the note.</b> The record says no direct requests have been heard, but the tracker holds ' +
              x.tickets.length + ' requests on the same ground. Worth resolving before the value rating is trusted.</div>' : '') +
            '<div class="scrolly">' + x.tickets.slice().sort(function(a,b){ return COL[a.col].idx - COL[b.col].idx; }).map(function(t){
              return '<div class="linked" data-open-t="' + t.key + '" style="cursor:pointer">' +
                sysGlyph(t.sys) + '<span class="mono tiny">' + t.key + '</span>' +
                '<span class="st trunc">' + esc(capFirst(t.title)) + '</span>' +
                '<span class="tag">' + esc(COL[t.col].label) + '</span>' + avatar(person(t.assignee), 'xs') + '</div>';
            }).join('') + '</div>'
            : '<p class="small muted" style="line-height:1.6">No request in the tracker names this subject. ' +
              'That is not proof there is no demand, but it does mean nothing in the reporting record can be pointed at as the case for it.</p>') +
        '</div>' +
      '</div>' +

      '<div class="drawer-side">' +
        '<details class="detbox" open><summary><span class="caret">' + I.caret + '</span>From the record</summary>' +
          '<div class="dcontent">' +
            '<div class="frow"><span class="fk">Value</span><span class="fv">' + esc(VALUE[x.value].label) + '</span></div>' +
            '<div class="frow"><span class="fk">Effort</span><span class="fv">' + esc(EFFORT[x.effort].label) + '</span></div>' +
            '<div class="frow"><span class="fk">Impacted users</span><span class="fv num">' + nfmt(x.users) + ', approximately</span></div>' +
            '<div class="frow"><span class="fk">Status</span><span class="fv">' + esc(STATUSES[x.status].label) + '</span></div>' +
          '</div></details>' +

        '<details class="detbox" open><summary><span class="caret">' + I.caret + '</span>Derived by this portal' +
          '<span class="sum">2 fields</span></summary>' +
          '<div class="dcontent">' +
            '<div class="frow"><span class="fk">Business area</span><span class="fv">' + esc(FUNCS[x.f].label) + '</span></div>' +
            '<div class="frow"><span class="fk">Capability</span><span class="fv">' +
              (x.cap ? esc(CAPS[x.cap].label) : '<span class="faint">Left blank, the notes do not say</span>') + '</span></div>' +
            '<div class="frow"><span class="fk">Evidence rows</span><span class="fv num">' + x.tickets.length + '</span></div>' +
            '<p class="tiny faint" style="margin-top:9px;line-height:1.55">The business area lets this initiative be compared with counted request volume. ' +
            'The capability is left blank rather than guessed where the notes are too terse to place it.</p>' +
          '</div></details>' +

        '<details class="detbox"><summary><span class="caret">' + I.caret + '</span>Not recorded' +
          '<span class="sum">' + NOT_CAPTURED.length + ' fields</span></summary>' +
          '<div class="dcontent">' +
            NOT_CAPTURED.map(function(nc){
              return '<div class="frow"><span class="fk">' + esc(nc[0]) + '</span><span class="fv faint tiny">Not recorded</span></div>';
            }).join('') +
            '<p class="tiny faint" style="margin-top:9px;line-height:1.55">Listed rather than defaulted. A cost of zero or a stage of "idea" on every row would read as though somebody had set it.</p>' +
          '</div></details>' +

        '<div class="tiny faint" style="margin-top:14px;line-height:1.7">' +
          (x.moving ? 'Recorded as in progress.' : 'No status recorded against this initiative.') + '<br>' +
          (x.tickets.length ? x.tickets.length + ' tracker request' + (x.tickets.length === 1 ? '' : 's') + ' as evidence, ' + open.length + ' open.'
                            : 'No tracker request names this subject.') +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

/* ===========================================================================
   22. VIEW: DEMAND SIGNALS
   ---------------------------------------------------------------------------
   The one screen where the two halves argue with each other. The reporting
   desk says where the business keeps asking for data; the portfolio says
   where the AI money went. Where those disagree is either a funding gap or an
   over investment, and both are decisions rather than status.

   The demand side of every figure here is a count of real tracker rows, which
   is the reason this comparison is worth an executive's time. The investment
   side is the portfolio, which is illustrative until the initiative tables
   are provisioned. That asymmetry is stated on the page.
   =========================================================================== */
function viewDemand(){
  var sig = demandSignals(), d = deskRollup();
  var totalDemand = sum(sig, function(s){ return s.demand; }) || 1;
  var totalInis = INITIATIVES.length || 1;

  /* Capability coverage. A pale cell with heavy request volume on its row is
     an uncovered capability, which is the honest version of a gap analysis. */
  var heat = heatmap(
    FUNC_KEYS.map(function(k){ return { key:k, label:FUNCS[k].label }; }),
    CAP_KEYS.map(function(k){ return { key:k, label:CAPS[k].label }; }),
    function(r, c){ return INITIATIVES.filter(function(x){ return x.f === r.key && x.cap === c.key; }).length; }
  );

  var unmet = sig.filter(function(s){ return s.demand > 0 && s.initiatives === 0; });
  var thin  = sig.filter(function(s){ return s.initiatives > 0 && s.demand / s.initiatives > 12; });

  var ideaRows = INITIATIVES.filter(function(x){ return !x.moving; })
    .sort(function(a,b){ return b.leverage - a.leverage || b.users - a.users; }).map(function(x){
    var inArea = TICKETS.filter(function(t){ return t.fn === x.f; }).length;
    return '<tr class="clickable" data-open="' + x.c + '">' +
      '<td><span class="mono tiny">' + x.c + '</span> <span style="font-weight:500">' + esc(x.n) + '</span>' +
        '<div class="tiny faint trunc" style="max-width:420px">' + esc(x.notes[0]) + '</div></td>' +
      '<td class="tiny">' + esc(FUNCS[x.f].label) + '</td>' +
      '<td>' + valueTag(x.value) + '</td>' +
      '<td>' + effortTag(x.effort) + '</td>' +
      '<td class="n num">' + inArea + '</td>' +
      '<td class="n num">' + (x.tickets.length ? '<b style="color:var(--brand-ink)">' + x.tickets.length + '</b>' : '<span class="faint">0</span>') + '</td>' +
      '<td>' + statusPill(x.status) + '</td>' +
    '</tr>';
  }).join('');

  var sysRows = SYS_KEYS.map(function(k){
    return { k:SYSTEMS[k].label, v:d.bySys[k] || 0, color:SYSTEMS[k].color };
  }).filter(function(r){ return r.v > 0; }).sort(desc('v'));
  var reqRows = Object.keys(d.byRequester).map(function(id){
    return { k:person(id) ? person(id).name : id, v:d.byRequester[id], color:'var(--s1)' };
  }).sort(desc('v')).slice(0, 10);

  var months = [], now = new Date(NOW);
  for (var m = 12; m >= 0; m--){
    var dt = new Date(now.getFullYear(), now.getMonth() - m, 1);
    months.push(dt.toLocaleDateString('en-US', { month:'short' }));
  }
  var topFns = sig.slice(0, 3);
  var series = topFns.map(function(s, i){
    return { k:FUNCS[s.fn].label, color:'var(--s' + (i+1) + ')', v:demandSeries(s.fn) };
  });

  return '<div style="margin-bottom:16px"><h1>Demand signals</h1>' +
    '<p class="small muted">Where the business keeps asking for data, and whether AI money is pointed at the same place. ' +
    'The demand side is ' + TICKETS.length + ' counted rows from the reporting requests tracker, not a survey and not an estimate.</p></div>' +

    '<div class="note brand sec">Only <b>' + d.linked + ' of ' + TICKETS.length + '</b> requests name work an initiative also names. ' +
      'The other ' + (TICKETS.length - d.linked) + ' are real demand with no initiative pointed at them. That gap is the finding on this page, not a defect in it. ' +
      'Coverage here is counted in initiatives, never in money: the initiative records carry none.</div>' +

    '<div class="sec"><div class="sec-hd"><h2>Demand against investment</h2>' +
      '<span class="hint">Share of tracker requests compared with share of the initiatives, by business area</span></div>' +
      '<section class="panel"><div class="tablewrap"><table><thead><tr>' +
        '<th>Business area</th><th class="n">Requests raised</th><th class="n">Share of demand</th><th class="n">Still open</th>' +
        '<th class="n">Initiatives</th><th class="n">Share of initiatives</th><th>Read</th></tr></thead><tbody>' +
        sig.map(function(s){
          var fp = s.demand/totalDemand*100, ip = s.initiatives/totalInis*100, gap = fp - ip;
          return '<tr class="clickable" data-fn="' + s.fn + '">' +
            '<td style="font-weight:500">' + esc(s.label) + '</td>' +
            '<td class="n num">' + s.demand + '</td>' +
            '<td class="n num">' + Math.round(fp) + '%</td>' +
            '<td class="n num">' + s.open + (s.aged ? ' <span class="tiny" style="color:var(--risk)">(' + s.aged + ' aged)</span>' : '') + '</td>' +
            '<td class="n num">' + s.initiatives + (s.moving ? ', ' + s.moving + ' moving' : '') + '</td>' +
            '<td class="n num">' + Math.round(ip) + '%</td>' +
            '<td>' + (gap > 15 ? '<span class="pill watch"><i class="dot"></i>Under covered</span>' :
                      gap < -15 ? '<span class="pill info"><i class="dot"></i>Over weighted</span>' :
                      '<span class="pill mute"><i class="dot"></i>In balance</span>') + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="pad-sm tiny faint" style="border-top:1px solid var(--line)">' +
          d.unclassified + ' of ' + TICKETS.length + ' requests could not be classified into a business area from their text and are excluded from the shares above.' +
        '</div></section></div>' +

    (unmet.length || thin.length ? '<div class="sec"><div class="sec-hd"><h2>Gaps worth a decision</h2></div>' +
      '<div class="grid g2">' +
        (unmet.length ? '<section class="panel pad"><h3 style="margin-bottom:8px">Nothing funded against this demand</h3>' +
          unmet.map(function(s){
            return '<div class="rank"><span class="rn">' + esc(s.label) + '</span>' +
              '<span class="rv">' + s.demand + ' requests</span></div>';
          }).join('') + '<div class="note" style="margin-top:10px">These areas keep raising reporting work with no initiative behind them. ' +
          'That is either a deliberate choice or a blind spot, and the committee should be the one to say which.</div></section>' : '') +
        (thin.length ? '<section class="panel pad"><h3 style="margin-bottom:8px">Thinly covered</h3>' +
          thin.map(function(s){
            var ratio = s.demand / s.initiatives;
            return '<div class="rank"><span class="rn">' + esc(s.label) + '</span>' +
              '<span class="rb"><i style="width:' + clamp(ratio*3, 6, 100) + '%;background:var(--watch)"></i></span>' +
              '<span class="rv">' + Math.round(ratio) + ':1</span></div>';
          }).join('') + '<div class="note" style="margin-top:10px">Tracker requests for every initiative in the area. ' +
          'A crude ratio on purpose: it is a conversation starter for the committee, not an allocation formula.</div></section>' : '') +
      '</div></div>' : '') +

    '<div class="sec"><div class="sec-hd"><h2>Capability coverage</h2>' +
      '<span class="hint">Initiatives by business area and AI capability. A pale row carrying heavy request volume is the gap.</span></div>' +
      '<section class="panel pad">' + heat +
        '<p class="tiny faint" style="margin-top:12px;line-height:1.55">Capability is read off each initiative\u2019s notes and is left blank on ' +
        INITIATIVES.filter(function(x){ return !x.cap; }).length + ' of ' + INITIATIVES.length +
        ' where the notes do not say enough. Those do not appear on this grid.</p>' +
      '</section></div>' +

    '<div class="sec"><div class="grid g2">' +
      '<section class="panel"><div class="panel-head"><h2>Requests raised per month</h2>' +
        '<span class="hint">The three business areas raising the most work</span></div>' +
        '<div class="pad">' + colChart(months, series, { h:200, aria:'Requests raised per month by business area' }) + '</div></section>' +
      '<section class="panel"><div class="panel-head"><h2>Where requests come from</h2></div>' +
        '<div class="pad"><h3 class="tiny faint" style="margin-bottom:7px">By system</h3>' +
          hBars(sysRows, { labelW:34, valueW:14, unit:'Requests', aria:'Requests by system' }) +
          '<h3 class="tiny faint" style="margin:16px 0 7px">By requester, top ten</h3>' +
          hBars(reqRows, { labelW:46, valueW:13, unit:'Requests', color:'var(--s1)', aria:'Requests by requester' }) +
        '</div></section>' +
    '</div></div>' +

    '<div class="sec"><div class="sec-hd"><h2>Initiatives with no status recorded</h2>' +
      '<span class="hint">Evidence is the count of tracker requests in the same area. Named means a request describes this exact work.</span></div>' +
      '<section class="panel"><div class="tablewrap"><table><thead><tr>' +
        '<th>Initiative</th><th>Area</th><th>Value</th><th>Effort</th>' +
        '<th class="n">Requests in the area</th><th class="n">Requests naming it</th><th>Status</th></tr></thead><tbody>' + ideaRows + '</tbody></table></div>' +
        '<div class="pad-sm tiny faint" style="border-top:1px solid var(--line)">' +
          'Value and effort are as recorded. The request counts are counted tracker rows.' +
        '</div></section></div>';
}

/* ===========================================================================
   23. VIEW: RAISE A REQUEST
   ---------------------------------------------------------------------------
   The form asks for exactly the columns the tracker has, plus the one derived
   field the portal needs. Nothing is asked for that the tracker cannot store.
   =========================================================================== */
function viewIntake(){
  return '<div style="margin-bottom:16px"><h1>Raise a request</h1>' +
    '<p class="small muted">The same fields the reporting requests tracker holds. Anything raised here stays in this browser session.</p></div>' +
    '<div class="grid g32">' +
      '<section class="panel pad">' +
        '<div><label class="lbl">What do you need</label>' +
          '<input class="field" id="nkTitle" placeholder="One line, the way you would say it out loud"></div>' +
        '<div class="row gap-12 wrap" style="margin-top:12px">' +
          '<div style="flex:1;min-width:150px"><label class="lbl">System</label>' +
            '<select class="field" id="nkSys">' + SYS_KEYS.map(function(k){
              return '<option value="' + k + '"' + (k === 'CCB' ? ' selected' : '') + '>' + esc(SYSTEMS[k].label) + ', ' + esc(SYSTEMS[k].full.toLowerCase()) + '</option>';
            }).join('') + '</select></div>' +
          '<div style="flex:1;min-width:170px"><label class="lbl">Business area</label>' +
            '<select class="field" id="nkFn">' + FUNC_KEYS.map(function(k){ return '<option value="' + k + '">' + esc(FUNCS[k].label) + '</option>'; }).join('') + '</select></div>' +
        '</div>' +
        '<div style="margin-top:12px"><label class="lbl">Status note</label>' +
          '<textarea class="field" id="nkDesc" placeholder="What is happening now, what you need instead, and who it affects."></textarea></div>' +
        '<div class="row gap-12 wrap" style="margin-top:12px">' +
          '<div style="flex:1;min-width:170px"><label class="lbl">Analyst, if known</label>' +
            '<select class="field" id="nkWho"><option value="">Not assigned yet</option>' +
              PEOPLE.filter(function(p){ return p.role === 'analyst'; })
                .map(function(p){ return '<option value="' + p.id + '">' + esc(p.name) + '</option>'; }).join('') + '</select></div>' +
          '<div style="flex:1;min-width:170px"><label class="lbl">Status code, if any</label>' +
            '<input class="field" id="nkCode" placeholder="Left blank on most rows"></div>' +
        '</div>' +
        '<div class="row gap-8" style="margin-top:18px">' +
          '<button class="btn btn-primary" id="nkSubmit">' + I.plus + 'Raise it</button>' +
          '<button class="btn btn-ghost" data-go="board">Cancel</button>' +
        '</div>' +
        '<p class="tiny faint" style="margin-top:12px;line-height:1.55">There is no priority field, because the tracker has no priority column. ' +
        'If the team wants one, that is a change to the tracker first and to this form second.</p>' +
      '</section>' +
      '<section class="panel pad">' +
        '<h3 style="margin-bottom:9px">What happens next</h3>' +
        '<div class="col gap-12">' +
          [['It lands in intake','No analyst is assigned yet. In the tracker as it stands today, a row usually appears once somebody has picked the work up.'],
           ['Progress is recorded as a note','The tracker keeps one free text status per row rather than a thread, so that note is the history.'],
           ['It is classified','The portal reads a business area off the request text so the demand it represents can be compared with where AI money is going.'],
           ['Some requests become evidence','When several requests describe the same friction, they are the case for funding an initiative rather than seven separate reports.']].map(function(s, i){
            return '<div class="row top gap-10"><span class="av sm" style="background:var(--brand)">' + (i+1) + '</span>' +
              '<div><div style="font-weight:600;font-size:13px">' + esc(s[0]) + '</div>' +
              '<div class="small muted" style="line-height:1.55">' + esc(s[1]) + '</div></div></div>';
          }).join('') +
        '</div>' +
        '<div class="note brand" style="margin-top:16px">A request is called aged once it has been open longer than ' + AGED_DAYS + ' days. ' +
          'That is a convention of this portal, not a commitment to anybody: the tracker sets no target and none is invented here.</div>' +
      '</section>' +
    '</div>';
}

/* ===========================================================================
   24. VIEW: HOW THESE NUMBERS ARE BUILT
   =========================================================================== */
function viewAdmin(){
  var r = rollup(), d = deskRollup();
  var defs = [
    ['Initiative value and effort','High, Medium or Low, exactly as recorded. There is no numeric score and no cost behind either.'],
    ['Value over effort','Value rank divided by effort rank, used only to order the "worth doing first" list. Both inputs are printed beside it so the ordering can be checked by eye.'],
    ['Impacted users','The approximate figure as recorded. Populations overlap between initiatives, so the total is reach, not headcount.'],
    ['In progress','One initiative is recorded as in progress. The other five record nothing, which is shown as "Not stated" rather than turned into a pipeline stage.'],
    ['Requests as evidence','Tracker rows whose request text covers the same subject as an initiative. A judgement recorded per initiative, listed on each record, not an automatic match.'],
    ['Stated dependency','The one dependency written in the notes: Root Cause is waiting on the Customer Record enhancements. Those are live rows on the desk, so the portal can say whether they are done.'],
    ['Request age','Days from the request date to today, for open rows. Straight off the tracker.'],
    ['Days to complete','The request date to the completion date. Only ' + d.measuredCycle + ' of the ' + d.done + ' closed rows carry both dates, so the median is quoted with that denominator.'],
    ['Aged','Open longer than ' + AGED_DAYS + ' days. A convention of this portal. The tracker sets no service level, so no breach is reported anywhere.'],
    ['Business area','A keyword match on the request text, and a reading of the notes for each initiative. The only field derived on both sides, and what the demand comparison rests on.'],
    ['Board column','Read from Complete Y/N first, then the Status Code, then the free text Status. Where those disagree the Complete column wins and the conflict is shown on the row.']
  ];
  return '<div style="margin-bottom:16px"><h1>How these numbers are built</h1>' +
    '<p class="small muted">Every definition behind the screens, in one place. If a figure cannot be traced to a line here, treat it as wrong.</p></div>' +

    '<div class="note brand sec"><b>Two real sources, two different shapes.</b> The reporting desk is ' + TICKETS.length +
      ' rows from the requests tracker. The AI initiative portal holds the ' + INITIATIVES.length +
      ' initiatives supplied by the team, with value, effort, impacted users and notes. Neither is invented. ' +
      'But the initiative records carry no cost, stage, owner, risk or date, so this portal shows no spend, no return, no funnel and no roadmap.</div>' +

    '<div class="sec"><section class="panel"><div class="tablewrap"><table>' +
      '<thead><tr><th style="width:180px">Figure</th><th>Definition</th></tr></thead><tbody>' +
      defs.map(function(x){
        return '<tr><td style="font-weight:600;vertical-align:top">' + esc(x[0]) + '</td>' +
          '<td style="line-height:1.6;color:var(--ink-2)">' + esc(x[1]) + '</td></tr>';
      }).join('') + '</tbody></table></div></section></div>' +

    '<div class="sec"><div class="sec-hd"><h2>What the tracker does not contain</h2>' +
      '<span class="hint">Listed rather than defaulted, so nothing on screen looks set when it is not</span></div>' +
      '<section class="panel pad"><div class="grid g2">' +
        [['Priority','No priority column on the tracker. Nothing in the portal shows one, and age carries urgency instead.'],
         ['Service level','No target. No breach is reported. "Aged" is this portal’s own ' + AGED_DAYS + ' day threshold.'],
         ['Estimates','No effort or points column, so no capacity or staffing figure is derived anywhere.'],
         ['Update timestamp','No last-updated column. The most recent real date on a row is its completion date, or its request date.'],
         ['Subtasks and links','No columns for either. The one relationship the tracker records is a duplicate batch.'],
         ['Requester job titles','Names only. Titles are left blank rather than guessed.']].map(function(x){
          return '<div><div style="font-weight:600;font-size:13px">' + esc(x[0]) + '</div>' +
            '<div class="small muted" style="line-height:1.55">' + esc(x[1]) + '</div></div>';
        }).join('') +
      '</div></section></div>' +

    '<div class="sec"><div class="sec-hd"><h2>What the initiative records do not carry</h2>' +
      '<span class="hint">And what each one would unlock</span></div>' +
      '<section class="panel"><div class="tablewrap"><table>' +
        '<thead><tr><th style="width:170px">Missing field</th><th>Consequence in this portal</th></tr></thead><tbody>' +
        NOT_CAPTURED.map(function(x){
          return '<tr><td style="font-weight:600;vertical-align:top">' + esc(x[0]) + '</td>' +
            '<td style="line-height:1.6;color:var(--ink-2)">' + esc(x[1]) + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="pad-sm tiny faint" style="border-top:1px solid var(--line)">' +
          'Capture cost and effort as numbers, a stage, and an accountable owner per initiative, and the spend against benefit view, the stage funnel and the roadmap all become possible.' +
        '</div></section></div>' +

    '<div class="sec"><div class="sec-hd"><h2>What was changed reading the source</h2>' +
      '<span class="hint">Every normalisation applied, so it can be argued with</span></div>' +
      '<div class="grid g2">' +
        '<section class="panel"><div class="panel-head"><h2>Identity variants merged</h2>' +
          '<span class="hint">' + IDENTITY_MERGES.length + ' applied</span></div>' +
          '<div class="tablewrap"><table><thead><tr><th>In the tracker</th><th>Treated as</th><th>Role</th></tr></thead><tbody>' +
          IDENTITY_MERGES.map(function(m){
            return '<tr><td class="mono tiny">' + esc(m.from) + '</td><td style="font-weight:600">' + esc(m.to) + '</td>' +
              '<td class="tiny faint">' + esc(cap(m.kind)) + '</td></tr>';
          }).join('') + '</tbody></table></div>' +
          '<div class="pad-sm tiny faint" style="border-top:1px solid var(--line)">Chris and Chris F were treated as one person on the strength of one row against three. If that is wrong it is worth saying so. ' +
            'One request title carried an en dash, which was replaced with a comma so the portal holds to its own typography rule. ' +
            'Eleven titles are typed in lower case in the tracker and are shown with a leading capital, for display only: the stored text is untouched and search still matches the original. No other request text was altered.</div>' +
        '</section>' +
        '<section class="panel"><div class="panel-head"><h2>Data quality found</h2>' +
          '<span class="hint">Surfaced, not smoothed over</span></div>' +
          '<div class="pad"><div class="kv">' +
            '<span class="k">Rows where Complete conflicts with the status note</span><span class="v">' + d.contradictions.length + '</span>' +
            '<span class="k">Closed rows with no completion date</span><span class="v">' + d.noCompletionDate + '</span>' +
            '<span class="k">Open rows with no analyst recorded</span><span class="v">' + d.unassigned + '</span>' +
            '<span class="k">Rows no keyword could classify</span><span class="v">' + d.unclassified + '</span>' +
            '<span class="k">Rows recorded as cancelled</span><span class="v">' + d.cancelled + '</span>' +
            '<span class="k">Duplicate intake batch</span><span class="v">' + DUPLICATE_CLUSTERS[0].keys.length + '</span>' +
          '</div>' +
          '<div class="note" style="margin-top:12px">' + esc(DUPLICATE_CLUSTERS[0].note) + ' A tracker that lets the same request be logged seven times is telling you something about intake.</div>' +
          '</div></section>' +
      '</div></div>' +

    '<div class="sec"><div class="grid g2">' +
      '<section class="panel pad"><h3 style="margin-bottom:8px">Where the data comes from</h3>' +
        '<div class="kv">' +
          '<span class="k">Tracker rows</span><span class="v">' + TICKETS.length + '</span>' +
          '<span class="k">Date range</span><span class="v">' + fmtDate(TICKETS.reduce(function(a,t){ return (!a || (t.created && t.created < a)) ? t.created : a; }, null)) +
            ' to ' + fmtDate(TICKETS.reduce(function(a,t){ return (!a || (t.created && t.created > a)) ? t.created : a; }, null)) + '</span>' +
          '<span class="k">Analysts</span><span class="v">' + PEOPLE.filter(function(p){ return p.role === 'analyst'; }).length + '</span>' +
          '<span class="k">Requesters</span><span class="v">' + PEOPLE.filter(function(p){ return p.role === 'requester'; }).length + '</span>' +
          '<span class="k">Initiatives</span><span class="v">' + INITIATIVES.length + '</span>' +
          '<span class="k">Recorded as in progress</span><span class="v">' + INITIATIVES.filter(function(x){ return x.moving; }).length + '</span>' +
          '<span class="k">Systems</span><span class="v">' + SYS_KEYS.filter(function(k){ return d.bySys[k]; }).length + '</span>' +
          '<span class="k">Requests naming an initiative</span><span class="v">' + d.linked + '</span>' +
        '</div>' +
        '<div class="note" style="margin-top:14px">' + (HOSTED ?
          'Running inside the model-driven app. The Dataverse tables for this module are not provisioned yet, so both sources are held in the page.' :
          'Running outside the model-driven app, so there is no Dataverse context. Both sources are held in the page.') + '</div>' +
      '</section>' +
      '<section class="panel pad"><h3 style="margin-bottom:8px">Known limits</h3>' +
        '<ul class="small muted" style="line-height:1.7;padding-left:18px;margin:0">' +
          '<li>Time to complete rests on ' + d.measuredCycle + ' rows. Any median by system below about five rows should be read as an anecdote.</li>' +
          '<li>The business area is a keyword match. It will misfile a request whose text does not say what it is really about.</li>' +
          '<li>The board column is read from prose. Where a row says one thing in Complete and another in its note, the portal follows Complete and flags the row.</li>' +
          '<li>The initiative records carry no cost or benefit, so nothing on any screen is expressed in money. Coverage is counted in initiatives.</li>' +
          '<li>Capability is left blank on two initiatives whose notes do not say enough to place them.</li>' +
          '<li>Notes added in the portal are not written back to the tracker.</li>' +
        '</ul>' +
      '</section>' +
    '</div></div>';
}

  queue:['Request queue','The board as a list'],
  intake:['Raise a request','Where everything starts'],
  demand:['Demand signals','Counted demand against AI spend'],
  admin:['How these numbers are built','Definitions and known limits']
};

function allowed(k){
  var item = NAV.filter(function(n){ return n.k === k; })[0];
  return !item || item.roles.indexOf(S.as) >= 0;
}

function renderRail(){
  document.getElementById('rail').innerHTML =
    '<div class="brand"><span class="brand-mark">' + I.mark + '</span>' +
      '<div><div class="brand-name">Orange &amp; Rockland</div><div class="brand-sub">AI and intake portal</div></div></div>' +
    NAV.map(function(n){
      if (n.group) return '<div class="rail-group">' + esc(n.group) + '</div>';
      if (n.roles.indexOf(S.as) < 0) return '';
      return '<button class="navbtn" data-go="' + n.k + '"' + (S.view === n.k ? ' aria-current="page"' : '') +
        ' title="' + esc(n.label) + '">' +
        I[n.icon] + '<span class="nlabel">' + esc(n.label) + '</span>' +
        (n.count ? '<span class="ct">' + n.count() + '</span>' : '') + '</button>';
    }).join('') +
    '<div class="rail-foot">' +
      '<div class="row gap-10 whoami" style="padding:6px 8px">' + avatar(person(ME), 'lg') +
        '<div class="nlabel" style="min-width:0"><div class="trunc" style="font-size:12.5px;font-weight:600">' + esc(person(ME).name) + '</div>' +
        '<div class="trunc tiny faint">' + esc(person(ME).title) + '</div></div></div>' +
    '</div>';
}

function renderTopbar(){
  var t = TITLES[S.view] || ['',''];
  document.getElementById('topbar').innerHTML =
    '<div><div style="font-size:15px;font-weight:600">' + esc(t[0]) + '</div>' +
      '<div class="tiny faint">' + esc(t[1]) + '</div></div>' +
    '<div class="grow"></div>' +
    '<label class="searchwrap" style="width:236px">' + I.search +
      '<input class="field" id="gq" placeholder="Search initiatives and requests"></label>' +
    '<div class="row gap-6"><span class="tiny faint">Viewing as</span>' +
      '<select class="field" id="viewas" style="width:auto">' +
        VIEWS_AS.map(function(v){ return '<option value="' + v.key + '"' + (S.as === v.key ? ' selected' : '') + '>' + esc(v.label) + '</option>'; }).join('') +
      '</select></div>' +
    '<button class="btn btn-quiet" id="theme" aria-label="Switch theme">' +
      (document.documentElement.getAttribute('data-theme') === 'dark' ? I.sun : I.moon) + '</button>';
}

var VIEWS = { exec:viewExec, portfolio:viewPortfolio, board:viewBoard,
              queue:viewQueue, intake:viewIntake, demand:viewDemand, admin:viewAdmin };

function render(){
  if (!allowed(S.view)) S.view = S.as === 'member' ? 'board' : 'exec';
  renderRail(); renderTopbar();
  var main = document.getElementById('main');
  main.innerHTML = '<div class="view on">' + (VIEWS[S.view] || viewExec)() + '</div>';
  main.scrollTop = 0; window.scrollTo(0, 0);
  renderDrawer();
}

function renderDrawer(){
  var dr = document.getElementById('drawer'), sc = document.getElementById('scrim');
  if (!S.open){ dr.classList.remove('on'); sc.classList.remove('on'); dr.innerHTML = ''; return; }
  dr.innerHTML = S.openKind === 't' ? ticketDrawer(S.open) : initiativeDrawer(S.open);
  dr.classList.add('on'); sc.classList.add('on');
}
function openIni(code){ S.open = code; S.openKind = 'i'; renderDrawer(); }
function openTicket(key){ S.open = key; S.openKind = 't'; S.act = 'comments'; renderDrawer(); }
function closeDrawer(){ S.open = null; S.openKind = null; renderDrawer(); }

/* ===========================================================================
   26. EVENTS
   ---------------------------------------------------------------------------
   Three delegated listeners on the document plus one keydown, the same shape
   the existing portals use. Nothing binds handlers per element, so a re-render
   never has to rewire anything.
   =========================================================================== */
document.addEventListener('click', function(e){
  var el;
  if ((el = e.target.closest('[data-close]')) || e.target.id === 'scrim'){ closeDrawer(); return; }
  if ((el = e.target.closest('[data-go]'))){
    var go = el.getAttribute('data-go'), hash = null;
    if (go.indexOf('#') > 0){ hash = go.split('#')[1]; go = go.split('#')[0]; }
    S.view = go; closeDrawer(); render();
    if (hash){ var target = document.getElementById(hash); if (target) target.scrollIntoView({ behavior:'smooth', block:'start' }); }
    return;
  }
  if ((el = e.target.closest('[data-open-t]'))){ openTicket(el.getAttribute('data-open-t')); return; }
  if ((el = e.target.closest('[data-open]'))){ openIni(el.getAttribute('data-open')); return; }
  if ((el = e.target.closest('[data-fn]'))){
    S.view = 'portfolio'; S.pf.fn = el.getAttribute('data-fn'); S.pf.mode = 'cards'; closeDrawer(); render(); return;
  }
  if ((el = e.target.closest('[data-mode]'))){ S.pf.mode = el.getAttribute('data-mode'); render(); return; }
  if ((el = e.target.closest('[data-qf]'))){ var q = el.getAttribute('data-qf'); S.bd.qf[q] = !S.bd.qf[q]; render(); return; }
  if ((el = e.target.closest('[data-act]'))){ S.act = el.getAttribute('data-act'); renderDrawer(); return; }
  if ((el = e.target.closest('[data-page]'))){ S.qv.page = +el.getAttribute('data-page'); render(); return; }
  if ((el = e.target.closest('[data-sort]'))){
    var k = el.getAttribute('data-sort');
    if (S.qv.sort === k) S.qv.dir = -S.qv.dir; else { S.qv.sort = k; S.qv.dir = -1; }
    render(); return;
  }
  if ((el = e.target.closest('[data-quick]'))){
    var ta = document.getElementById('cbody');
    if (ta){ ta.value = (ta.value ? ta.value + ' ' : '') + el.getAttribute('data-quick') + '. '; ta.focus(); }
    return;
  }
  if ((el = e.target.closest('[data-comment]'))){
    var box = document.getElementById('cbody'), key = el.getAttribute('data-comment');
    if (box && box.value.trim()){
      COMMENTS.push([key, ME, box.value.trim(), new Date().toISOString()]);
      renderDrawer(); toast('Note added to ' + key + ', in this session only');
    }
    return;
  }
  if ((el = e.target.closest('[data-alldone]'))){ S.bd.allDone = el.getAttribute('data-alldone') === '1'; render(); return; }
  if ((el = e.target.closest('[data-export]'))){ exportCsv(el.getAttribute('data-export')); return; }
  if (e.target.closest('#qvclear')){ S.qv.q = ''; S.qv.col = 'all'; S.qv.sys = 'all'; S.qv.fn = 'all'; render(); return; }
  if (e.target.closest('#theme')){
    var root = document.documentElement;
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('orai.theme', next); } catch(err){}
    renderTopbar(); return;
  }
  if (e.target.closest('#nkSubmit')){ submitIntake(); return; }
});

document.addEventListener('input', function(e){
  var id = e.target.id, v = e.target.value;
  if (id === 'pfq'){ S.pf.q = v; softRender('pfq'); }
  else if (id === 'bdq'){ S.bd.q = v; softRender('bdq'); }
  else if (id === 'qvq'){ S.qv.q = v; S.qv.page = 1; softRender('qvq'); }
  else if (id === 'gq'){ globalSearch(v); }
});

document.addEventListener('change', function(e){
  var id = e.target.id, v = e.target.value, el;
  if (id === 'pffn'){ S.pf.fn = v; render(); }
  else if (id === 'pfvalue'){ S.pf.value = v; render(); }
  else if (id === 'pfeffort'){ S.pf.effort = v; render(); }
  else if (id === 'pfstatus'){ S.pf.status = v; render(); }
  else if (id === 'pfsort'){ S.pf.sort = v; render(); }
  else if (id === 'bdsys'){ S.bd.sys = v; render(); }
  else if (id === 'bdfn'){ S.bd.fn = v; render(); }
  else if (id === 'bdas'){ S.bd.assignee = v; render(); }
  else if (id === 'bdgroup'){ S.bd.group = v; render(); }
  else if (id === 'qvcol'){ S.qv.col = v; S.qv.page = 1; render(); }
  else if (id === 'qvsys'){ S.qv.sys = v; S.qv.page = 1; render(); }
  else if (id === 'qvfn'){ S.qv.fn = v; S.qv.page = 1; render(); }
  else if (id === 'viewas'){ S.as = v; closeDrawer(); render(); toast('Viewing as ' + VIEWS_AS.filter(function(x){ return x.key === v; })[0].label); }
  else if (id === 'tstatus' && S.open && S.openKind === 't'){ moveTicket(S.open, v, true); }

});

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && S.open) closeDrawer();
});

/* Keeping focus and caret position through a filter keystroke. Re-rendering
   the whole view on every character would steal the cursor, so the input is
   restored rather than the render being debounced away. */
function softRender(focusId){
  var el = document.getElementById(focusId);
  var pos = el ? el.selectionStart : null;
  render();
  var back = document.getElementById(focusId);
  if (back){ back.focus(); if (pos != null) try { back.setSelectionRange(pos, pos); } catch(err){} }
}

function globalSearch(v){
  var q = (v||'').trim();
  if (q.length < 2) return;
  var t = TICKETS.filter(function(x){ return (x.key + ' ' + x.title).toLowerCase().indexOf(q.toLowerCase()) >= 0; })[0];
  var i = INITIATIVES.filter(function(x){ return (x.c + ' ' + x.n).toLowerCase().indexOf(q.toLowerCase()) >= 0; })[0];
  if (/^REQ-/i.test(q) && t) openTicket(t.key);
  else if (/^AI-/i.test(q) && i) openIni(i.c);
}

/* ---- drag and drop between columns -------------------------------------- */
var dragKey = null;
document.addEventListener('dragstart', function(e){
  var c = e.target.closest('.kcard'); if (!c) return;
  dragKey = c.getAttribute('data-key'); c.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragKey); } catch(err){}
});
document.addEventListener('dragend', function(e){
  var c = e.target.closest('.kcard'); if (c) c.classList.remove('dragging');
  $$('.bcol.over').forEach(function(x){ x.classList.remove('over'); });
  dragKey = null;
});
document.addEventListener('dragover', function(e){
  var col = e.target.closest('.bcol'); if (!col || !dragKey) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  if (!col.classList.contains('over')){
    $$('.bcol.over').forEach(function(x){ x.classList.remove('over'); });
    col.classList.add('over');
  }
});
document.addEventListener('drop', function(e){
  var col = e.target.closest('.bcol'); if (!col || !dragKey) return;
  e.preventDefault();
  moveTicket(dragKey, col.getAttribute('data-col'), false);
});

/* Moving a card changes the derived column only. The tracker has no column
   field to write back to, so the move is a view state change and the toast
   says as much rather than implying a save. */
function moveTicket(key, to, fromDrawer){
  var t = TBY[key]; if (!t || t.col === to) return;
  t.col = to;
  if (COL[to].done && !t.completedAt){ t.completedAt = new Date().toISOString().slice(0,10); t.resolution = 'Complete'; }
  if (!COL[to].done && t.resolution === 'Complete'){ t.completedAt = null; t.resolution = null; }
  hydrate(); indexAll();
  render();
  if (fromDrawer) renderDrawer();
  toast(key + ' moved to ' + COL[to].label + ', in this session only');
}

/* ---- intake -------------------------------------------------------------- */
/* New rows continue the tracker's own numbering. */
var nextNum = TICKETS.reduce(function(a,t){ return Math.max(a, t.n); }, 0) + 1;
function submitIntake(){
  var title = (document.getElementById('nkTitle')||{}).value || '';
  if (!title.trim()){ toast('A one line summary is needed before this can be raised'); return; }
  var who = document.getElementById('nkWho').value || null;
  var t = R(nextNum++, title.trim(),
    document.getElementById('nkSys').value,
    who ? 'dev' : 'intake',
    who, ME,
    new Date().toISOString().slice(0,10), null,
    (document.getElementById('nkDesc')||{}).value.trim(),
    (document.getElementById('nkCode')||{}).value.trim(),
    '', document.getElementById('nkFn').value, null, null, null, null);
  TICKETS.unshift(t); TBY[t.key] = t;
  hydrate(); indexAll();
  S.view = 'board'; render(); openTicket(t.key);
  toast(t.key + ' raised, in this session only');
}

/* ---- export -------------------------------------------------------------- */
function exportCsv(kind){
  var rows, name;
  if (kind === 'initiatives'){
    name = 'or-ai-initiatives.csv';
    rows = [['Code','Name','Value','Effort','Impacted users','Status','Business area',
             'Capability','Requests as evidence','Open requests','Notes']]
      .concat(pfFiltered().map(function(x){
        return [x.c, x.n, VALUE[x.value].label, EFFORT[x.effort].label, x.users,
                STATUSES[x.status].label, FUNCS[x.f].label, x.cap ? CAPS[x.cap].label : '',
                x.tickets.length, x.openTickets, x.notes.join(' | ')];
      }));
  } else {
    var only = /^one:/.test(kind) ? kind.slice(4) : null;
    name = only ? ('or-request-' + only + '.csv') : 'or-reporting-requests.csv';
    rows = [['Number','Key','Request','System','Business area','Column','Analyst','Requester',
             'Also involved','Status note','Status code','Raised','Completed','Age days',
             'Days to complete','Outcome','Initiative']]
      .concat((only ? [TBY[only]] : qvFiltered()).filter(Boolean).map(function(t){
        return [t.n, t.key, t.title, t.sys, t.fn ? FUNCS[t.fn].label : '', COL[t.col].label,
                t.assignee && person(t.assignee) ? person(t.assignee).name : '',
                t.reporter && person(t.reporter) ? person(t.reporter).name : '',
                t.additional || '', t.statusText || '', t.statusCode || '',
                t.created || '', t.completedAt || '', t.ageDays == null ? '' : t.ageDays,
                t.cycleDays == null ? '' : t.cycleDays, t.resolution || '', t.ini || ''];
      }));
  }
  var csv = rows.map(function(r){
    return r.map(function(c){
      var s = String(c == null ? '' : c);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(',');
  }).join('\n');
  var blob = new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  toast('Exported ' + (rows.length - 1) + ' rows');
}

/* ===========================================================================
   27. BOOT
   ---------------------------------------------------------------------------
   When the Dataverse tables for this module exist, loadFromDataverse() fills
   INITIATIVES and TICKETS from them and everything above works unchanged. The
   shape is the contract; the source is not. Until then it returns false and
   the seeded set is used, which is stated on screen rather than implied.
   =========================================================================== */
function loadFromDataverse(){
  if (!HOSTED) return false;
  /* Intentionally not implemented. cf_aiinitiative and cf_reportingrequest are
     not provisioned. Wiring it is a retrieveMultipleRecords per table plus a
     mapping into the same field names R() builds, nothing more: every view
     reads the shape, never the source. */
  return false;
}

(function boot(){
  try {
    var saved = localStorage.getItem('orai.theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch(err){}

  loadFromDataverse();
  hydrate(); indexAll();

  if (HOSTED){
    try {
      var gc = XRM.Utility.getGlobalContext();
      var name = gc.userSettings.userName;
      /* Match the signed in user to a person record by name. If there is no
         match the demo identity stands, which is what happens in the sandbox
         where logins do not correspond to any O&R roster entry. */
      var hit = PEOPLE.filter(function(p){ return p.name.toLowerCase() === String(name||'').toLowerCase(); })[0];
      if (hit) ME = hit.id;
    } catch(err){}
  }
  render();
})();

})();
</script>
