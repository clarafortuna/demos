var TBY = {}; TICKETS.forEach(function(t){ TBY[t.key] = t; });
/* ===========================================================================
   7. ACTIVITY
   ---------------------------------------------------------------------------
   The tracker keeps progress as one free text Status note per row, not as a
   thread. So the activity feed is built from what actually exists:

     - the Status note, shown as the standing note from the analyst working it
     - the request date, as a created event
     - the completion date, as a completed event
     - the Status Code, where one is set

   There is no comment history, no work log and no subtask list in the source.
   Those sections stay in the detail view with empty states that say so,
   because a section invented to look complete is worse than an honest gap.

   Notes added in this session are held here so the demo can be driven, and
   they are marked as unsaved.
   =========================================================================== */
var COMMENTS = [];       /* filled at runtime only; the tracker has none */

/* Requests that describe the same work. The tracker has one explicit case
   ("dupl-done with Summary rpt") and one batch of seven rows raised on the
   same day with identical text, which is the duplicate intake the demand view
   reports. Grouped here so the board can show them as one cluster. */
var DUPLICATE_CLUSTERS = [
  { label:'Q1 2026 Request Batch, Jonathan Miklos',
    note:'Seven rows raised on 19 and 20 March with the same text and no requirements. Six were cancelled.',
    keys:['REQ-040','REQ-041','REQ-042','REQ-043','REQ-045','REQ-046','REQ-048'] }
];
var DUP_OF = {};
DUPLICATE_CLUSTERS.forEach(function(c){ c.keys.forEach(function(k){ DUP_OF[k] = c; }); });

/* ===========================================================================
   8. DERIVED SHAPES
   =========================================================================== */
function hydrate(){
  INITIATIVES.forEach(function(x){
    x.valueDef  = VALUE[x.value];
    x.effortDef = EFFORT[x.effort];
    x.statusDef = STATUSES[x.status];
    /* Value rank over effort rank. Not a score and not presented as one: it
       exists only to order the "worth doing first" list, and both inputs are
       shown beside it so the ordering can be checked by eye. */
    x.leverage  = x.valueDef.rank / x.effortDef.rank;
    x.moving    = x.status === 'inprogress';
  });

  TICKETS.forEach(function(t){
    t.sysDef = SYSTEMS[t.sys] || SYSTEMS['Ad hoc'];
    t.done = !!COL[t.col].done;
    t.dup = DUP_OF[t.key] || null;

    var cr = t.created ? asDate(t.created).getTime() : null;
    var cp = t.completedAt ? asDate(t.completedAt).getTime() : null;

    /* Age is time since the request was raised for open work, and time to
       completion for finished work. Two different questions, so they are two
       different fields rather than one number that changes meaning. */
    t.ageDays   = cr == null ? null : Math.max(0, Math.floor((NOW - cr) / DAY));
    t.cycleDays = (cr != null && cp != null) ? Math.max(0, Math.round((cp - cr) / DAY)) : null;

    /* The tracker has no "last updated" column. The most recent real date on
       the row is the completion date if there is one, otherwise the request
       date, and the portal says that rather than implying live updates. */
    t.updated = t.completedAt || t.created;
    t.idleDays = t.updated ? Math.floor((NOW - asDate(t.updated).getTime()) / DAY) : null;

    /* Aged means open longer than AGED_DAYS. A portal convention, labelled as
       one everywhere it appears, because the tracker sets no target. */
    t.aged = !t.done && t.ageDays != null && t.ageDays > AGED_DAYS;
    t.ageTone = t.done ? 'ok' : (t.aged ? 'risk' : (t.ageDays > AGED_DAYS * 0.66 ? 'watch' : 'ok'));

    t.desc = [];
    if (t.statusText) t.desc.push(t.statusText);
    if (t.additional) t.desc.push('Additional team member recorded: ' + t.additional);
    if (t.resolution) t.desc.push('Recorded outcome: ' + t.resolution);
    if (!t.desc.length) t.desc.push('The tracker row carries no status note.');

    t.labels = [];
    if (t.statusCode) t.labels.push(t.statusCode);
    if (/^CHG/.test(t.statusCode || '')) t.labels.push('Change ticket');
  });
}

var INI_BY = {};
function indexAll(){
  INI_BY = {}; INITIATIVES.forEach(function(x){ INI_BY[x.c] = x; });

  /* The evidence join runs one way only: each initiative names the tracker
     rows whose request text covers the same subject, and the ticket side is
     stamped from that. One list to maintain, so the two halves cannot drift
     apart, and the judgement stays visible on the initiative record. */
  TICKETS.forEach(function(t){ t.ini = null; });
  INITIATIVES.forEach(function(x){
    x.tickets = [];
    x.evidence.forEach(function(n){
      var t = TICKETS.filter(function(z){ return z.n === n; })[0];
      if (t){ t.ini = x.c; x.tickets.push(t); }
    });
    x.openTickets = x.tickets.filter(function(t){ return !t.done; }).length;
    x.agedTickets = x.tickets.filter(function(t){ return t.aged; }).length;
  });

  /* Stated dependencies resolved to real rows, so the portal can say whether
     the thing an initiative is waiting on is actually finished. */
  DEPS = STATED_DEPENDENCIES.map(function(d){
    var rows = d.keys.map(function(k){ return TBY[k]; }).filter(Boolean);
    return {
      from:d.from, label:d.label, note:d.note, rows:rows,
      open: rows.filter(function(t){ return !t.done; }).length,
      cleared: rows.length ? rows.every(function(t){ return t.done; }) : false
    };
  });
  DEPS_BY = {}; DEPS.forEach(function(d){ (DEPS_BY[d.from] = DEPS_BY[d.from] || []).push(d); });
}
var DEPS = [], DEPS_BY = {};
function initiative(code){ return INI_BY[code] || null; }

/* The activity feed for one request, built from the real fields. */
function activityFor(t){
  var out = [];
  if (t.created) out.push({ kind:'event', ev:'created', who:t.reporter, at:t.created });
  if (t.statusCode) out.push({ kind:'event', ev:'code', who:t.assignee, at:t.updated, to:t.statusCode });
  if (t.completedAt) out.push({ kind:'event', ev:'completed', who:t.assignee, at:t.completedAt, to:t.resolution });
  if (t.statusText) out.push({ kind:'note', who:t.assignee, body:t.statusText, at:t.updated });
  COMMENTS.filter(function(c){ return c[0] === t.key; }).forEach(function(c){
    out.push({ kind:'comment', who:c[1], body:c[2], at:c[3], unsaved:true });
  });
  return out.sort(function(a,b){ return asDate(b.at) - asDate(a.at); });
}

/* ===========================================================================
   9. SMALL HELPERS
   =========================================================================== */
function esc(s){
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function sum(a, f){ return a.reduce(function(s,x){ return s + (f ? (f(x)||0) : (x||0)); }, 0); }
function by(k){ return function(a,b){ return a[k] < b[k] ? -1 : a[k] > b[k] ? 1 : 0; }; }
function desc(k){ return function(a,b){ return (b[k]||0) - (a[k]||0); }; }
function uniq(a){ return a.filter(function(v,i){ return a.indexOf(v) === i; }); }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function groupCount(arr, f){
  var o = {}; arr.forEach(function(x){ var k = f(x); o[k] = (o[k]||0) + 1; }); return o;
}

/* Money is held in thousands everywhere. These are the only two places that
   know that, so changing the unit later is a two line change. */
function money(k){
  if (k == null) return 'Not set';
  if (Math.abs(k) >= 1000) return '$' + (k/1000).toFixed(k >= 10000 ? 0 : 1) + 'M';
  return '$' + Math.round(k) + 'k';
}
function moneyFull(k){ return '$' + Number(Math.round(k)*1000).toLocaleString() ; }
function pct(v){ return (v == null ? 'Not set' : Math.round(v) + '%'); }
function nfmt(v){ return Number(v||0).toLocaleString(); }
/* Capitalise the first letter for display only. Label and tag values are
   stored lowercase and hyphenated the way the team types them, but nothing in
   this portal renders in lower case, so the capital is applied at the render
   site rather than baked into the data. */
function cap(s){
  s = String(s == null ? '' : s).replace(/-/g, ' ');
  return s.charAt(0).toUpperCase() + s.slice(1);
}
/* Title Case for display, the portal's rule for anything that names a thing:
   articles, coordinating conjunctions and prepositions of three letters or
   fewer stay lower case unless first or last, and a word that already carries
   an internal capital (CIMS, SQL, CCB-CIC) is left exactly as written. */
var TC_MINOR = { a:1, an:1, the:1, and:1, but:1, or:1, nor:1, 'for':1, so:1, yet:1,
  as:1, at:1, by:1, 'in':1, of:1, on:1, to:1, up:1, per:1, via:1, vs:1 };
function titleCase(s){
  var w = String(s == null ? '' : s).trim().split(/\s+/);
  return w.map(function(x, i){
    if (/[A-Z]/.test(x.slice(1)) || /^[0-9]/.test(x)) return x;
    if (i > 0 && i < w.length - 1 && TC_MINOR[x.toLowerCase()]) return x.toLowerCase();
    return x.charAt(0).toUpperCase() + x.slice(1);
  }).join(' ');
}
/* A capital on the first letter of text that came from the source, for
   display only. Eleven of the seventy eight request titles are typed in lower
   case ("adding 6 SQL for Low Income Report"), and nothing in this portal
   renders in lower case. The stored value is untouched, search still matches
   on the original, and the substitution is listed on the provenance page. */
function capFirst(s){
  s = String(s == null ? '' : s);
  return s.charAt(0).toUpperCase() + s.slice(1);
}
/* Customer counts are held in thousands, the same way money is held in
   thousands. Past a million the "k" suffix stops reading as a number and
   starts reading as a typo, so it rolls over. */
function people(k){
  if (k == null) return 'Not set';
  if (k >= 1000) return (k/1000).toFixed(k >= 10000 ? 0 : 1) + 'M';
  return nfmt(k) + 'k';
}

function relTime(iso){
  var d = (NOW - asDate(iso).getTime()) / DAY;
  if (d < 0.0417) return 'Just now';
  if (d < 1) { var h = Math.round(d*24); return h + (h === 1 ? ' hour ago' : ' hours ago'); }
  if (d < 30) { var n = Math.round(d); return n + (n === 1 ? ' day ago' : ' days ago'); }
  if (d < 365) { var m = Math.round(d/30); return m + (m === 1 ? ' month ago' : ' months ago'); }
  var y = (d/365).toFixed(1); return y + ' years ago';
}
/* The tracker stores date-only values. new Date('2026-06-02') is parsed as
   UTC midnight, which then renders as 1 June anywhere west of Greenwich, so
   every date in the source would display a day early. Date-only strings are
   therefore split and built as a local date. Day differences are unaffected
   either way, so only display needed the fix. */
function asDate(iso){
  if (!iso) return null;
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(iso);
}
function fmtDate(iso){
  var d = asDate(iso);
  if (!d) return 'None';
  return d.toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric' });
}

/* Quarter index 0 is Q1 2026. The roadmap and the milestone lists both speak
   this, so the label lives in one place. */
var Q_BASE_YEAR = 2026;
function qLabel(i){ return 'Q' + ((i % 4) + 1) + ' ' + (Q_BASE_YEAR + Math.floor(i/4)); }
function currentQ(){
  var n = new Date(NOW);
  return (n.getFullYear() - Q_BASE_YEAR) * 4 + Math.floor(n.getMonth()/3);
}
var QNOW = currentQ();

function avatar(p, size){
  if (!p) return '<span class="av ' + (size||'sm') + '" style="background:var(--line-2);color:var(--ink-3)" title="Unassigned">?</span>';
  return '<span class="av ' + (size||'sm') + '" style="background:' + p.color + '" title="' +
         esc(p.name + ', ' + p.title) + '">' + esc(p.initials) + '</span>';
}
function personChip(id){
  var p = person(id);
  if (!p) return '<span class="unassigned">Unassigned</span>';
  return '<span class="who">' + avatar(p, 'xs') + '<span>' + esc(p.name) + '</span></span>';
}
/* stageTag and healthPill are gone with the stage and health fields. The
   initiative list records neither, so nothing can draw them. valueTag,
   effortTag and statusPill in the exec block are what replaced them. */
function sysGlyph(k){
  var d = SYSTEMS[k] || SYSTEMS['Ad hoc'];
  return '<span class="ktype" style="background:' + d.color + '" title="' + esc(d.full) +
         '" aria-label="' + esc(d.full) + '"><b>' + d.glyph + '</b></span>';
}
function sysChip(k){
  var d = SYSTEMS[k] || SYSTEMS['Ad hoc'];
  return '<span class="epic" style="background:' + d.color + '" title="' + esc(d.full) + '">' + esc(d.label) + '</span>';
}
/* The business function a request was classified into. Always labelled as
   derived where it is shown, because it is the one inferred field. */
function fnChip(k){
  if (!k || !FUNCS[k]) return '<span class="tag" title="The request does not say which of the five units it is for">' + FN_NONE + '</span>';
  return '<span class="tag" title="' + esc(FUNCS[k].leader + ', ' + FUNCS[k].leaderTitle) + '">' + esc(FUNCS[k].label) + '</span>';
}
function ageChip(t){
  if (t.done) return '<span class="kage ok" title="Closed">' + (t.cycleDays == null ? 'Closed' : t.cycleDays + 'd') + '</span>';
  if (t.ageDays == null) return '';
  return '<span class="kage ' + t.ageTone + '" data-tip="' +
    esc(tipRows('Age', [['Open for', t.ageDays + ' days'],
      ['Aged past', AGED_DAYS + ' days'], ['Raised', fmtDate(t.created)]])) + '">' + t.ageDays + 'd</span>';
}

function gateTone(v){
  return v === 'done' ? 'ok' : v === 'prog' ? 'watch' : v === 'na' ? 'mute' : 'risk';
}

/* ===========================================================================
   10. TOOLTIP
   ---------------------------------------------------------------------------
   One shared tooltip element, positioned on pointer move. Every mark that
   carries data sets data-tip, so the hover layer is the default rather than
   something each chart has to remember.
   =========================================================================== */
var tipEl = document.getElementById('tip');
document.addEventListener('mouseover', function(e){
  var t = e.target.closest('[data-tip]');
  if (!t) return;
  tipEl.innerHTML = t.getAttribute('data-tip');
  tipEl.classList.add('on');
});
document.addEventListener('mousemove', function(e){
  if (!tipEl.classList.contains('on')) return;
  var pad = 14, w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  var x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
  if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
});
document.addEventListener('mouseout', function(e){
  if (e.target.closest('[data-tip]')) tipEl.classList.remove('on');
});
function tipRows(title, rows){
  return esc(title) === '' ? '' :
    '<b>' + title + '</b>' + rows.map(function(r){
      return '<div class="r"><em>' + r[0] + '</em><span>' + r[1] + '</span></div>';
    }).join('');
}

var toastEl = document.getElementById('toast'), toastT = null;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('on'); }, 2600);
}

/* ===========================================================================
   11. CHART PRIMITIVES
   ---------------------------------------------------------------------------
   Hand rolled inline SVG. No chart library, which keeps the web resource self
   contained and keeps every mark under our own accessibility rules.

   House rules applied in all of them: thin marks, hairline recessive grid,
   one value axis only, rounded ends on the data end of a bar, a 2px surface
   gap between adjacent fills, and a hover tooltip on every mark that carries
   a number. Text always wears an ink token, never the series colour.
   =========================================================================== */

/* Horizontal bars. Used wherever the category labels are words, which is most
   of the time, because vertical bars force the labels to rotate. */
function hBars(rows, opts){
  opts = opts || {};
  var w = 100, lab = opts.labelW == null ? 34 : opts.labelW, valW = opts.valueW == null ? 13 : opts.valueW;
  var max = opts.max || Math.max.apply(null, rows.map(function(r){ return r.v; }).concat([1]));
  var rowH = opts.rowH || 26, gap = 6, h = rows.length * rowH;
  var color = opts.color || 'var(--s1)';
  var out = ['<div class="chartbox ch" style="--ch-step:60ms"><svg viewBox="0 0 100 ' + h + '" preserveAspectRatio="none" role="img" aria-label="' + esc(opts.aria||'Bar chart') + '" style="height:' + h + 'px">'];
  rows.forEach(function(r, i){
    var y = i * rowH, bw = Math.max(0.4, (r.v / max) * (100 - lab - valW));
    var c = r.color || color;
    out.push('<rect class="mark cm gx" style="--i:' + i + '" x="' + lab + '" y="' + (y + (rowH-gap-8)/2) + '" width="' + bw + '" height="8" rx="2.2" fill="' + c + '" ' +
      'data-tip="' + esc(tipRows(r.k, [[opts.unit||'Value', r.label || nfmt(r.v)]].concat(r.extra||[]))) + '"></rect>');
  });
  out.push('</svg><div style="position:absolute;inset:0;display:grid;grid-template-rows:repeat(' + rows.length + ',1fr);pointer-events:none">');
  rows.forEach(function(r){
    out.push('<div style="display:grid;grid-template-columns:' + lab + '% 1fr ' + valW + '%;align-items:center;font-size:11.5px">' +
      '<span class="trunc" style="color:var(--ink-2);padding-right:8px" title="' + esc(r.k) + '">' + esc(r.k) + '</span><span></span>' +
      '<span class="num" style="color:var(--ink);font-weight:600;text-align:right">' + esc(r.label || nfmt(r.v)) + '</span></div>');
  });
  out.push('</div></div>');
  return out.join('');
}

/* Stacked horizontal bar, one row, used for composition tiles. Segments are
   separated by a 2px surface gap so adjacent fills never blur together. */
function stackBar(segs, opts){
  opts = opts || {};
  var total = sum(segs, function(s){ return s.v; }) || 1;
  return '<div class="bar-track" style="height:' + (opts.h||7) + 'px">' + segs.filter(function(s){ return s.v > 0; }).map(function(s){
    return '<i style="width:' + (s.v/total*100) + '%;background:' + s.color + '" data-tip="' +
      esc(tipRows(s.k, [['Count', nfmt(s.v)], ['Share', Math.round(s.v/total*100) + '%']])) + '"></i>';
  }).join('') + '</div>';
}
function legendOf(segs){
  return '<div class="mini-legend">' + segs.map(function(s){
    return '<span><i style="background:' + s.color + '"></i>' + esc(s.k) + ' <b class="num" style="color:var(--ink)">' + nfmt(s.v) + '</b></span>';
  }).join('') + '</div>';
}

/* Grouped vertical columns over time. One value axis, always. */
function colChart(cats, series, opts){
  opts = opts || {};
  var W = 720, H = opts.h || 190, padL = 40, padB = 26, padT = 12, padR = 8;
  var plotW = W - padL - padR, plotH = H - padB - padT;
  var max = opts.max || Math.max.apply(null, series.reduce(function(a,s){ return a.concat(s.v); }, [1]));
  var step = plotW / cats.length, n = series.length;
  var bw = Math.min(opts.barW || 16, (step - 10) / n);
  var ticks = 4, out = ['<div class="chartbox ch" style="--ch-step:40ms"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.aria||'Column chart') + '">'];
  for (var t = 0; t <= ticks; t++){
    var val = max * t / ticks, y = padT + plotH - (val/max)*plotH;
    out.push('<line class="gridline" x1="' + padL + '" y1="' + y + '" x2="' + (W-padR) + '" y2="' + y + '"></line>');
    out.push('<text class="axis-txt" x="' + (padL-7) + '" y="' + (y+3.5) + '" text-anchor="end">' + esc(opts.fmt ? opts.fmt(val) : Math.round(val)) + '</text>');
  }
  cats.forEach(function(c, i){
    var cx = padL + i*step + step/2;
    out.push('<text class="axis-txt" x="' + cx + '" y="' + (H-8) + '" text-anchor="middle">' + esc(c) + '</text>');
    series.forEach(function(s, j){
      var v = s.v[i] || 0, bh = (v/max)*plotH;
      var x = cx - (n*bw + (n-1)*2)/2 + j*(bw+2);
      if (bh > 0) out.push('<rect class="mark cm gy" style="--i:' + i + '" x="' + x + '" y="' + (padT+plotH-bh) + '" width="' + bw + '" height="' + bh + '" rx="3" fill="' + s.color + '"' +
        (s.hatch ? ' fill-opacity=".45" stroke="' + s.color + '" stroke-width="1" stroke-dasharray="3 2"' : '') +
        ' data-tip="' + esc(tipRows(c, [[s.k, opts.fmt ? opts.fmt(v) : nfmt(v)]])) + '"></rect>');
    });
  });
  out.push('<line class="axis-line" x1="' + padL + '" y1="' + (padT+plotH) + '" x2="' + (W-padR) + '" y2="' + (padT+plotH) + '"></line>');
  out.push('</svg></div>');
  if (series.length > 1) out.push('<div class="legend">' + series.map(function(s){
    return '<span><i style="background:' + s.color + (s.hatch ? ';opacity:.55' : '') + '"></i>' + esc(s.k) + '</span>';
  }).join('') + '</div>');
  return out.join('');
}

/* Cumulative line with a crosshair. Used for benefit realisation, where the
   shape of the curve is the point, not the individual values. */
function lineChart(cats, series, opts){
  opts = opts || {};
  var W = 720, H = opts.h || 210, padL = 44, padB = 26, padT = 14, padR = 12;
  var plotW = W - padL - padR, plotH = H - padB - padT;
  var max = opts.max || Math.max.apply(null, series.reduce(function(a,s){ return a.concat(s.v); }, [1])) * 1.08;
  var step = cats.length > 1 ? plotW/(cats.length-1) : plotW;
  var X = function(i){ return padL + i*step; }, Y = function(v){ return padT + plotH - (v/max)*plotH; };
  var out = ['<div class="chartbox"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.aria||'Line chart') + '">'];
  for (var t = 0; t <= 4; t++){
    var val = max*t/4, y = Y(val);
    out.push('<line class="gridline" x1="' + padL + '" y1="' + y + '" x2="' + (W-padR) + '" y2="' + y + '"></line>');
    out.push('<text class="axis-txt" x="' + (padL-7) + '" y="' + (y+3.5) + '" text-anchor="end">' + esc(opts.fmt ? opts.fmt(val) : Math.round(val)) + '</text>');
  }
  cats.forEach(function(c,i){ out.push('<text class="axis-txt" x="' + X(i) + '" y="' + (H-8) + '" text-anchor="middle">' + esc(c) + '</text>'); });
  if (opts.markerAt != null){
    out.push('<line x1="' + X(opts.markerAt) + '" y1="' + padT + '" x2="' + X(opts.markerAt) + '" y2="' + (padT+plotH) + '" stroke="var(--brand)" stroke-width="1.5" opacity=".5"></line>');
    out.push('<text class="axis-txt" x="' + (X(opts.markerAt)+5) + '" y="' + (padT+9) + '" style="fill:var(--brand-ink);font-weight:600">' + esc(opts.markerLabel||'today') + '</text>');
  }
  series.forEach(function(s){
    var pts = s.v.map(function(v,i){ return X(i) + ',' + Y(v); }).join(' ');
    if (s.area) out.push('<polygon points="' + X(0) + ',' + Y(0) + ' ' + pts + ' ' + X(s.v.length-1) + ',' + Y(0) + '" fill="' + s.color + '" opacity=".1"></polygon>');
    out.push('<polyline points="' + pts + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' + (s.dash ? ' stroke-dasharray="5 4"' : '') + '></polyline>');
    s.v.forEach(function(v,i){
      out.push('<circle class="mark" cx="' + X(i) + '" cy="' + Y(v) + '" r="4" fill="' + s.color + '" stroke="var(--surface)" stroke-width="2" ' +
        'data-tip="' + esc(tipRows(cats[i], [[s.k, opts.fmt ? opts.fmt(v) : nfmt(v)]])) + '"></circle>');
    });
  });
  out.push('<line class="axis-line" x1="' + padL + '" y1="' + (padT+plotH) + '" x2="' + (W-padR) + '" y2="' + (padT+plotH) + '"></line></svg></div>');
  out.push('<div class="legend">' + series.map(function(s){
    return '<span><i class="ln" style="background:' + s.color + (s.dash ? ';opacity:.6' : '') + '"></i>' + esc(s.k) + '</span>';
  }).join('') + '</div>');
  return out.join('');
}

/* Sequential heatmap. One hue, light to dark, with a scale legend. Counts are
   printed in every cell so the colour is never the only encoding. */
function heatmap(rows, cols, get, opts){
  opts = opts || {};
  var max = 0;
  rows.forEach(function(r){ cols.forEach(function(c){ max = Math.max(max, get(r,c)); }); });
  var ramp = ['--o1','--o2','--o3','--o4','--o5','--o6'];
  function shade(v){
    if (!v) return { bg:'var(--surface-2)', fg:'var(--ink-3)' };
    var i = Math.min(ramp.length-1, Math.ceil(v/max * ramp.length) - 1);
    return { bg:'var(' + ramp[i] + ')', fg: i >= 2 ? '#fff' : 'var(--ink)' };
  }
  /* Wrapped in its own scroller with a floor width. A heatmap squeezed below
     legibility is worse than one the reader scrolls, and a scroller here keeps
     the page body from scrolling sideways. */
  var out = ['<div class="heatwrap ch" style="--ch-step:32ms"><div class="heat" style="grid-template-columns:118px repeat(' + cols.length + ',minmax(34px,1fr))">'];
  out.push('<div></div>');
  cols.forEach(function(c){ out.push('<div class="hh">' + esc(c.label) + '</div>'); });
  rows.forEach(function(r, ri){
    out.push('<div class="hr">' + esc(r.label) + '</div>');
    cols.forEach(function(c, ci){
      var v = get(r,c), s = shade(v);
      out.push('<div class="hc cm pop" style="--i:' + (ri + ci) + ';background:' + s.bg + ';color:' + s.fg + '" data-tip="' +
        esc(tipRows(r.label + ' with ' + c.label.toLowerCase(), [['Initiatives', v]])) + '">' + (v || '') + '</div>');
    });
  });
  out.push('</div></div>');
  out.push('<div class="row gap-8" style="margin-top:10px;justify-content:flex-end"><span class="tiny faint">None</span>' +
    ramp.map(function(k){ return '<i style="width:18px;height:9px;border-radius:2px;background:var(' + k + ')"></i>'; }).join('') +
    '<span class="tiny faint">' + max + '</span></div>');
  return out.join('');
}

/* Stage funnel. Ordered categories, so the ordinal ramp, with the conversion
   rate between steps shown on the join rather than left to be inferred. */
function funnel(steps, opts){
  opts = opts || {};
  var max = Math.max.apply(null, steps.map(function(s){ return s.v; }).concat([1]));
  var H = opts.h || 118;
  return '<div class="funnel">' + steps.map(function(s, i){
    var h = Math.max(24, (s.v/max) * H);
    var prev = i > 0 ? steps[i-1].v : null;
    var conv = prev ? Math.round(s.v/prev*100) : null;
    return '<div class="fstep">' +
      '<div style="height:' + H + 'px;display:flex;align-items:flex-end">' +
        '<div class="fbar mark" style="height:' + h + 'px;width:100%;background:var(' + s.ramp + ');color:' + s.ink + '" data-tip="' +
          esc(tipRows(s.k, [['Initiatives', s.v], ['Median days in stage', s.median == null ? 'n/a' : s.median]])) + '">' + s.v + '</div>' +
      '</div>' +
      (conv != null && i < steps.length ? '<div class="fconv" style="top:' + (H - h/2) + 'px">' + conv + '%</div>' : '') +
      '<div class="fname">' + esc(s.k) + '</div>' +
      '<div class="fmeta">' + (s.median == null ? '' : s.median + ' days median') + '</div>' +
    '</div>';
  }).join('') + '</div>';
}

/* ===========================================================================
   12. PORTFOLIO ROLLUPS
   ---------------------------------------------------------------------------
   Short, because the source is short. Six initiatives with value, effort,
   impacted users and one status between them. Every figure the executive view
   prints is computed here, so there is one definition of each and no view can
   invent its own.

   There is deliberately no spend, benefit, return, burn, coverage or
   realisation curve. None of those inputs exist in the source, and a
   plausible-looking dollar figure is the single fastest way to lose an
   executive's trust in a screen.
   =========================================================================== */
function rollup(){
  var r = {
    total: INITIATIVES.length,
    moving: INITIATIVES.filter(function(x){ return x.moving; }),
    notStated: INITIATIVES.filter(function(x){ return !x.moving; }),
    users: sum(INITIATIVES, function(x){ return x.users; }),
    byValue: {}, byEffort: {}, byFunc: {}, byCap: {}
  };

  VALUE_KEYS.forEach(function(k){
    var g = INITIATIVES.filter(function(x){ return x.value === k; });
    r.byValue[k] = { items:g, n:g.length, users:sum(g, function(x){ return x.users; }) };
  });
  EFFORT_KEYS.forEach(function(k){
    var g = INITIATIVES.filter(function(x){ return x.effort === k; });
    r.byEffort[k] = { items:g, n:g.length, users:sum(g, function(x){ return x.users; }) };
  });
  FUNC_KEYS.forEach(function(k){
    var g = INITIATIVES.filter(function(x){ return x.f === k; });
    r.byFunc[k] = { items:g, n:g.length,
      users: sum(g, function(x){ return x.users; }),
      evidence: sum(g, function(x){ return x.tickets.length; }) };
  });
  CAP_KEYS.forEach(function(k){
    var g = INITIATIVES.filter(function(x){ return x.cap === k; });
    r.byCap[k] = { items:g, n:g.length };
  });
  r.noCap = INITIATIVES.filter(function(x){ return !x.cap; }).length;

  /* High value and not yet moving. The one decision this list unambiguously
     puts in front of an executive. */
  r.readyToStart = INITIATIVES.filter(function(x){
    return x.value === 'high' && !x.moving;
  }).sort(function(a,b){ return b.leverage - a.leverage || b.users - a.users; });

  /* Low value work that still costs medium effort or more. The other side of
     the same decision. */
  r.challenge = INITIATIVES.filter(function(x){
    return x.value === 'low' && EFFORT[x.effort].rank >= 2;
  }).sort(function(a,b){ return a.leverage - b.leverage; });

  r.evidenceRows = TICKETS.filter(function(t){ return t.ini; }).length;
  r.noEvidence = INITIATIVES.filter(function(x){ return !x.tickets.length; });
  r.blockedByDesk = DEPS.filter(function(d){ return d.open > 0; });

  return r;
}

/* Where the reporting desk demand sits against whether an initiative covers
   it. The demand side is counted tracker rows. The coverage side is a count
   of initiatives, NOT money, because there is no money in the source.

   This is the one comparison worth an executive's time, and it is the reason
   the two halves of this portal are one product. */
function demandSignals(){
  var totalReq = TICKETS.filter(function(t){ return t.fn; }).length || 1;
  return FUNC_KEYS.map(function(k){
    var reqs = TICKETS.filter(function(t){ return t.fn === k; });
    var openR = reqs.filter(function(t){ return !t.done; });
    var inis = INITIATIVES.filter(function(x){ return x.f === k; });
    return {
      fn:k, label:FUNCS[k].label,
      demand: reqs.length,
      demandShare: reqs.length / totalReq * 100,
      open: openR.length,
      aged: openR.filter(function(t){ return t.aged; }).length,
      evidence: reqs.filter(function(t){ return t.ini; }).length,
      initiatives: inis.length,
      moving: inis.filter(function(x){ return x.moving; }).length,
      users: sum(inis, function(x){ return x.users; }),
      highValue: inis.filter(function(x){ return x.value === 'high'; }).length
    };
  }).sort(desc('demand'));
}

/* Reporting desk rollups, all computed from columns the tracker actually has.

   Cycle time is the request date to the completion date. Only thirty four of
   the seventy eight rows carry both dates, so the median is stated with that
   denominator rather than presented as if it covered everything.

   There is no service level in the source, so nothing here reports a breach.
   "Aged" is open longer than AGED_DAYS and is labelled as a portal
   convention wherever it appears. */
function deskRollup(){
  var open = TICKETS.filter(function(t){ return !t.done; });
  var doneT = TICKETS.filter(function(t){ return t.done; });
  var measured = doneT.filter(function(t){ return t.cycleDays != null; });
  var cycles = measured.map(function(t){ return t.cycleDays; }).sort(function(a,b){ return a-b; });
  var aged = open.filter(function(t){ return t.aged; });
  var cancelled = doneT.filter(function(t){ return t.resolution === 'Cancelled'; });

  return {
    total: TICKETS.length,
    open: open.length,
    done: doneT.length,
    cancelled: cancelled.length,
    cancelledList: cancelled,
    blocked: open.filter(function(t){ return t.blocked; }).length,
    blockedList: open.filter(function(t){ return t.blocked; }),
    unassigned: open.filter(function(t){ return !t.assignee; }).length,
    aged: aged.length,
    agedList: aged.sort(desc('ageDays')),
    medianCycle: cycles.length ? cycles[Math.floor(cycles.length/2)] : null,
    p90Cycle: cycles.length ? cycles[Math.min(cycles.length-1, Math.floor(cycles.length*0.9))] : null,
    measuredCycle: measured.length,
    noCompletionDate: doneT.length - measured.length,
    linked: TICKETS.filter(function(t){ return t.ini; }).length,
    unclassified: TICKETS.filter(function(t){ return !t.fn; }).length,
    contradictions: TICKETS.filter(function(t){ return t.contra; }),
    byCol: groupCount(TICKETS, function(t){ return t.col; }),
    bySys: groupCount(TICKETS, function(t){ return t.sys; }),
    byFn: groupCount(TICKETS.filter(function(t){ return t.fn; }), function(t){ return t.fn; }),
    byAnalyst: groupCount(TICKETS.filter(function(t){ return t.assignee; }), function(t){ return t.assignee; }),
    byRequester: groupCount(TICKETS.filter(function(t){ return t.reporter; }), function(t){ return t.reporter; })
  };
}

/* Median cycle time per system, on the rows that carry both dates. Returned
   with its denominator so a two row system is never shown as if it were as
   solid as a forty row one. */
function cycleBySystem(){
  return SYS_KEYS.map(function(k){
    var m = TICKETS.filter(function(t){ return t.sys === k && t.cycleDays != null; })
                   .map(function(t){ return t.cycleDays; }).sort(function(a,b){ return a-b; });
    return { sys:k, n:m.length,
             median: m.length ? m[Math.floor(m.length/2)] : null,
             total: TICKETS.filter(function(t){ return t.sys === k; }).length };
  }).filter(function(r){ return r.total > 0; }).sort(desc('total'));
}

/* Requests raised per month, thirteen months back, optionally for one
   business function. Straight off the request dates. */
function demandSeries(fn){
  var out = [], now = new Date(NOW);
  for (var m = 12; m >= 0; m--){
    var start = new Date(now.getFullYear(), now.getMonth() - m, 1).getTime();
    var end   = new Date(now.getFullYear(), now.getMonth() - m + 1, 1).getTime();
    out.push(TICKETS.filter(function(t){
      if (fn && t.fn !== fn) return false;
      if (!t.created) return false;
      var c = new Date(t.created).getTime();
      return c >= start && c < end;
    }).length);
  }
  return out;
}

/* ===========================================================================
   13. SPARKLINE AND BULLET PRIMITIVES
   =========================================================================== */
function sparkline(vals, opts){
  opts = opts || {};
  var W = 88, H = 24, max = Math.max.apply(null, vals.concat([1]));
  var step = vals.length > 1 ? W/(vals.length-1) : W;
  var pts = vals.map(function(v,i){ return (i*step).toFixed(1) + ',' + (H - (v/max)*(H-3) - 1.5).toFixed(1); }).join(' ');
  var last = vals[vals.length-1], prev = vals[vals.length-2] || 0;
  var col = opts.color || 'var(--ink-3)';
  return '<span class="ch" style="display:inline-flex;align-items:center;gap:6px;--ch-step:90ms">' +
    '<svg class="cm wipe" viewBox="0 0 ' + W + ' ' + H + '" style="--i:' + (opts.i || 0) + ';width:' + W + 'px;height:' + H + 'px" role="img" aria-label="' + esc(opts.aria||'Trend') + '">' +
    '<polyline points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></polyline>' +
    '<circle cx="' + ((vals.length-1)*step).toFixed(1) + '" cy="' + (H - (last/max)*(H-3) - 1.5).toFixed(1) + '" r="2.6" fill="' + col + '"></circle></svg>' +
    '<span class="tiny num" style="color:' + (last > prev ? 'var(--watch)' : 'var(--ink-3)') + ';font-weight:700">' + last + '</span></span>';
}

/* A three step ordinal read as a small bar, so High / Medium / Low can be
   scanned down a column without reading each word. */
function ordBar(rank, tone){
  return '<span class="row gap-4 ch" style="display:inline-flex;--ch-step:80ms">' +
    [1,2,3].map(function(i){
      return '<i class="cm gy" style="--i:' + (i - 1) + ';width:9px;height:12px;border-radius:2px;background:' +
        (i <= rank ? (tone || 'var(--o4)') : 'var(--track)') + '"></i>';
    }).join('') + '</span>';
}
function valueTag(k){
  var v = VALUE[k];
  return '<span class="tag" style="background:var(' + v.ramp + ');color:' + v.ink + ';border-color:transparent">' + esc(v.label) + ' Value</span>';
}
function effortTag(k){
  return '<span class="tag">' + esc(EFFORT[k].label) + ' Effort</span>';
}
function statusPill(k){
  var s = STATUSES[k];
  return '<span class="pill ' + s.tone + '"><i class="dot"></i>' + esc(s.label) + '</span>';
}
/* Impacted user counts in the source are all approximate. The tilde is kept
   so nobody reads 35 as a measured figure. */
function users(n){ return 'about ' + nfmt(n); }

/* ===========================================================================
   14. WHAT NEEDS A DECISION
   ---------------------------------------------------------------------------
   Every row names the rule that raised it. With this source there are only
   four rules that can be stated honestly, and none of them involve money.
   =========================================================================== */
var RULES = [
  { code:'READY',      label:'High Value, Not Started',  threshold:'Marked high value with no status recorded against it' },
  { code:'LOW_RETURN', label:'Low Value, Real Effort',   threshold:'Marked low value and medium effort or higher' },
  { code:'BLOCKED',    label:'Waiting on the Desk',      threshold:'A stated dependency whose reporting desk rows are still open' },
  { code:'UNEVIDENCED',label:'No Demand Evidence',       threshold:'No request in the tracker names this subject' },
  { code:'CONTESTED',  label:'Note Conflicts With Demand', threshold:'The note says nobody is asking, while the tracker shows requests' }
];
var RULE = {}; RULES.forEach(function(r){ RULE[r.code] = r; });

function exceptions(){
  var out = [], r = rollup();
  function add(x, code, decision){
    out.push({ x:x, code:code, decision:decision });
  }
  r.readyToStart.forEach(function(x){
    add(x, 'READY', 'Decide whether ' + x.c + ' starts. It is marked high value, ' +
      EFFORT[x.effort].label.toLowerCase() + ' effort, reaching ' + users(x.users) + ' people, and nothing records it as under way');
  });
  r.blockedByDesk.forEach(function(d){
    var x = initiative(d.from);
    add(x, 'BLOCKED', 'Sequence the Customer Record work or accept the wait on ' + x.c + '. ' +
      d.open + ' of ' + d.rows.length + ' rows it depends on are still open');
  });
  r.challenge.forEach(function(x){
    add(x, 'LOW_RETURN', 'Challenge or drop ' + x.c + '. It is marked low value against ' +
      EFFORT[x.effort].label.toLowerCase() + ' effort for ' + users(x.users) + ' people');
  });
  /* The one genuine contradiction between the two sources: Customer Assistance
     Genie's note says nobody is asking, and the tracker holds thirteen
     assistance report requests. Worth surfacing precisely because the two
     halves of this portal disagree. */
  INITIATIVES.forEach(function(x){
    var saysNoDemand = x.notes.some(function(n){ return /no direct requests|content with current state/i.test(n); });
    if (saysNoDemand && x.tickets.length >= 3){
      add(x, 'CONTESTED', 'Revisit the demand case for ' + x.c + '. The note says nobody is asking, but ' +
        x.tickets.length + ' tracker requests cover the same ground');
    }
  });
  r.noEvidence.forEach(function(x){
    add(x, 'UNEVIDENCED', 'Find the demand case for ' + x.c + ', or park it. No request in the tracker names this subject');
  });

  var seen = {};
  return out.filter(function(e){
    if (seen[e.x.c]) return false; seen[e.x.c] = 1; return true;
  });
}

/* ===========================================================================
   14b. HERO MOSAIC
   ---------------------------------------------------------------------------
   A grid of cells, each split on one diagonal or the other, giving a
   tessellation of triangles. Shards are sorted into three depth layers that
   move at different rates as the page scrolls, which reads as depth rather
   than as decoration sliding about.

   The pattern is DETERMINISTIC, hashed from each cell's coordinates rather
   than drawn at random. The hero re-renders on every view change, and a
   mosaic that reshuffled each time would read as a glitch.
   =========================================================================== */
var MOSAIC_W = 1400, MOSAIC_H = 210;

/* Convergence is expressed directly rather than through a literal vanishing
   point. A VP close enough to compress the floors convincingly also throws
   the outer piers into near horizontal streaks, because this banner is a
   wide shallow slice rather than a tall frame like the photograph. So
   horizontals hold their line and the elevation narrows as it rises. Same
   read, and it holds at any banner width. */
var CENTRE_X = 700;
var TOP_SCALE = 0.84;
var BAY_W = 132, PIER_W = 26;
var FLOOR_GAP = 52, FLOOR_RATIO = 0.76;

function proj(bx, y){
  var k = 1 - (1 - TOP_SCALE) * (MOSAIC_H - y) / MOSAIC_H;
  return [CENTRE_X + (bx - CENTRE_X) * k, y];
}
function ln(a, b, op, w){
  return '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) +
         '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) +
         '" stroke="#fff" stroke-opacity="' + op.toFixed(3) + '" stroke-width="' + w + '"></line>';
}

function heroMosaic(){
  var glass = [], floors = [], piers = [];

  var ys = [MOSAIC_H], gap = FLOOR_GAP, y = MOSAIC_H;
  while (y > -12 && ys.length < 22){ y -= gap; gap *= FLOOR_RATIO; ys.push(y); }

  var cols = [], bx;
  for (bx = CENTRE_X - Math.ceil((CENTRE_X + 300) / BAY_W) * BAY_W; bx < MOSAIC_W + 340; bx += BAY_W) cols.push(bx);

  var top = ys[ys.length - 1], first = cols[0], last = cols[cols.length - 1] + PIER_W;

  /* Floor lines, thinning as they recede. */
  for (var k = 1; k < ys.length; k++){
    var fade = 1 - k / ys.length * 0.45;
    floors.push(ln(proj(first, ys[k]), proj(last, ys[k]), 0.26 * fade, 1));
  }

  /* Pier edges. Two hairlines per pier, which is what makes a drawn pier
     read as a solid one without filling it. */
  for (var ci = 0; ci < cols.length; ci++){
    var a = proj(cols[ci], MOSAIC_H), b = proj(cols[ci], top);
    if (Math.max(a[0], b[0]) < -30 || Math.min(a[0], b[0]) > MOSAIC_W + 30) continue;
    var h = ((ci + 11) * 2654435761) >>> 0;
    var op = 0.34 + ((h >>> 3) & 7) / 7 * 0.14;
    piers.push(ln(a, b, op, 1.1));
    piers.push(ln(proj(cols[ci] + PIER_W, MOSAIC_H), proj(cols[ci] + PIER_W, top), op * 0.5, 0.9));
  }

  /* A sparse scatter of panes catching sky, the way the glass does in the
     photograph. Deliberately few: the drawing carries the banner, and filled
     panels everywhere is what made the first attempt look like clip art. */
  for (ci = 0; ci < cols.length - 1; ci++){
    for (k = 0; k < ys.length - 1; k++){
      var hh = (((ci + 7) * 73856093) ^ ((k + 3) * 19349663)) >>> 0;
      if ((hh & 15) < 12) continue;
      var x0 = cols[ci] + PIER_W, x1 = cols[ci + 1];
      var q = [proj(x0, ys[k]), proj(x1, ys[k]), proj(x1, ys[k + 1]), proj(x0, ys[k + 1])];
      if (Math.max(q[0][0], q[1][0]) < -20 || Math.min(q[0][0], q[3][0]) > MOSAIC_W + 20) continue;
      glass.push('<polygon points="' + q.map(function(pt){ return pt[0].toFixed(1) + ',' + pt[1].toFixed(1); }).join(' ') +
        '" fill="#fff" fill-opacity="' + (0.06 + ((hh >>> 6) & 7) / 7 * 0.08).toFixed(3) + '"></polygon>');
    }
  }

  return '<svg class="hero-mosaic" viewBox="0 0 ' + MOSAIC_W + ' ' + MOSAIC_H + '" ' +
    'preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">' +
    '<defs>' +
      /* Atmospheric fade. Distance washes detail out, and that is what gives
         the elevation depth here rather than any shadow. */
      '<linearGradient id="hmFadeG" x1="0" y1="1" x2="0" y2="0">' +
        '<stop offset="0" stop-color="#fff" stop-opacity="1"/>' +
        '<stop offset=".55" stop-color="#fff" stop-opacity=".62"/>' +
        '<stop offset="1" stop-color="#fff" stop-opacity=".24"/>' +
      '</linearGradient>' +
      '<mask id="hmFade" maskUnits="userSpaceOnUse" x="0" y="0" width="' + MOSAIC_W + '" height="' + MOSAIC_H + '">' +
        '<rect x="0" y="0" width="' + MOSAIC_W + '" height="' + MOSAIC_H + '" fill="url(#hmFadeG)"></rect>' +
      '</mask>' +
      '<radialGradient id="hmGlowG">' +
        '<stop offset="0" stop-color="#fff" stop-opacity=".20"/>' +
        '<stop offset=".55" stop-color="#fff" stop-opacity=".07"/>' +
        '<stop offset="1" stop-color="#fff" stop-opacity="0"/>' +
      '</radialGradient>' +
      /* Grain. Static, so it is rasterised once, and the single thing that
         stops this reading as flat vector work. */
      '<filter id="hmGrainF" x="0" y="0" width="100%" height="100%">' +
        '<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>' +
        '<feColorMatrix type="saturate" values="0"/>' +
      '</filter>' +
    '</defs>' +
    '<g class="hm-arch" mask="url(#hmFade)">' +
      '<g data-depth="0">' + glass.join('') + '</g>' +
      '<g data-depth="1">' + floors.join('') + '</g>' +
      '<g data-depth="2">' + piers.join('') + '</g>' +
    '</g>' +
    '<ellipse class="hero-glow" cx="620" cy="118" rx="430" ry="190" fill="url(#hmGlowG)"></ellipse>' +
    '<rect x="0" y="0" width="' + MOSAIC_W + '" height="' + MOSAIC_H + '" filter="url(#hmGrainF)" ' +
      'opacity=".16" style="mix-blend-mode:overlay"></rect>' +
    '</svg>';
}

/* How far each depth layer travels per pixel scrolled, and how far it drifts
   sideways. Ordered the way the building is built: the glass is furthest
   back and barely moves, the spandrels sit in front of it, and the piers
   stand proudest of all and move most. */
var MOSAIC_RATES = [0.05, 0.11, 0.20];
var MOSAIC_DRIFT = [-0.02, 0.01, 0.05];

/* Parallax, driven off the page scroll and throttled to one animation frame.
   Only transforms are touched, and only while the hero is still on screen. */
var mosaicTicking = false;
function updateMosaic(){
  var svg = document.querySelector('.hero-mosaic');
  if (!svg) return;
  var y = window.pageYOffset || document.documentElement.scrollTop || 0;
  var hero = svg.parentNode;
  if (y > hero.offsetHeight + 60) return;   /* nothing to see once it is gone */
  var gs = svg.querySelectorAll('g[data-depth]');
  for (var i = 0; i < gs.length; i++){
    var rate = MOSAIC_RATES[i], drift = MOSAIC_DRIFT[i];
    gs[i].setAttribute('transform',
      'translate(' + (y * drift).toFixed(2) + ' ' + (-y * rate).toFixed(2) + ')');
  }
}
window.addEventListener('scroll', function(){
  if (mosaicTicking) return;
  mosaicTicking = true;
  window.requestAnimationFrame(function(){ mosaicTicking = false; updateMosaic(); });
}, { passive: true });


/* The value against effort board. Used by the executive report and by the
   portfolio tab, so the same object means the same thing in both places.

   Cells and chips carry their own stagger delay inline rather than relying
   on nth-child, because the number of chips per cell varies and a fixed
   nth-child ladder would make a busy cell finish before an empty one. */
function valueEffortBoard(items){
  var VORDER = ['high','medium','low'], EORDER = ['low','medium','high'];
  var out = ['<div class="rp-ve">', '<div class="rp-ve-cnr"></div>'];
  EORDER.forEach(function(e){ out.push('<div class="rp-ve-col">' + esc(EFFORT[e].label) + ' effort</div>'); });

  var n = 0;
  VORDER.forEach(function(v, vi){
    out.push('<div class="rp-ve-row">' + esc(VALUE[v].label) + ' value</div>');
    EORDER.forEach(function(e, ei){
      var here = items.filter(function(x){ return x.value === v && x.effort === e; });
      var hot = (v === 'high' && e === 'low');
      var delay = (vi * 3 + ei) * 55;
      out.push('<div class="rp-ve-cell ' + (hot ? 'hot' : (here.length ? '' : 'empty')) +
        '" style="transition-delay:' + delay + 'ms">' +
        '<div class="cl">' + (here.length ? here.length + (here.length === 1 ? ' initiative' : ' initiatives') : 'None') + '</div>' +
        here.map(function(x, i){
          return '<button class="rp-ini" data-open="' + x.c + '" style="transition-delay:' + (delay + 220 + i * 90) + 'ms">' +
            '<span class="nm">' + esc(x.n) + '</span>' +
            '<span class="mt">' + (x.moving ? '<i class="dot"></i>In progress' : x.c) +
            '<span>' + nfmt(x.users) + ' users</span>' +
            (x.tickets.length ? '<span>' + x.tickets.length + ' requests</span>' : '') + '</span></button>';
        }).join('') +
      '</div>');
      n++;
    });
  });
  out.push('</div>');
  return out.join('');
}

/* A bar whose width is written in on reveal, so it grows rather than simply
   appearing. Matches the pattern in the report the team liked. */
/* The executive stage for value against effort. The portfolio keeps its own
   board; this is the executive view's version of the same nine cells. */
function veStage(items){
  var VO = ['high','medium','low'], EO = ['low','medium','high'];
  var total = items.length || 1;
  var maxU = Math.max.apply(null, items.map(function(x){ return x.users || 0; }).concat([1]));
  var CORNER = { 'high|low':'Do First', 'high|high':'Big Bets', 'low|low':'Fill-Ins', 'low|high':'Reconsider' };
  function score(x){ return VALUE[x.value].rank - EFFORT[x.effort].rank; }
  /* Circles drop in by priority, so the eye lands on the do first corner. */
  var seq = {};
  items.slice().sort(function(a,b){ return score(b) - score(a) || b.users - a.users; })
    .forEach(function(x, i){ seq[x.c] = i; });
  /* Area, not diameter, carries people reached, with a floor so the smallest
     initiatives are still something to click. */
  function dia(u){ return Math.max(24, Math.round(80 * Math.sqrt((u || 0) / maxU))); }
  function bar(n, i, base){
    return '<span class="ve2-trk"><span class="cm gx" style="--i:' + i + ';--base:' + base + 'ms;--ch-step:90ms;width:' + (n / total * 100) + '%"></span></span>';
  }

  var doFirst = items.filter(function(x){ return x.value === 'high' && x.effort === 'low'; });
  var moving = doFirst.filter(function(x){ return x.moving; }).length;
  var desc = doFirst.length ?
    esc(doFirst.map(function(x){ return x.n; }).join(' and ')) + '. ' +
    (moving === 0 ? (doFirst.length === 1 ? 'It is not recorded as started.' : 'None of them are recorded as started.')
                  : (doFirst.length === 1 ? 'It is recorded as in progress.' : moving + ' of them are recorded as in progress.')) +
    (doFirst.length === 1 ? ' It would reach ' : ' Between them they would reach ') + users(sum(doFirst, function(x){ return x.users; })) + ' people.'
    : 'Nothing on the register is rated high value for low effort.';

  var h = '<div class="ve2 ch" style="--ch-step:70ms">' +
    '<div class="ve2-head"><div>' +
      '<div class="ve2-eyebrow">Value Against Effort</div>' +
      '<div class="ve2-headline"><span class="ve2-big" data-count="' + doFirst.length + '">' + doFirst.length + '</span>' +
        '<div><div class="ve2-hl">In the Do First Corner</div><div class="ve2-desc">' + desc + '</div></div></div>' +
    '</div><div class="ve2-key">' +
      '<span><i></i>Circle area shows people reached</span>' +
      '<span><i class="ring"></i>Ring marks work in progress</span>' +
    '</div></div>' +
    '<div class="ve2-grid">' + '<div></div>';

  EO.forEach(function(e, ei){
    var n = items.filter(function(x){ return x.effort === e; }).length;
    h += '<div class="ve2-ch"><div class="ve2-cl"><span>' + esc(EFFORT[e].label) + ' Effort</span><b>' + n + ' of ' + total + '</b></div>' + bar(n, ei, 380) + '</div>';
  });
  h += '<div class="ve2-mh"></div>';

  VO.forEach(function(v, vi){
    var nv = items.filter(function(x){ return x.value === v; }).length;
    h += '<div class="ve2-rh"><span>' + esc(VALUE[v].label) + '<br>Value</span><b>' + nv + ' of ' + total + '</b></div>';
    EO.forEach(function(e, ei){
      var here = items.filter(function(x){ return x.value === v && x.effort === e; });
      var sc = VALUE[v].rank - EFFORT[e].rank;
      var cls = 's' + (sc < 0 ? 'n' + (-sc) : sc) + (v === 'high' && e === 'low' ? ' ve2-hot' : '');
      var corner = CORNER[v + '|' + e];
      h += '<div class="ve2-cell cm rise ' + cls + '" style="--i:' + (vi + ei) + '">' +
        (corner ? '<span class="ve2-tag">' + corner + '</span>' : '') +
        '<div class="ve2-bubs">' + here.map(function(x){
          return '<button class="ve2-b cm bub' + (x.moving ? ' on' : '') + '" data-open="' + x.c + '" ' +
            'style="--i:' + seq[x.c] + ';--base:620ms;--ch-step:130ms;--d:' + dia(x.users) + 'px" data-tip="' +
            esc(tipRows(x.c + ' ' + x.n, [['Value', VALUE[x.value].label], ['Effort', EFFORT[x.effort].label],
              ['People reached', users(x.users)], ['Status', STATUSES[x.status].label]])) + '">' +
            '<span class="ve2-dot"></span>' +
            '<span class="ve2-nm">' + esc(x.n) + '</span>' +
            '<span class="ve2-mt">' + x.c + ' &#183; ' + users(x.users) + '</span></button>';
        }).join('') + '</div></div>';
    });
    h += '<div class="ve2-rm"><div class="ve2-cl"><span>' + esc(VALUE[v].label) + ' Value</span><b>' + nv + ' of ' + total + '</b></div>' + bar(nv, vi, 460) + '</div>';
  });

  return h + '</div>' +
    '<div class="ve2-foot">Both ratings are the three step values the register records, High, Medium or Low, so this is a board of nine cells rather than a chart with scales. Select a circle to open the initiative.</div>' +
  '</div>';
}

/* ===========================================================================
   15. VIEW: EXECUTIVE LANDSCAPE
   ---------------------------------------------------------------------------
   A scrolling report rather than a dashboard, following the structure of the
   Con Edison DAC report: a full height opener, then alternating bands, each
   introduced by a tag, a heading and a line of plain English before any
   number appears. Sections reveal as they come into view.

   The operational pages stay as a dense application. This one is the only
   page an executive reads rather than works in, so it is the only one built
   to be read.

   Two rules still hold from before, and matter more in this format because
   prose can hide things a table cannot:
     1. No figure without the reference value it should be judged against.
     2. No dollars anywhere. The initiative records carry none.
   =========================================================================== */
function viewExec(){
  var r = rollup(), d = deskRollup(), ex = exceptions();
  var sig = demandSignals();
  var totalDemand = sum(sig, function(s){ return s.demand; }) || 1;

  function kpi(v, label, sub){
    /* Only plain whole numbers count up; "n/a" and formatted values are
       printed as they are. The real value is in the markup either way. */
    var n = /^\d+$/.test(String(v)) ? ' data-count="' + v + '"' : '';
    return '<div class="rp-kpi"><span class="v"' + n + '>' + v + '</span>' +
      '<div class="l">' + label + '</div>' + (sub ? '<div class="s">' + sub + '</div>' : '') + '</div>';
  }
  function tag(t){ return '<div class="rp-tag"><span>' + esc(t) + '</span></div>'; }

  /* ---- opener ----------------------------------------------------------- */
  var hero =
  '<section class="rp-hero">' +
    '<div class="rp-hero-photo"></div><div class="rp-hero-tint"></div>' + heroMosaic() + AURORA + '<div class="ai-dots"></div>' +
    '<div class="rp-hero-in">' +
      '<div class="rp-eyebrow ai-beam"><i class="ai-orb"></i><span>Orange and Rockland · AI Portfolio</span></div>' +
      '<h1>Unified AI and<br><em class="ai-text">Intake Portal</em></h1>' +
      '<p>The AI initiatives and the reporting request intake in one place, so the work being proposed can be read against the work being asked for.</p>' +
      '<div class="rp-hstats">' +
        '<div class="rp-hstat"><div class="n" data-count="' + r.total + '">' + r.total + '</div><div class="l">AI Initiatives</div></div>' +
        '<div class="rp-hstat"><div class="n" data-count="' + r.users + '">' + nfmt(r.users) + '</div><div class="l">People Reached</div></div>' +
        '<div class="rp-hstat"><div class="n" data-count="' + TICKETS.length + '">' + TICKETS.length + '</div><div class="l">Reporting Requests</div></div>' +
        '<div class="rp-hstat"><div class="n" data-count="' + d.aged + '">' + d.aged + '</div><div class="l">Open Over ' + AGED_DAYS + ' Days</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="rp-scroll">Scroll</div>' +
  '</section>';

  /* ---- band one: the initiatives ---------------------------------------- */
  var ranked = INITIATIVES.slice().sort(function(a,b){ return b.leverage - a.leverage || b.users - a.users; });

  var band1 =
  '<section class="rp-sec"><div class="rp-band">' +
    '<div class="rp-up">' + tag('AI Initiatives') +
      '<div class="rp-h2">Initiative Register</div>' +
      '<p class="rp-p">The register records what each initiative is worth, what it would take, and how many people it would reach. It records no cost, no stage and no owner, so none of those appear anywhere on this page. ' + (r.notStated.length ? r.notStated.length + ' of the ' + r.total + ' say nothing about whether they have started.' : 'Every one of them records a status.') + '</p></div>' +
    '<div class="rp-kpis rp-stag">' +
      kpi(r.total, 'Initiatives', '<b>' + r.moving.length + '</b> in progress, <b>' + r.notStated.length + '</b> not started') +
      kpi(r.readyToStart.length, 'High Value, Not Started', 'Of <b>' + r.byValue.high.n + '</b> marked high value') +
      kpi(nfmt(r.users), 'People Reached', 'Approximate, across all ' + r.total) +
      kpi(r.byEffort.low.n, 'Low Effort', '<b>' + r.byEffort.medium.n + '</b> medium, <b>' + r.byEffort.high.n + '</b> high') +
      kpi(r.evidenceRows, 'Requests as Evidence', 'Of <b>' + TICKETS.length + '</b> tracker rows') +
      kpi(r.blockedByDesk.length, 'Blocked on the Desk', r.blockedByDesk.length ?
        'Waiting on <b>' + sum(r.blockedByDesk, function(x){ return x.open; }) + '</b> open requests' : 'Nothing waiting') +
    '</div>' +
    veStage(INITIATIVES) +
    '<div class="rp-card rp-up"><h4>Priority Order</h4>' +
        '<div class="rp-sub">Ordered by value over effort, with both inputs shown so the order can be checked by eye.</div>' +
        '<div class="tablewrap"><table><thead><tr><th>Initiative</th><th>Value</th><th>Effort</th><th class="n">Users</th></tr></thead><tbody>' +
        ranked.map(function(x){
          return '<tr class="clickable" data-open="' + x.c + '">' +
            '<td><div style="font-weight:600">' + esc(x.n) + '</div>' +
              '<div class="tiny faint">' + statusPill(x.status) + '</div></td>' +
            '<td>' + ordBar(VALUE[x.value].rank, 'var(--o5)') + '</td>' +
            '<td>' + ordBar(EFFORT[x.effort].rank, 'var(--s2)') + '</td>' +
            '<td class="n num">' + nfmt(x.users) + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
    '</div>' +
  '</div></section>';

  /* ---- break ------------------------------------------------------------ */
  var placedInis = INITIATIVES.filter(function(x){ return x.f; }).length || 1;
  var worst = sig.slice().sort(function(a,b){
    return (b.demandShare - (b.initiatives / placedInis * 100)) - (a.demandShare - (a.initiatives / placedInis * 100));
  })[0];
  /* Bars are scaled to the largest share on either side, so a unit holding
     most of the demand does not run its bar off the edge of the card. */
  var divMax = Math.max(60, Math.max.apply(null, sig.map(function(s){
    return Math.max(s.demandShare, s.initiatives / placedInis * 100); })));
  var breakBand =
  '<div class="rp-break' + (BREAK_PHOTO ? ' has-photo ch' : '') + '">' +
    (BREAK_PHOTO ? '<div class="rp-break-photo" style="background-image:url(' + BREAK_PHOTO + ');background-position:' + BREAK_PHOTO_POS + '"></div>' : '') +
    '<div class="rp-break-tint"></div>' + AURORA + heroMosaic() + '<div class="inner">' +
    '<div class="rp-pill"><span>Reporting Desk</span></div>' +
    '<h2>Demand From<br>the Business</h2>' +
    '<p>' + TICKETS.length + ' reporting requests, logged by the desk since ' + (function(){
      var e = TICKETS.reduce(function(a, t){ return (!a || (t.created && t.created < a)) ? t.created : a; }, null);
      return e ? asDate(e).toLocaleDateString('en-US', { month:'long', year:'numeric' }) : 'it opened';
    })() + '. Read against the register, they show where the demand actually sits and whether anything on the AI side is pointed at it.</p>' +
  '</div></div>';

  /* ---- band two: the demand --------------------------------------------- */
  var ledgerRows = FUNC_KEYS.map(function(k, li){
    var g = r.byFunc[k];
    var reqs = TICKETS.filter(function(t){ return t.fn === k; });
    var openR = reqs.filter(function(t){ return !t.done; });
    var dots = g.items.map(function(x, j){
      return '<i class="cm pop" data-open="' + x.c + '" title="' + esc(x.c + ' ' + x.n) + '" data-tip="' +
        esc(tipRows(x.c + ' ' + x.n, [['Value', VALUE[x.value].label], ['Effort', EFFORT[x.effort].label],
          ['Status', STATUSES[x.status].label]])) +
        '" style="--i:' + (li + j) + ';width:11px;height:11px;border-radius:3px;cursor:pointer;background:var(' + VALUE[x.value].ramp + ');' +
        (x.moving ? 'box-shadow:0 0 0 1.6px var(--brand)' : '') + '"></i>';
    }).join('');
    return '<tr class="clickable" data-fn="' + k + '">' +
      '<td><div style="font-weight:600">' + esc(FUNCS[k].label) + '</div>' +
        '<div class="tiny faint">' + esc(FUNCS[k].leader + ', ' + FUNCS[k].leaderTitle) + '</div></td>' +
      '<td><div class="row wrap gap-4 ch" style="max-width:120px;--ch-step:90ms">' + (dots || '<span class="tiny faint">None</span>') + '</div></td>' +
      '<td class="n num">' + (g.users ? nfmt(g.users) : '<span class="faint">&#183;</span>') + '</td>' +
      '<td class="n"><div class="num" style="font-weight:600">' + reqs.length + '</div>' +
        '<div class="tiny faint">' + openR.length + ' open' + (openR.filter(function(t){ return t.aged; }).length ?
          ', ' + openR.filter(function(t){ return t.aged; }).length + ' aged' : '') + '</div></td>' +
      '<td><div class="row gap-6">' + sparkline(demandSeries(k), { aria:'Requests raised, thirteen months', i:li }) + '</div></td>' +
      '<td class="n num" style="color:' + (g.evidence ? 'var(--brand-ink)' : 'var(--ink-3)') + '">' + g.evidence + '</td>' +
    '</tr>';
  }).join('') + (function(){
    var reqs = TICKETS.filter(function(t){ return !t.fn; });
    var openR = reqs.filter(function(t){ return !t.done; });
    var aged = openR.filter(function(t){ return t.aged; }).length;
    var inis = INITIATIVES.filter(function(x){ return !x.f; });
    if (!reqs.length && !inis.length) return '';
    return '<tr style="background:var(--surface-2)">' +
      '<td><div style="font-weight:600">' + FN_NONE + '</div>' +
        '<div class="tiny faint">The text does not say which unit</div></td>' +
      '<td><div class="row wrap gap-4 ch" style="max-width:120px;--ch-step:90ms">' + (inis.map(function(x, j){
        return '<i class="cm pop" data-open="' + x.c + '" title="' + esc(x.c + ' ' + x.n) + '" style="--i:' + (FUNC_KEYS.length + j) + ';width:11px;height:11px;border-radius:3px;cursor:pointer;background:var(' + VALUE[x.value].ramp + ')"></i>';
      }).join('') || '<span class="tiny faint">None</span>') + '</div></td>' +
      '<td class="n num">' + (inis.length ? nfmt(sum(inis, function(x){ return x.users; })) : '<span class="faint">&#183;</span>') + '</td>' +
      '<td class="n"><div class="num" style="font-weight:600">' + reqs.length + '</div>' +
        '<div class="tiny faint">' + openR.length + ' open' + (aged ? ', ' + aged + ' aged' : '') + '</div></td>' +
      '<td></td>' +
      '<td class="n num" style="color:var(--ink-3)">' + sum(inis, function(x){ return x.tickets.length; }) + '</td>' +
    '</tr>';
  })();

  var divRows = sig.map(function(s, i){
    var fp = s.demandShare, cover = s.initiatives / placedInis * 100, gap = fp - cover;
    return '<div class="row gap-10" style="padding:5px 0">' +
      '<span class="tiny trunc" style="width:128px;color:var(--ink-2)">' + esc(s.label) + '</span>' +
      '<div style="flex:1;position:relative;height:16px">' +
        '<div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2)"></div>' +
        '<div class="cm gxr" style="--i:' + i + ';position:absolute;right:50%;top:3px;height:10px;width:' + (fp/divMax*50) + '%;background:var(--s2);border-radius:2px 0 0 2px" data-tip="' +
          esc(tipRows(s.label, [['Share of requests', Math.round(fp) + '%'], ['Requests raised', s.demand], ['Still open', s.open]])) + '"></div>' +
        '<div class="cm gx" style="--i:' + i + ';position:absolute;left:50%;top:3px;height:10px;width:' + (cover/divMax*50) + '%;background:var(--s1);border-radius:0 2px 2px 0" data-tip="' +
          esc(tipRows(s.label, [['Share of initiatives', Math.round(cover) + '%'], ['Initiatives', s.initiatives]])) + '"></div>' +
      '</div>' +
      '<span class="tiny num" style="width:92px;text-align:right;font-weight:700;color:' +
        (gap > 15 ? 'var(--watch)' : gap < -15 ? 'var(--info)' : 'var(--ink-3)') + '">' +
        (gap > 15 ? 'Under Covered' : gap < -15 ? 'Over Weighted' : 'In Balance') + '</span></div>';
  }).join('');

  var band2 =
  '<section class="rp-sec grey"><div class="rp-band">' +
    '<div class="rp-up">' + tag('Counted Demand') +
      '<div class="rp-h2">Demand by Business Area</div>' +
      '<p class="rp-p">Every figure in this band is a count of rows in the reporting tracker, not an estimate. Only <b>' + r.evidenceRows + ' of ' + TICKETS.length +
      '</b> of those requests name work that an initiative also names, which leaves ' + (TICKETS.length - r.evidenceRows) +
      ' asking for something with nothing on the register behind it.</p></div>' +
    '<div class="rp-kpis rp-stag">' +
      kpi(TICKETS.length, 'Requests Logged', 'Between ' + fmtDate(TICKETS.reduce(function(a,t){ return (!a || (t.created && t.created < a)) ? t.created : a; }, null)) +
        ' and ' + fmtDate(TICKETS.reduce(function(a,t){ return (!a || (t.created && t.created > a)) ? t.created : a; }, null))) +
      kpi(d.open, 'Still Open', '<b>' + d.aged + '</b> of them open over ' + AGED_DAYS + ' days') +
      kpi(d.medianCycle == null ? 'n/a' : d.medianCycle, 'Median Days to Complete', 'Across the <b>' + d.measuredCycle + '</b> rows carrying both dates') +
    '</div>' +
    '<div class="rp-card rp-up"><h4>Business Area Ledger</h4>' +
      '<div class="rp-sub">One row per unit of Customer Service Operations, from the org chart, so the register and the counted demand can be compared side by side. Which unit a request belongs to is read from its text. A unit with no requests means none could be placed there from the text, not that it raised none.</div>' +
      '<div class="tablewrap"><table><thead><tr><th>Business Area</th><th>Initiatives by Value</th>' +
      '<th class="n">People Reached</th><th class="n">Requests</th><th>Over 13 Months</th><th class="n">Named as Evidence</th></tr></thead>' +
      '<tbody>' + ledgerRows + '</tbody></table></div></div>' +
    '<div class="rp-g2 rp-up">' +
      '<div class="rp-card"><h4>Demand Against Coverage</h4>' +
        '<div class="rp-sub">Share of tracker requests on the left, share of the register on the right.</div>' + '<div class="ch" style="--ch-step:90ms">' + divRows + '</div>' +
        '<p class="rp-note" style="margin-top:.9rem">' + esc(worst.label) + ' raised <b>' + Math.round(worst.demandShare) +
        ' percent</b> of the requests placed in a unit and holds <b>' + worst.initiatives + ' of ' + r.total + '</b> initiatives. Coverage is counted in initiatives, never in money.</p></div>' +
      '<div class="rp-card"><h4>Desk Workload</h4>' +
        '<div class="rp-sub">Requests per analyst, counted from the tracker.</div>' +
        hBars(Object.keys(d.byAnalyst).map(function(id){
          var pp = person(id), mine = TICKETS.filter(function(t){ return t.assignee === id; });
          return { k: pp ? pp.name : id, v: mine.length, color:'var(--navy)',
                   extra:[['Still open', mine.filter(function(t){ return !t.done; }).length],
                          ['Open over ' + AGED_DAYS + ' days', mine.filter(function(t){ return t.aged; }).length]] };
        }).sort(desc('v')), { labelW:40, valueW:13, unit:'Requests', aria:'Requests per analyst' }) + '</div>' +
    '</div>' +
  '</div></section>';

  /* ---- band three: decisions -------------------------------------------- */
  var decisionRows = ex.map(function(e){
    return '<tr class="clickable" data-open="' + e.x.c + '">' +
      '<td style="width:42%"><div style="font-weight:500;line-height:1.45">' + esc(e.decision) + '</div>' +
        '<div class="tiny faint" style="margin-top:2px"><span class="mono">' + e.x.c + '</span> ' + esc(e.x.n) + '</div></td>' +
      '<td><span class="tag" data-tip="' + esc(tipRows(RULE[e.code].label, [['Rule', RULE[e.code].threshold]])) + '">' + esc(RULE[e.code].label) + '</span></td>' +
      '<td>' + valueTag(e.x.value) + '</td><td>' + effortTag(e.x.effort) + '</td>' +
      '<td class="n num">' + nfmt(e.x.users) + '</td><td class="n num">' + e.x.tickets.length + '</td></tr>';
  }).join('');

  var band3 =
  '<section class="rp-sec" id="decide"><div class="rp-band">' +
    '<div class="rp-up">' + tag('Exceptions') +
      '<div class="rp-h2">Open Decisions</div>' +
      '<p class="rp-p">Each row names the rule that raised it and the evidence behind it. Nothing here is ranked by money, because there is none in either source to rank by.</p></div>' +
    '<div class="rp-card rp-up">' + (decisionRows ?
      '<div class="tablewrap"><table><thead><tr><th>Decision</th><th>Reason</th><th>Value</th><th>Effort</th>' +
      '<th class="n">Users</th><th class="n">Evidence</th></tr></thead><tbody>' + decisionRows + '</tbody></table></div>'
      : '<div class="empty">Nothing is waiting on a decision.</div>') +
      '<p class="rp-note" style="margin-top:.9rem">Rules: ' + RULES.map(function(x){ return esc(x.label); }).join(', ') +
      '. Hover a rule for its threshold.</p></div>' +
  '</div></section>';

  /* ---- closing note ------------------------------------------------------ */
  var foot =
  '<div class="rp-foot">' +
    '<div><b>Orange and Rockland Unified AI and Intake Portal</b>' +
      '<div style="margin-top:.35rem;font-size:.76rem">Figures as of ' + fmtDate(new Date(NOW).toISOString().slice(0,10)) + '.</div></div>' +
    '<div class="r">The reporting requests are the real tracker. The initiatives are the ' + INITIATIVES.length + ' supplied by the team. ' +
      'Neither records cost, stage, owner, risk or date, so this report shows no spend, no return, no funnel and no roadmap. ' +
      'Business areas are the five units on the Customer Service Operations org chart; which one a request belongs to is read from its text. ' +
      '<button class="fadd" data-go="admin" style="background:none;border:0;padding:0;color:var(--brand-accent)">How These Numbers Are Built</button></div>' +
  '</div>';

  return '<div class="rp">' + hero + band1 + breakBand + band2 + band3 + foot + '</div>';
}

/* ===========================================================================
   16. VIEW: PORTFOLIO
   ---------------------------------------------------------------------------
   One register, three ways of looking at it: cards, table, and the value
   against effort matrix.

   There is no roadmap view. The source carries no dates of any kind, so a
   timeline would be entirely invented. There is no risk and governance view
   for the same reason: no risk tier, data sensitivity, oversight model or
   review status is recorded anywhere.
   =========================================================================== */
var S = {
  view: 'exec',
  as: 'admin',
  pf: { q:'', fn:'all', value:'all', effort:'all', status:'all', mode:'cards', sort:'leverage' },
  bd: { q:'', sys:'all', fn:'all', assignee:'all', group:'none', allDone:false,
        qf:{ mine:false, aged:false, blocked:false, unassigned:false, linked:false } },
  qv: { q:'', col:'all', sys:'all', fn:'all', sort:'created', dir:-1, page:1 },
  open: null, openKind: null, act: 'comments'
};
var PAGE = 15;

function pfFiltered(){
  var f = S.pf, q = f.q.toLowerCase().trim();
  var out = INITIATIVES.filter(function(x){
    if (f.fn !== 'all' && (x.f || 'none') !== f.fn) return false;
    if (f.value !== 'all' && x.value !== f.value) return false;
    if (f.effort !== 'all' && x.effort !== f.effort) return false;
    if (f.status !== 'all' && x.status !== f.status) return false;
    if (q && (x.c + ' ' + x.n + ' ' + x.notes.join(' ') + ' ' + fnLabel(x.f)).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  var s = f.sort;
  out.sort(s === 'leverage' ? function(a,b){ return b.leverage - a.leverage || b.users - a.users; } :
           s === 'value'    ? function(a,b){ return VALUE[b.value].rank - VALUE[a.value].rank || b.users - a.users; } :
           s === 'effort'   ? function(a,b){ return EFFORT[a.effort].rank - EFFORT[b.effort].rank; } :
           s === 'users'    ? desc('users') :
           s === 'evidence' ? function(a,b){ return b.tickets.length - a.tickets.length; } : by('c'));
  return out;
}

/* ===========================================================================
   18. VIEW: REPORTING DESK BOARD
   ---------------------------------------------------------------------------
   One board, not three. Grouping is a control rather than a separate mode,
   because three boards means three places a card can be missed.

   The Done column holds forty nine of the seventy eight rows, so it shows the
   most recently completed and keeps the rest behind a control. Otherwise the
   column that matters least takes the most room.

   Cards carry no priority flag: the tracker has no priority column. Age is
   the urgency signal instead, and it is real.
   =========================================================================== */
var DONE_SHOWN = 6;

function bdFiltered(){
  var b = S.bd, q = b.q.toLowerCase().trim();
  return TICKETS.filter(function(t){
    if (b.sys !== 'all' && t.sys !== b.sys) return false;
    if (b.fn !== 'all' && (t.fn || 'none') !== b.fn) return false;
    if (b.assignee !== 'all' && (t.assignee || 'none') !== b.assignee) return false;
    if (b.qf.mine && t.assignee !== ME && t.reporter !== ME) return false;
    if (b.qf.blocked && !t.blocked) return false;
    if (b.qf.aged && !t.aged) return false;
    if (b.qf.unassigned && t.assignee) return false;
    if (b.qf.linked && !t.ini) return false;
    if (q && (t.key + ' ' + t.title + ' ' + t.sys + ' ' + (t.statusText||'') + ' ' +
              (t.statusCode||'') + ' ' + (t.additional||'')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function kcard(t){
  var p = person(t.assignee);
  var ini = t.ini ? initiative(t.ini) : null;
  return '<article class="kcard" draggable="true" data-key="' + t.key + '" data-open-t="' + t.key + '">' +
    '<div class="kt">' + esc(capFirst(t.title)) + '</div>' +

      (ini ? '<span class="tag" style="border-color:var(--brand-line);color:var(--brand-ink)" data-tip="' +
        esc(tipRows(ini.c + ' ' + ini.n, [['Value', VALUE[ini.value].label], ['Effort', EFFORT[ini.effort].label],
          ['Status', STATUSES[ini.status].label],
          ['Why linked', 'This request covers the same subject']])) + '">' + ini.c + '</span>' : '') +
    '</div>' +
    (t.blocked ? '<div class="note" style="padding:5px 8px;font-size:11px;border-left-color:var(--watch);background:var(--watch-tint);margin-bottom:7px">' +
      '<b>On hold.</b> ' + esc(t.blocked) + '</div>' : '') +
    (t.contra ? '<div class="note" style="padding:5px 8px;font-size:11px;border-left-color:var(--risk);background:var(--risk-tint);margin-bottom:7px">' +
      '<b>Source conflict.</b> ' + esc(t.contra) + '</div>' : '') +
    (t.dup ? '<div class="note" style="padding:5px 8px;font-size:11px;margin-bottom:7px">' +
      '<b>Duplicate batch.</b> ' + esc(t.dup.label) + '</div>' : '') +
    '<div class="kfoot">' +
      sysGlyph(t.sys) +
      '<span class="kkey' + (t.done ? ' done' : '') + '">' + t.key + '</span>' +
