<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O&amp;R unified AI and intake portal</title>
<style>
/* ===========================================================================
   Orange & Rockland AI hub
   One workspace for the AI initiative portfolio and the service desk that
   feeds it.

   COLOR SYSTEM
   ------------
   O&R identity orange (#f07f2d) only reaches 2.7:1 on white, so it is
   reserved for the brand mark, the hero gradient and dark-mode ink. The
   darker burnt orange (#b74118, 5.6:1) carries every action, every active
   nav item and every focus ring. Navy (#26428c) is the cool counterweight
   and takes data ink so the orange chrome never competes with the priority
   thermometer.

   Chart series use the validated eight-slot categorical order from the
   house data-viz palette, assigned in fixed order and never cycled. Stage
   is an ORDERED dimension so it uses a single-hue ordinal ramp, not the
   categorical slots. Status colors (good / watch / at risk) are reserved
   and never reused as a series.

   The two badge axes are separated on three channels at once so they stay
   legible in greyscale and in dark mode:
     STATUS   = filled pill,  rounded, cool hues, leading dot
     PRIORITY = hollow chip,  square,  warm hues, leading glyph

   THEME
   -----
   Light is the default. Dark applies only on an explicit choice, either the
   in-page toggle or the host stamping data-theme="dark" on <html>.

   NO em dashes or en dashes anywhere in this file, in code or in copy.
   =========================================================================== */

:root {
  color-scheme: light;

  /* Neutrals, biased warm-cool toward the navy accent rather than pure grey */
  --ground:    #f4f6fa;
  --surface:   #ffffff;
  --surface-2: #eef1f7;
  --surface-3: #e6ebf4;
  --line:      #e0e5ef;
  --line-2:    #c9d2e2;
  --ink:       #16202f;
  --ink-2:     #47546b;
  --ink-3:     #626f86;   /* 4.69:1 on --ground, 5.08:1 on --surface. The
                             previous #6f7c93 read nicer but sat at 3.90:1,
                             under the 4.5:1 floor for the hint and label text
                             this token carries. */

  /* Brand: chrome, identity and actions only, never a data value */
  --brand:        #b74118;
  --brand-hover:  #8f3212;
  --brand-ink:    #b74118;
  --brand-accent: #f07f2d;
  --brand-tint:   #fff3e7;
  --brand-tint-2: #ffe4cf;
  --brand-line:   #f4c9a4;
  --hero-1:       #6d2803;
  --hero-2:       #a8460b;
  --hero-3:       #ef7f18;
  --hero-4:       #f5901d;

  /* Cool counterweight, carries data ink */
  --navy:      #26428c;
  --navy-deep: #182e67;
  --navy-ink:  #26428c;
  --navy-tint: #e8eefb;
  --navy-line: #bdcdf0;

  /* Reserved status palette. Never used as a categorical series. */
  --ok:     #047857; --ok-tint:     #ecfdf5; --ok-line:     #b8e7df;
  --watch:  #b45309; --watch-tint:  #fffbeb; --watch-line:  #fde68a;
  --risk:   #b91c1c; --risk-tint:   #fef2f2; --risk-line:   #fecdd3;
  --info:   #26428c; --info-tint:   #e8eefb; --info-line:   #bdcdf0;
  --muted-tint: #f1f5f9; --muted-ink: #475569; --muted-line: #d7dfea;

  /* Priority thermometer, hollow square chips */
  --p-highest: #b91c1c;
  --p-high:    #c2410c;
  --p-medium:  #a16207;
  --p-low:     #15803d;
  --p-lowest:  #0f766e;

  /* Categorical series, validated adjacent order, assigned by entity */
  --s1: #2a78d6;  /* blue    */
  --s2: #eb6834;  /* orange  */
  --s3: #1baf7a;  /* aqua    */
  --s4: #eda100;  /* yellow  */
  --s5: #e87ba4;  /* magenta */
  --s6: #008300;  /* green   */
  --s7: #4a3aa7;  /* violet  */
  --s8: #e34948;  /* red     */

  /* Ordinal ramp for stage and for sequential heat. One hue, light to dark. */
  --o1: #e3edfb;
  --o2: #bfd6f5;
  --o3: #8fb4e9;
  --o4: #5b8cd8;
  --o5: #3465bd;
  --o6: #21458c;

  --track:  #e2e8f0;
  --grid:   #edf1f7;

  --shadow-1: none;
  --shadow-2: none;
  --shadow-3: 0 6px 24px -8px rgba(22,32,47,.22);

  --radius: 10px;
  --radius-sm: 7px;
  --rail: 246px;

  /* TYPE
     Microsoft system fonts, so nothing is fetched at runtime and the portal
     matches the chrome of the model-driven app it is hosted in. Segoe UI
     Variable is the Fluent 2 family and ships with Windows 11; the Text and
     Display optical sizes are real faces, not synthetic weights, so large
     headings get tighter spacing without us faking it. Everything falls back
     through plain Segoe UI and then the platform default, which keeps it
     legible on a Mac or a Linux box without loading a web font. */
  --font:         "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-small:   "Segoe UI Variable Small", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-mono:    Consolas, "Cascadia Mono", "Cascadia Code", ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0f172a; --surface: #1b2637; --surface-2: #243448; --surface-3: #2c3e56;
  --line: #33415a; --line-2: #435372;
  --ink: #e9eff8; --ink-2: #b6c3d6; --ink-3: #8b9ab2;

  --brand-ink: #f07f2d; --brand-tint: #3f2110; --brand-tint-2: #55301a; --brand-line: #7a4520;
  --navy-ink: #93b4f5; --navy-tint: #22325c; --navy-line: #3c5185;

  --ok: #34d399;   --ok-tint: #0c3b30;   --ok-line: rgba(52,211,153,.4);
  --watch: #fbbf24; --watch-tint: #3d2c07; --watch-line: rgba(251,191,36,.4);
  --risk: #f87171; --risk-tint: #3f1414; --risk-line: rgba(248,113,113,.4);
  --info: #93b4f5; --info-tint: #22325c; --info-line: rgba(147,180,245,.4);
  --muted-tint: rgba(255,255,255,.06); --muted-ink: #cbd5e1; --muted-line: rgba(255,255,255,.14);

  --p-highest: #f87171; --p-high: #fb923c; --p-medium: #facc15;
  --p-low: #4ade80; --p-lowest: #5eead4;

  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;

  --o1: #1e3252; --o2: #26456e; --o3: #2f5a91; --o4: #3f76b8; --o5: #6098d8; --o6: #93b8ec;

  --track: #33415a;
  --grid:  #2a3750;

  --shadow-1: none;
  --shadow-2: none;
  --shadow-3: 0 6px 24px -8px rgba(0,0,0,.5);
}

/* ---- base --------------------------------------------------------------- */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--font);
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { margin: 0; font-family: var(--font-display); font-weight: 600; letter-spacing: -.012em; text-wrap: balance; }
h1 { font-size: 23px; }
h2 { font-size: 15px; }
h3 { font-size: 13.5px; }
p { margin: 0; }
a { color: var(--brand-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 2px; border-radius: 4px; }
svg { display: block; }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num  { font-variant-numeric: tabular-nums; }
.lbl  { font-family: var(--font-small); font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--ink-3); }
.muted{ color: var(--ink-2); }
.faint{ color: var(--ink-3); }
.small{ font-size: 12.5px; }
.tiny { font-family: var(--font-small); font-size: 11.5px; }
.center { text-align: center; }
.right  { text-align: right; }
.nowrap { white-space: nowrap; }
.trunc  { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hide   { display: none !important; }

.row { display: flex; align-items: center; }
.row.top { align-items: flex-start; }
.row.base { align-items: baseline; }
.col { display: flex; flex-direction: column; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}
.gap-14{gap:14px}.gap-16{gap:16px}.gap-20{gap:20px}.gap-24{gap:24px}

.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2,minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3,minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4,minmax(0,1fr)); }
.g5 { grid-template-columns: repeat(5,minmax(0,1fr)); }
.g23 { grid-template-columns: minmax(0,2fr) minmax(0,3fr); }
.g32 { grid-template-columns: minmax(0,3fr) minmax(0,2fr); }
.g21 { grid-template-columns: minmax(0,2fr) minmax(0,1fr); }
@media (max-width:1180px){ .g5,.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g23,.g32,.g21{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){ .g5,.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)} }

/* ---- shell -------------------------------------------------------------- */
.app { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 100vh; }

.rail {
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 2px; padding: 16px 12px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 9px; flex: none;
  background: var(--brand);
  display: grid; place-items: center;
}
.brand-mark svg { width: 23px; height: 23px; }
.brand-name { font-size: 13.5px; font-weight: 700; line-height: 1.15; }
.brand-sub  { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; color: var(--brand-ink); margin-top: 1px; }

.rail-group { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--ink-3); padding: 14px 10px 5px; }
.navbtn {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 8px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--ink-2);
}
.navbtn:hover { background: var(--surface-2); color: var(--ink); }
.navbtn[aria-current="page"] { background: var(--brand); color: #fff; font-weight: 600; }
.navbtn[aria-current="page"] svg { color: #fff; }
.navbtn svg { width: 17px; height: 17px; flex: none; color: var(--ink-3); }
.navbtn .ct {
  margin-left: auto; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.navbtn[aria-current="page"] .ct { background: rgba(255,255,255,.2); color: #fff; }
.rail-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; }

.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 11px 24px; background: color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
main { padding: 22px 24px 64px; max-width: 1420px; }
.view { display: none; animation: fade .26s ease; }
.view.on { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

/* ---- controls ----------------------------------------------------------- */
.field {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line-2);
  border-radius: 8px; padding: 7px 11px; font-size: 13px; width: 100%;
}
.field:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
select.field { cursor: pointer; padding-right: 26px; }
textarea.field { min-height: 84px; resize: vertical; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
  border: 1px solid transparent; transition: background .14s, border-color .14s, color .14s;
}
.btn svg { width: 15px; height: 15px; }
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-hover); }
.btn-ghost { background: var(--surface); color: var(--ink-2); border-color: var(--line-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-quiet { color: var(--ink-2); padding: 6px 9px; }
.btn-quiet:hover { background: var(--surface-2); color: var(--ink); }
.btn-sm { padding: 5px 10px; font-size: 12.5px; }
.btn-sm svg { width: 13px; height: 13px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 2px; gap: 2px; }

/* View mode tabs, used by the portfolio. Same shape as the activity tabs in
   the detail drawer so a tab looks like a tab everywhere in the portal. */
.vtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.vtabs button { padding: 9px 15px; font-size: 13.5px; font-weight: 600; color: var(--ink-3);
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.vtabs button:hover { color: var(--ink); }
.vtabs button[aria-pressed="true"] { color: var(--brand-ink); border-bottom-color: var(--brand); }
.seg button { padding: 5px 11px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }

.searchwrap { position: relative; display: flex; align-items: center; }
.searchwrap svg { position: absolute; left: 10px; width: 15px; height: 15px; color: var(--ink-3); pointer-events: none; }
.searchwrap .field { padding-left: 31px; }

/* ---- surfaces ----------------------------------------------------------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-1); }
.pad { padding: 16px 18px; }
.pad-sm { padding: 12px 14px; }
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 18px; border-bottom: 1px solid var(--line);
}
.panel-head h2 { font-size: 14px; }
.panel-head .hint { font-size: 12px; color: var(--ink-3); }
.sec { margin-bottom: 20px; }
.sec-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 11px; }
.sec-hd h2 { font-size: 15px; }
.sec-hd .hint { font-size: 12px; color: var(--ink-3); }

.empty { padding: 44px 20px; text-align: center; color: var(--ink-3); font-size: 13px; }

/* ---- hero --------------------------------------------------------------- */
.hero {
  margin: -22px -24px 20px; padding: 0; position: relative; overflow: hidden;
  border-radius: 0 0 18px 18px; color: #fff;
  background: linear-gradient(118deg, var(--hero-1) 0%, var(--hero-2) 42%, var(--hero-3) 84%, var(--hero-4) 108%);
}
.hero::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(100deg, rgba(24,9,0,.52) 0%, rgba(24,9,0,.34) 36%, rgba(24,9,0,.06) 70%, rgba(24,9,0,0) 90%);
}

/* The facade.
   Orange and Rockland's own building, drawn the way an architect draws an
   elevation: fine linework, not filled blocks. Filled polygons with a hard
   shine band is a dated look, and it was the first thing tried here.

   What carries it instead:
     1. hairline piers and floor lines, so it reads as drawing rather than
        as clip art
     2. an atmospheric fade upward, because distance washes detail out, which
        is what gives it depth without a single shadow
     3. one large soft light that drifts slowly, rather than a band sweeping
        across on a loop
     4. film grain over everything, which is what stops vector work from
        looking like vector work

   It sits as the first child of .hero, so paint order puts it under the
   ::after pass and under the text. */
.hero-mosaic { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero-mosaic g { will-change: transform; }

/* The drawing rises into place once, slowly, on a decelerating curve. */
.hm-arch { animation: hmRise 1.2s cubic-bezier(.16,1,.3,1) both; }
@keyframes hmRise { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }

/* A single soft light drifting back and forth. Long period and an alternate
   direction, so it never reads as a loop restarting. */
.hero-glow { animation: hmGlow 21s ease-in-out infinite alternate; will-change: transform; }
@keyframes hmGlow { from { transform: translate(-220px, 18px) } to { transform: translate(460px, -14px) } }

@media (prefers-reduced-motion: reduce) {
  .hm-arch { animation: none; }
  .hero-glow { animation: none; }
  .hero-mosaic g { transform: none !important; }
}

.hero-in { position: relative; z-index: 1; padding: 30px 30px 32px; max-width: 1380px; }
.hero-ey { font-size: 11.5px; font-weight: 600; letter-spacing: .1em; color: rgba(255,255,255,.86); margin-bottom: 10px; }
.hero h1 { font-size: 34px; letter-spacing: -1.1px; line-height: 1.08; color: #fff; }
.hero h1 span { color: rgba(255,255,255,.78); font-weight: 500; }
.hero p { font-size: 14px; color: rgba(255,255,255,.9); margin-top: 11px; max-width: 640px; line-height: 1.55; }
@media (max-width:760px){ .hero h1{font-size:25px} .hero-in{padding:24px 20px} }

/* ---- badges: status pills and priority chips ---------------------------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px;
  border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
  border: 1px solid transparent;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.pill.ok    { background: var(--ok-tint);    color: var(--ok);    border-color: var(--ok-line); }
.pill.watch { background: var(--watch-tint); color: var(--watch); border-color: var(--watch-line); }
.pill.risk  { background: var(--risk-tint);  color: var(--risk);  border-color: var(--risk-line); }
.pill.info  { background: var(--info-tint);  color: var(--info);  border-color: var(--info-line); }
.pill.mute  { background: var(--muted-tint); color: var(--muted-ink); border-color: var(--muted-line); }
.pill.brand { background: var(--brand-tint); color: var(--brand-ink); border-color: var(--brand-line); }
.pill.solid { background: var(--ok); color: #fff; border-color: var(--ok); }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px;
  border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: .01em;
  border: 1px solid currentColor; background: transparent; white-space: nowrap;
}
.chip .gl { font-size: 10px; line-height: 1; }
.chip.highest { color: var(--p-highest); }
.chip.high    { color: var(--p-high); }
.chip.medium  { color: var(--p-medium); }
.chip.low     { color: var(--p-low); }
.chip.lowest  { color: var(--p-lowest); }

.tag {
  display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--line); white-space: nowrap;
}
.epic {
  display: inline-flex; align-items: center; gap: 5px; max-width: 100%;
  padding: 1px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
  color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---- avatars ------------------------------------------------------------ */
.av {
  width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-size: 10.5px; font-weight: 700; color: #fff; letter-spacing: -.02em;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.28);
}
.av.xs { width: 20px; height: 20px; font-size: 9px; }
.av.sm { width: 24px; height: 24px; font-size: 10px; }
.av.lg { width: 34px; height: 34px; font-size: 12.5px; }
.avstack { display: flex; }
.avstack .av { margin-left: -7px; box-shadow: 0 0 0 2px var(--surface); }
.avstack .av:first-child { margin-left: 0; }
.avstack .more {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); color: var(--ink-2); font-size: 10.5px; font-weight: 700;
  margin-left: -7px; box-shadow: 0 0 0 2px var(--surface);
}
.who { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unassigned { color: var(--ink-3); font-style: italic; font-size: 12.5px; }

/* ---- tables ------------------------------------------------------------- */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--ink-3);
  padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--surface);
  position: sticky; top: 0; white-space: nowrap;
}
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { color: var(--ink); }
tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--surface-2); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

/* ---- stat tiles --------------------------------------------------------- */
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow-1); position: relative; overflow: hidden; }
.tile .k { font-size: 11.5px; font-weight: 600; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.tile .v { font-family: var(--font-display); font-size: 27px; font-weight: 700; letter-spacing: -.8px; margin-top: 5px; font-variant-numeric: tabular-nums; line-height: 1.05; }
.tile .v .u { font-size: 15px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; }
.tile .sub { font-size: 12px; color: var(--ink-2); margin-top: 5px; }
.tile .foot { margin-top: 10px; }
.tile.accent { border-left: 3px solid var(--brand); }
.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 700; }
.delta.up { color: var(--ok); } .delta.down { color: var(--risk); } .delta.flat { color: var(--ink-3); }

.bar-track { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; display: flex; }
.bar-track > i { display: block; height: 100%; }
.bar-track > i + i { margin-left: 2px; }
.mini-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; }
.mini-legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-2); }
.mini-legend i { width: 9px; height: 9px; border-radius: 2px; flex: none; }

/* ---- charts ------------------------------------------------------------- */
.chartbox { position: relative; }
.chartbox svg { width: 100%; height: auto; overflow: visible; }
.axis-line { stroke: var(--line-2); stroke-width: 1; }
.gridline  { stroke: var(--grid); stroke-width: 1; }
.axis-txt  { font-size: 10.5px; fill: var(--ink-3); font-family: inherit; }
.val-txt   { font-size: 11px; fill: var(--ink-2); font-family: inherit; font-weight: 600; font-variant-numeric: tabular-nums; }
.lead-txt  { font-size: 12px; fill: var(--ink); font-family: inherit; font-weight: 600; }
.mark { transition: opacity .12s; cursor: default; }
.chartbox:hover .mark { opacity: .55; }
.chartbox .mark:hover { opacity: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend i.ln { height: 3px; border-radius: 2px; width: 14px; }

.tip {
  position: fixed; z-index: 200; pointer-events: none; opacity: 0; transition: opacity .1s;
  background: var(--ink); color: #fff; border-radius: 7px; padding: 8px 10px;
  font-size: 11.5px; line-height: 1.45; max-width: 260px;
}
.tip.on { opacity: 1; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r em { font-style: normal; opacity: .75; }

/* heatmap */
.heatwrap { overflow-x: auto; }
.heat { display: grid; gap: 3px; min-width: 420px; }
.heat .hc { aspect-ratio: 1.9; border-radius: 5px; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; cursor: default; }
.heat .hh { font-size: 10.5px; font-weight: 600; color: var(--ink-3); display: flex; align-items: flex-end; padding-bottom: 4px; line-height: 1.2; }
.heat .hr { font-size: 11.5px; font-weight: 500; color: var(--ink-2); display: flex; align-items: center; justify-content: flex-end; padding-right: 9px; text-align: right; line-height: 1.2; }

/* waffle */
.waffle { display: flex; flex-wrap: wrap; gap: 3px; }
.waffle i { width: 13px; height: 13px; border-radius: 3px; cursor: pointer; transition: transform .1s; }
.waffle i:hover { transform: scale(1.25); }

/* funnel */
.funnel { display: flex; align-items: stretch; gap: 3px; }
.fstep { flex: 1; min-width: 0; position: relative; }
.fstep .fbar { border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; padding-bottom: 7px; }
.fstep .fname { font-size: 11.5px; font-weight: 600; color: var(--ink-2); margin-top: 7px; text-align: center; line-height: 1.25; }
.fstep .fmeta { font-size: 10.5px; color: var(--ink-3); text-align: center; margin-top: 2px; }
.fconv { position: absolute; top: 50%; right: -3px; transform: translate(50%,-50%); z-index: 2;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 999px;
  font-size: 10px; font-weight: 700; padding: 1px 6px; color: var(--ink-2); }

/* roadmap swimlanes */
.lanes { display: grid; grid-template-columns: 172px 1fr; gap: 0; }
.lanes .lhd { font-size: 11px; font-weight: 600; color: var(--ink-3); padding: 0 10px 7px 0; }
.lanes .lname { font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 9px 10px 9px 0; border-top: 1px solid var(--line); display: flex; align-items: center; }
.lanes .ltrack { position: relative; border-top: 1px solid var(--line); border-left: 1px solid var(--line); min-height: 40px; }
.lanes .lgrid { position: absolute; inset: 0; display: grid; }
.lanes .lgrid i { border-right: 1px solid var(--grid); }
.lanes .qhd { display: grid; }
.lanes .qhd span { font-size: 11px; font-weight: 600; color: var(--ink-3); text-align: center; padding-bottom: 7px; border-left: 1px solid transparent; }
.lbar { position: absolute; height: 21px; border-radius: 5px; display: flex; align-items: center; padding: 0 8px;
  font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; cursor: pointer;
  }
.lbar:hover { filter: brightness(1.07); }
.lgate { position: absolute; width: 9px; height: 9px; background: var(--surface); border: 2px solid var(--ink); transform: rotate(45deg); border-radius: 1px; }
.ltoday { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--brand); opacity: .7; }

/* ---- kanban board ------------------------------------------------------- */
.boardwrap { overflow-x: auto; padding-bottom: 10px; }
.board { display: flex; gap: 10px; align-items: flex-start; min-height: 420px; }
.bcol { width: 264px; flex: none; background: var(--surface-2); border-radius: var(--radius); display: flex; flex-direction: column; max-height: calc(100vh - 210px); }
.bcol.over { background: var(--brand-tint); outline: 2px dashed var(--brand-line); outline-offset: -2px; }
.bcol-hd { display: flex; align-items: center; gap: 8px; padding: 11px 12px 8px; position: sticky; top: 0; }
.bcol-hd .nm { font-size: 11.5px; font-weight: 700; letter-spacing: .03em; color: var(--ink-2); }
.bcol-hd .ct { font-size: 11px; font-weight: 700; color: var(--ink-3); background: var(--surface-3); border-radius: 999px; padding: 0 7px; font-variant-numeric: tabular-nums; }
.bcol-hd .wip { font-size: 10.5px; font-weight: 700; color: var(--risk); background: var(--risk-tint); border-radius: 999px; padding: 0 7px; }
.bcol-body { padding: 0 8px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.bcol-body .colempty { font-size: 11.5px; color: var(--ink-3); text-align: center; padding: 18px 8px; border: 1px dashed var(--line-2); border-radius: 8px; }

.kcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 11px 8px; box-shadow: var(--shadow-1); cursor: pointer;
  transition: border-color .14s, background .14s;
}
.kcard:hover { border-color: var(--brand-line); background: var(--brand-tint); }
.kcard.dragging { opacity: .45; }
.kcard .kt { font-size: 13px; font-weight: 500; line-height: 1.38; color: var(--ink); margin-bottom: 8px; }
.kcard .kepics { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.kcard .kfoot { display: flex; align-items: center; gap: 7px; }
.kcard .kkey { font-size: 11.5px; font-weight: 600; color: var(--ink-3); font-family: var(--font-mono); letter-spacing: -.02em; }
.kcard .kkey.done { text-decoration: line-through; }
.kcard .kspacer { flex: 1; }
.kcard .kflags { display: flex; align-items: center; gap: 5px; }
.ktype { width: 15px; height: 15px; border-radius: 3px; display: grid; place-items: center; flex: none; }
.ktype svg { width: 10px; height: 10px; color: #fff; }
.kprio { width: 14px; height: 14px; flex: none; }
.kblock { width: 14px; height: 14px; color: var(--risk); flex: none; }
.kage { font-size: 10.5px; font-weight: 700; padding: 0 5px; border-radius: 3px; }
.kage.ok { color: var(--ink-3); background: var(--surface-2); }
.kage.watch { color: var(--watch); background: var(--watch-tint); }
.kage.risk { color: var(--risk); background: var(--risk-tint); }

.boardbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.boardbar .searchwrap { width: 230px; }
.boardbar select.field { width: auto; min-width: 116px; }
.qf { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); }
.qf:hover { border-color: var(--brand-line); color: var(--ink); }
.qf[aria-pressed="true"] { background: var(--brand-tint); border-color: var(--brand-line); color: var(--brand-ink); }
.qf .n { font-variant-numeric: tabular-nums; opacity: .8; }

/* ---- issue detail (drawer) ---------------------------------------------- */
.scrim { position: fixed; inset: 0; background: rgba(15,23,42,.42); backdrop-filter: blur(2px); z-index: 90; opacity: 0; pointer-events: none; transition: opacity .18s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 26px;
  pointer-events: none; opacity: 0; transition: opacity .18s;
}
.drawer.on { opacity: 1; pointer-events: auto; }
.drawer-in {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-3);
  width: min(1120px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(10px); transition: transform .2s;
}
.drawer.on .drawer-in { transform: none; }
.drawer-hd { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
.crumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
.crumb .sep { color: var(--ink-3); }
.crumb a { color: var(--ink-2); text-decoration: none; }
.crumb a:hover { color: var(--brand-ink); text-decoration: underline; }
.drawer-body { display: grid; grid-template-columns: minmax(0,1fr) 336px; gap: 0; overflow: hidden; flex: 1; }
.drawer-main { padding: 18px 20px 26px; overflow-y: auto; }
.drawer-side { border-left: 1px solid var(--line); padding: 16px 18px 26px; overflow-y: auto; background: var(--surface); }
@media (max-width: 940px) { .drawer-body { grid-template-columns: minmax(0,1fr); } .drawer-side { border-left: none; border-top: 1px solid var(--line); } }

.dsec { margin-bottom: 20px; }
.dsec > h3 { font-size: 13px; margin-bottom: 8px; color: var(--ink-2); }
.dbody { font-size: 13.5px; line-height: 1.62; color: var(--ink); }
.dbody ul { margin: 0; padding-left: 19px; }
.dbody li { margin-bottom: 5px; }

.detbox { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 12px; }
.detbox > summary { list-style: none; cursor: pointer; padding: 9px 13px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 7px; background: var(--surface); }
.detbox > summary::-webkit-details-marker { display: none; }
.detbox > summary .caret { width: 13px; height: 13px; transition: transform .16s; color: var(--ink-3); }
.detbox[open] > summary .caret { transform: rotate(90deg); }
.detbox > summary .sum { margin-left: auto; font-size: 11.5px; font-weight: 500; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
.detbox .dcontent { padding: 4px 13px 13px; border-top: 1px solid var(--line); }

.frow { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 10px; align-items: center; padding: 6px 0; font-size: 12.5px; }
.frow > .fk { color: var(--ink-3); font-weight: 500; }
.frow > .fv { min-width: 0; }
.fadd { font-size: 12.5px; color: var(--ink-3); }
.fadd:hover { color: var(--brand-ink); text-decoration: underline; cursor: pointer; }

.subtask { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; margin-bottom: 5px; font-size: 12.5px; background: var(--surface); }
.subtask .sk { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); }
.subtask .st { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subtask input[type=checkbox] { accent-color: var(--brand); width: 14px; height: 14px; }
.stprog { height: 5px; border-radius: 999px; background: var(--track); overflow: hidden; margin-bottom: 8px; }
.stprog i { display: block; height: 100%; background: var(--ok); }

.actbar { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.actbar button { padding: 7px 12px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.actbar button:hover { color: var(--ink); }
.actbar button[aria-selected="true"] { color: var(--brand-ink); border-bottom-color: var(--brand); }

.composer { display: flex; gap: 9px; margin-bottom: 16px; }
.composer .cin { flex: 1; border: 1px solid var(--line-2); border-radius: 9px; padding: 9px 11px; background: var(--surface); }
.composer .cin:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
.composer textarea { width: 100%; border: none; outline: none; resize: vertical; min-height: 36px; font-size: 13px; background: transparent; }
.quickchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.quickchips button { font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); background: var(--surface); }
.quickchips button:hover { border-color: var(--brand-line); background: var(--brand-tint); color: var(--brand-ink); }

.feed { display: flex; flex-direction: column; gap: 14px; }
.fitem { display: flex; gap: 10px; }
.fitem .fc { flex: 1; min-width: 0; }
.fitem .fmeta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
.fitem .fname { font-size: 12.5px; font-weight: 600; }
.fitem .ftime { font-size: 11.5px; color: var(--ink-3); }
.fitem .ftext { font-size: 13px; line-height: 1.55; color: var(--ink); }
.fitem.ev .ftext { color: var(--ink-2); font-size: 12.5px; }
.evdot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.evdot svg { width: 13px; height: 13px; color: #fff; }

/* linked work items */
.linked { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; margin-bottom: 5px; font-size: 12.5px; }
.linked .lrel { font-size: 11px; font-weight: 600; color: var(--ink-3); width: 76px; flex: none; }

/* ---- initiative cards --------------------------------------------------- */
.icard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-1); padding: 15px 16px; cursor: pointer; transition: box-shadow .15s, transform .15s, border-color .15s; display: flex; flex-direction: column; gap: 10px; }
.icard:hover { border-color: var(--brand-line); }
.icard .ihd { display: flex; align-items: flex-start; gap: 10px; }
.icard .icode { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--ink-3); }
.icard .iname { font-size: 14px; font-weight: 600; line-height: 1.32; }
.icard .iout { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.icard .imeta { display: flex; flex-wrap: wrap; gap: 5px; }
.icard .istats { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: auto; }
.icard .istats .s .k { font-size: 10.5px; color: var(--ink-3); font-weight: 500; }
.icard .istats .s .v { font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px; }

.stagebar { display: flex; gap: 2px; }
.stagebar i { height: 4px; flex: 1; border-radius: 2px; background: var(--track); }
.stagebar i.on { background: var(--navy); }
.stagebar i.cur { background: var(--brand); }

/* ---- misc --------------------------------------------------------------- */
.banner { display: none; border-radius: 9px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; border: 1px solid transparent; }
.banner.on { display: block; }
.banner.info { background: var(--info-tint); color: var(--info); border-color: var(--info-line); }
.banner.warn { background: var(--watch-tint); color: var(--watch); border-color: var(--watch-line); }
.banner.err  { background: var(--risk-tint); color: var(--risk); border-color: var(--risk-line); }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 14px); z-index: 300;
  background: var(--ink); color: #fff; border-radius: 9px; padding: 10px 16px; font-size: 13px; font-weight: 500;
  box-shadow: var(--shadow-3); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.kv { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 7px 14px; font-size: 12.5px; }
.kv .k { color: var(--ink-3); }
.kv .v { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

.rank { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
.rank .rn { font-size: 12.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .rb { width: 112px; height: 7px; border-radius: 999px; background: var(--track); overflow: hidden; flex: none; }
.rank .rb i { display: block; height: 100%; border-radius: 999px; }
.rank .rv { font-size: 12.5px; font-weight: 700; width: 56px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }

.note { background: var(--surface-2); border-left: 3px solid var(--line-2); border-radius: 0 7px 7px 0; padding: 9px 13px; font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
.note.brand { background: var(--brand-tint); border-left-color: var(--brand); color: var(--ink-2); }

.scrolly { max-height: 340px; overflow-y: auto; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; }
*::-webkit-scrollbar-track { background: transparent; }

/* ---- narrow screens ------------------------------------------------------
   The rail is 246px, which is most of a phone. Below 980px it collapses to an
   icon strip: every destination stays reachable and the content gets the room.
   Titles carry the label, so nothing becomes unidentifiable. */
@media (max-width: 980px) {
  :root { --rail: 58px; }
  .rail { padding: 14px 7px; }
  .brand { justify-content: center; padding: 2px 0 14px; }
  .brand > div { display: none; }
  .rail-group { display: none; }
  .navbtn { justify-content: center; padding: 10px 0; }
  .navbtn .nlabel, .navbtn .ct { display: none; }
  .navbtn svg { width: 19px; height: 19px; }
  .rail-foot .whoami { justify-content: center; padding: 6px 0; }
  .rail-foot .nlabel { display: none; }
  .topbar { padding: 10px 14px; }
  main { padding: 16px 14px 56px; }
  .hero { margin: -16px -14px 18px; border-radius: 0 0 14px 14px; }
  .hero-in { padding: 24px 18px 22px; }
  .drawer { padding: 0; }
  .drawer-in { border-radius: 0; height: 100%; }
}
@media (max-width: 620px) {
  .heat { grid-template-columns: 86px repeat(8, minmax(32px, 1fr)) !important; }
  .topbar .searchwrap { order: 3; width: 100% !important; }
  .boardbar .searchwrap { width: 100%; }
  .drawer-main, .drawer-side { padding-left: 14px; padding-right: 14px; }
}

@media print { .rail, .topbar, .boardbar { display: none } .app { grid-template-columns: 1fr } }
</style>

<div class="app">
  <nav class="rail" id="rail" aria-label="Primary"></nav>
  <div class="col" style="min-width:0">
    <header class="topbar" id="topbar"></header>
    <main id="main"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detail"></div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ===========================================================================
   0. HOST BRIDGE
   ---------------------------------------------------------------------------
   The page runs in two places: inside the model-driven app (where Xrm exists
   and Dataverse is the source of truth) and standalone in a browser tab for
   design review. Everything below reads from DATA, and DATA is filled either
   from Dataverse or from the seeded demo set. Keeping one shape means no view
   code has to know which mode it is in.

   NOTE: the Dataverse binding is stubbed deliberately. The tables for this
   module do not exist yet, so loadFromDataverse() returns false and we fall
   back to the seed. Wire it when cf_aiinitiative / cf_servicerequest land.
   =========================================================================== */
var XRM = (window.parent && window.parent.Xrm) || window.Xrm || (window.top && window.top.Xrm) || null;
var HOSTED = !!(XRM && XRM.WebApi);

/* ===========================================================================
   1. ICONS
   =========================================================================== */

}

   5. THE AI INITIATIVE LIST
   ---------------------------------------------------------------------------
   Six initiatives, verbatim from the list supplied by the team.

   WHAT IS IN THE SOURCE, and is therefore all that is shown:
     name, value (High / Medium / Low), effort (High / Medium / Low),

     no cost, no budget, no benefit in dollars, no return, no stage, no gate,
     no health, no owner, no sponsor, no risk tier, no dates, no metrics. See
     NOT_CAPTURED in the reference block, which the provenance page prints.

     fn   the business area, so the list can be compared with the reporting
          requests tracker
     cap  the AI capability, left null where the note does not say enough to
          place it

   evidence is a list of tracker row numbers whose request text names the same
   subject. It is a judgement, listed per initiative so it can be argued with,
   and it is the only thing joining the two halves of this portal.
   =========================================================================== */

     notes, evidenceRowNumbers) */

           f:fn, cap:cap, notes:notes || [], evidence:evidence || [] };
}

/* ===========================================================================
   6. SERVICE DESK: THE REPORTING REQUESTS TRACKER
   ---------------------------------------------------------------------------
   Seventy eight real rows from the reporting requests tracker, 2 June 2025 to
   27 August 2026.

   WHAT THE TRACKER DOES NOT CONTAIN, and is therefore not shown:
     - Priority. There is no priority column, so no card carries a priority
       flag and the detail panel says the field is not captured. Age is used
       as the urgency signal instead, because age is real.
     - A service level target. Nothing here is measured against a promise
       nobody made. "Aged" means open longer than AGED_DAYS, which is a
       convention of this portal and is labelled as one.
     - Estimates, subtasks and linked work items. The sections stay in the
       detail view with honest empty states rather than invented content.

   WHAT IS DERIVED, and how:
     - col: the board column, from Complete Y/N, then the Status Code, then
       the free text Status, in that order of precedence.
     - fn: the business function, from a keyword match on the request text.
       This is the only inferred classification and it is what the demand
       signal view compares against portfolio spend.
     - ini: a link to a portfolio initiative, only where the request text
       names the same thing. Ten of seventy eight. The rest are genuinely
       unaligned demand and the portal reports that rather than hiding it.
   =========================================================================== */
var DAY = 864e5, NOW = Date.now();
function ago(d, h){ return new Date(NOW - d*DAY - (h||0)*36e5).toISOString(); }

   not a commitment to anyone. */

/* R(n, title, system, column, analyst, requester, createdISO, completedISO,
     statusText, statusCode, additional, businessFunction, resolution,
     blockedReason, initiative, sourceContradiction) */
function R(n, title, sys, col, who, req, cr, cp, st, code, add, fn, res, blocked, ini, contra){
  return {
    n:n, key:'REQ-' + (n < 10 ? '00' : n < 100 ? '0' : '') + n,
    title:title, sys:sys, col:col,
    assignee:who, reporter:req,
    created:cr, completedAt:cp,
    statusText:st, statusCode:code, additional:add,
    fn:fn, resolution:res, blocked:blocked, ini:ini, contra:contra
  };
}

/* ===========================================================================
   7. ACTIVITY
   ---------------------------------------------------------------------------
   The tracker keeps progress as one free text Status note per row, not as a
   thread. So the activity feed is built from what actually exists:

     - the Status note, shown as the standing note from the analyst working it
     - the request date, as a created event
     - the completion date, as a completed event
     - the Status Code, where one is set

   There is no comment history, no work log and no subtask list in the source.
   Those sections stay in the detail view with empty states that say so,
   because a section invented to look complete is worse than an honest gap.

   Notes added in this session are held here so the demo can be driven, and
   they are marked as unsaved.
   =========================================================================== */
var COMMENTS = [];       /* filled at runtime only; the tracker has none */

/* Requests that describe the same work. The tracker has one explicit case
   ("dupl-done with Summary rpt") and one batch of seven rows raised on the
   same day with identical text, which is the duplicate intake the demand view
   reports. Grouped here so the board can show them as one cluster. */
var DUPLICATE_CLUSTERS = [
  { label:'Q1 2026 request batch, Jonathan Miklos',
    note:'Seven rows raised on 19 and 20 March with the same text and no requirements. Six were cancelled.',
    keys:['REQ-040','REQ-041','REQ-042','REQ-043','REQ-045','REQ-046','REQ-048'] }
];
var DUP_OF = {};
DUPLICATE_CLUSTERS.forEach(function(c){ c.keys.forEach(function(k){ DUP_OF[k] = c; }); });

/* ===========================================================================
   8. DERIVED SHAPES
   =========================================================================== */
function hydrate(){
  INITIATIVES.forEach(function(x){
    x.valueDef  = VALUE[x.value];
    x.effortDef = EFFORT[x.effort];
    x.statusDef = STATUSES[x.status];
    /* Value rank over effort rank. Not a score and not presented as one: it
       exists only to order the "worth doing first" list, and both inputs are
       shown beside it so the ordering can be checked by eye. */
    x.leverage  = x.valueDef.rank / x.effortDef.rank;
    x.moving    = x.status === 'inprogress';
  });

  TICKETS.forEach(function(t){
    t.sysDef = SYSTEMS[t.sys] || SYSTEMS['Ad hoc'];
    t.done = !!COL[t.col].done;
    t.dup = DUP_OF[t.key] || null;

    var cr = t.created ? asDate(t.created).getTime() : null;
    var cp = t.completedAt ? asDate(t.completedAt).getTime() : null;

    /* Age is time since the request was raised for open work, and time to
       completion for finished work. Two different questions, so they are two
       different fields rather than one number that changes meaning. */
    t.ageDays   = cr == null ? null : Math.max(0, Math.floor((NOW - cr) / DAY));
    t.cycleDays = (cr != null && cp != null) ? Math.max(0, Math.round((cp - cr) / DAY)) : null;

    /* The tracker has no "last updated" column. The most recent real date on
       the row is the completion date if there is one, otherwise the request
       date, and the portal says that rather than implying live updates. */
    t.updated = t.completedAt || t.created;
    t.idleDays = t.updated ? Math.floor((NOW - asDate(t.updated).getTime()) / DAY) : null;

    /* Aged means open longer than AGED_DAYS. A portal convention, labelled as
       one everywhere it appears, because the tracker sets no target. */
    t.aged = !t.done && t.ageDays != null && t.ageDays > AGED_DAYS;
    t.ageTone = t.done ? 'ok' : (t.aged ? 'risk' : (t.ageDays > AGED_DAYS * 0.66 ? 'watch' : 'ok'));

    t.desc = [];
    if (t.statusText) t.desc.push(t.statusText);
    if (t.additional) t.desc.push('Additional team member recorded: ' + t.additional);
    if (t.resolution) t.desc.push('Recorded outcome: ' + t.resolution);
    if (!t.desc.length) t.desc.push('The tracker row carries no status note.');

    t.labels = [];
    if (t.statusCode) t.labels.push(t.statusCode);
    if (/^CHG/.test(t.statusCode || '')) t.labels.push('Change ticket');
  });
}

var INI_BY = {};
function indexAll(){
  INI_BY = {}; INITIATIVES.forEach(function(x){ INI_BY[x.c] = x; });

  /* The evidence join runs one way only: each initiative names the tracker
     rows whose request text covers the same subject, and the ticket side is
     stamped from that. One list to maintain, so the two halves cannot drift
     apart, and the judgement stays visible on the initiative record. */
  TICKETS.forEach(function(t){ t.ini = null; });
  INITIATIVES.forEach(function(x){
    x.tickets = [];
    x.evidence.forEach(function(n){
      var t = TICKETS.filter(function(z){ return z.n === n; })[0];
      if (t){ t.ini = x.c; x.tickets.push(t); }
    });
    x.openTickets = x.tickets.filter(function(t){ return !t.done; }).length;
    x.agedTickets = x.tickets.filter(function(t){ return t.aged; }).length;
  });

  /* Stated dependencies resolved to real rows, so the portal can say whether
     the thing an initiative is waiting on is actually finished. */
  DEPS = STATED_DEPENDENCIES.map(function(d){
    var rows = d.keys.map(function(k){ return TBY[k]; }).filter(Boolean);
    return {
      from:d.from, label:d.label, note:d.note, rows:rows,
      open: rows.filter(function(t){ return !t.done; }).length,
      cleared: rows.length ? rows.every(function(t){ return t.done; }) : false
    };
  });
  DEPS_BY = {}; DEPS.forEach(function(d){ (DEPS_BY[d.from] = DEPS_BY[d.from] || []).push(d); });
}
var DEPS = [], DEPS_BY = {};
function initiative(code){ return INI_BY[code] || null; }

/* The activity feed for one request, built from the real fields. */
function activityFor(t){
  var out = [];
  if (t.created) out.push({ kind:'event', ev:'created', who:t.reporter, at:t.created });
  if (t.statusCode) out.push({ kind:'event', ev:'code', who:t.assignee, at:t.updated, to:t.statusCode });
  if (t.completedAt) out.push({ kind:'event', ev:'completed', who:t.assignee, at:t.completedAt, to:t.resolution });
  if (t.statusText) out.push({ kind:'note', who:t.assignee, body:t.statusText, at:t.updated });
  COMMENTS.filter(function(c){ return c[0] === t.key; }).forEach(function(c){
    out.push({ kind:'comment', who:c[1], body:c[2], at:c[3], unsaved:true });
  });
  return out.sort(function(a,b){ return asDate(b.at) - asDate(a.at); });
}

function esc(s){
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function sum(a, f){ return a.reduce(function(s,x){ return s + (f ? (f(x)||0) : (x||0)); }, 0); }
function by(k){ return function(a,b){ return a[k] < b[k] ? -1 : a[k] > b[k] ? 1 : 0; }; }
function desc(k){ return function(a,b){ return (b[k]||0) - (a[k]||0); }; }
function uniq(a){ return a.filter(function(v,i){ return a.indexOf(v) === i; }); }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function groupCount(arr, f){
  var o = {}; arr.forEach(function(x){ var k = f(x); o[k] = (o[k]||0) + 1; }); return o;
}

/* Money is held in thousands everywhere. These are the only two places that
   know that, so changing the unit later is a two line change. */
function money(k){
  if (k == null) return 'Not set';
  if (Math.abs(k) >= 1000) return '$' + (k/1000).toFixed(k >= 10000 ? 0 : 1) + 'M';
  return '$' + Math.round(k) + 'k';
}
function moneyFull(k){ return '$' + Number(Math.round(k)*1000).toLocaleString() ; }
function pct(v){ return (v == null ? 'Not set' : Math.round(v) + '%'); }
function nfmt(v){ return Number(v||0).toLocaleString(); }
/* Capitalise the first letter for display only. Label and tag values are
   stored lowercase and hyphenated the way the team types them, but nothing in
   this portal renders in lower case, so the capital is applied at the render
   site rather than baked into the data. */
function cap(s){
  s = String(s == null ? '' : s).replace(/-/g, ' ');
  return s.charAt(0).toUpperCase() + s.slice(1);
}
/* A capital on the first letter of text that came from the source, for
   display only. Eleven of the seventy eight request titles are typed in lower
   case ("adding 6 SQL for Low Income Report"), and nothing in this portal
   renders in lower case. The stored value is untouched, search still matches
   on the original, and the substitution is listed on the provenance page. */
function capFirst(s){
  s = String(s == null ? '' : s);
  return s.charAt(0).toUpperCase() + s.slice(1);
}
/* Customer counts are held in thousands, the same way money is held in
   thousands. Past a million the "k" suffix stops reading as a number and
   starts reading as a typo, so it rolls over. */
function people(k){
  if (k == null) return 'Not set';
  if (k >= 1000) return (k/1000).toFixed(k >= 10000 ? 0 : 1) + 'M';
  return nfmt(k) + 'k';
}

function relTime(iso){
  var d = (NOW - asDate(iso).getTime()) / DAY;
  if (d < 0.0417) return 'Just now';
  if (d < 1) { var h = Math.round(d*24); return h + (h === 1 ? ' hour ago' : ' hours ago'); }
  if (d < 30) { var n = Math.round(d); return n + (n === 1 ? ' day ago' : ' days ago'); }
  if (d < 365) { var m = Math.round(d/30); return m + (m === 1 ? ' month ago' : ' months ago'); }
  var y = (d/365).toFixed(1); return y + ' years ago';
}
/* The tracker stores date-only values. new Date('2026-06-02') is parsed as
   UTC midnight, which then renders as 1 June anywhere west of Greenwich, so
   every date in the source would display a day early. Date-only strings are
   therefore split and built as a local date. Day differences are unaffected
   either way, so only display needed the fix. */
function asDate(iso){
  if (!iso) return null;
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(iso);
}
function fmtDate(iso){
  var d = asDate(iso);
  if (!d) return 'None';
  return d.toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric' });
}

/* ===========================================================================
   10. TOOLTIP
   ---------------------------------------------------------------------------
   One shared tooltip element, positioned on pointer move. Every mark that
   carries data sets data-tip, so the hover layer is the default rather than
   something each chart has to remember.
   =========================================================================== */
var tipEl = document.getElementById('tip');
document.addEventListener('mouseover', function(e){
  var t = e.target.closest('[data-tip]');
  if (!t) return;
  tipEl.innerHTML = t.getAttribute('data-tip');
  tipEl.classList.add('on');
});
document.addEventListener('mousemove', function(e){
  if (!tipEl.classList.contains('on')) return;
  var pad = 14, w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  var x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
  if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
});
document.addEventListener('mouseout', function(e){
  if (e.target.closest('[data-tip]')) tipEl.classList.remove('on');
});
function tipRows(title, rows){
  return esc(title) === '' ? '' :
    '<b>' + title + '</b>' + rows.map(function(r){
      return '<div class="r"><em>' + r[0] + '</em><span>' + r[1] + '</span></div>';
    }).join('');
}

var toastEl = document.getElementById('toast'), toastT = null;
function toast(msg){
