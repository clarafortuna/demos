<style>
/* ===========================================================================
   Orange & Rockland AI hub
   One workspace for the AI initiative portfolio and the service desk that
   feeds it.

   COLOR SYSTEM
   ------------
   O&R identity orange (#f07f2d) only reaches 2.7:1 on white, so it is
   reserved for the brand mark, the hero gradient and dark-mode ink. The
   darker burnt orange (#b74118, 5.6:1) carries every action, every active
   nav item and every focus ring. Navy (#26428c) is the cool counterweight
   and takes data ink so the orange chrome never competes with the priority
   thermometer.

   Chart series use the validated eight-slot categorical order from the
   house data-viz palette, assigned in fixed order and never cycled. Stage
   is an ORDERED dimension so it uses a single-hue ordinal ramp, not the
   categorical slots. Status colors (good / watch / at risk) are reserved
   and never reused as a series.

   The two badge axes are separated on three channels at once so they stay
   legible in greyscale and in dark mode:
     STATUS   = filled pill,  rounded, cool hues, leading dot
     PRIORITY = hollow chip,  square,  warm hues, leading glyph

   THEME
   -----
   Light is the default. Dark applies only on an explicit choice, either the
   in-page toggle or the host stamping data-theme="dark" on <html>.

   NO em dashes or en dashes anywhere in this file, in code or in copy.
   =========================================================================== */

:root {
  color-scheme: light;

  /* Neutrals, biased warm-cool toward the navy accent rather than pure grey */
  --ground:    #f4f6fa;
  --surface:   #ffffff;
  --surface-2: #eef1f7;
  --surface-3: #e6ebf4;
  --line:      #e0e5ef;
  --line-2:    #c9d2e2;
  --ink:       #16202f;
  --ink-2:     #47546b;
  --ink-3:     #626f86;   /* 4.69:1 on --ground, 5.08:1 on --surface. The
                             previous #6f7c93 read nicer but sat at 3.90:1,
                             under the 4.5:1 floor for the hint and label text
                             this token carries. */

  /* Brand: chrome, identity and actions only, never a data value */
  --brand:        #b74118;
  --brand-hover:  #8f3212;
  --brand-ink:    #b74118;
  --brand-accent: #f07f2d;
  --brand-tint:   #fff3e7;
  --brand-tint-2: #ffe4cf;
  --brand-line:   #f4c9a4;
  /* The banner runs black, and the brand orange appears in it only as
     accent. A separate ramp from --hero-*, which the orange callout band,
     the gradient callout and the do first cell still use. The far end lifts
     a degree or two warm rather than staying dead neutral, so the black sits
     with the orange instead of fighting it. */
  --banner-1:     #000000;
  --banner-2:     #0a0908;
  --banner-3:     #15120f;
  --banner-4:     #1e1915;
  /* True black, for the scrims that sit over the banner. */
  --banner-ink:   0,0,0;

  --hero-1:       #6d2803;
  --hero-2:       #a8460b;
  --hero-3:       #ef7f18;
  --hero-4:       #f5901d;

  /* Cool counterweight, carries data ink */
  --navy:      #26428c;
  --navy-deep: #182e67;
  --navy-ink:  #26428c;
  --navy-tint: #e8eefb;
  --navy-line: #bdcdf0;

  /* Reserved status palette. Never used as a categorical series. */
  --ok:     #047857; --ok-tint:     #ecfdf5; --ok-line:     #b8e7df;
  --watch:  #b45309; --watch-tint:  #fffbeb; --watch-line:  #fde68a;
  --risk:   #b91c1c; --risk-tint:   #fef2f2; --risk-line:   #fecdd3;
  --info:   #26428c; --info-tint:   #e8eefb; --info-line:   #bdcdf0;
  --muted-tint: #f1f5f9; --muted-ink: #475569; --muted-line: #d7dfea;

  /* Priority thermometer, hollow square chips */
  --p-highest: #b91c1c;
  --p-high:    #c2410c;
  --p-medium:  #a16207;
  --p-low:     #15803d;
  --p-lowest:  #0f766e;

  /* Categorical series, validated adjacent order, assigned by entity */
  --s1: #2a78d6;  /* blue    */
  --s2: #eb6834;  /* orange  */
  --s3: #1baf7a;  /* aqua    */
  --s4: #eda100;  /* yellow  */
  --s5: #e87ba4;  /* magenta */
  --s6: #008300;  /* green   */
  --s7: #4a3aa7;  /* violet  */
  --s8: #e34948;  /* red     */

  /* Ordinal ramp for stage and for sequential heat. One hue, light to dark. */
  --o1: #e3edfb;
  --o2: #bfd6f5;
  --o3: #8fb4e9;
  --o4: #5b8cd8;
  --o5: #3465bd;
  --o6: #21458c;

  --track:  #e2e8f0;

  /* Value against effort stage. The cell ramp climbs from nearly white at
     low value and high effort to the brand orange at the do first corner;
     the circles are navy, the portal's data colour, so they read against
     every step of the orange. */
  --ve-bg:   #fbf7f3;
  --ve-line: #efe2d7;
  --ve-s1:   #eeb690;
  --ve-s0:   #f6d8c3;
  --ve-sn1:  #faeadf;
  --ve-sn2:  #fdf4ee;
  --ve-tag:  #6a3a20;
  --ve-bub:  var(--navy);
  --ve-ring: #f07f2d;
  --ve-bar:  var(--navy);
  --ve-trk:  rgba(38,66,140,.12);
  --grid:   #edf1f7;

  --shadow-1: none;
  --shadow-2: none;
  --shadow-3: 0 6px 24px -8px rgba(22,32,47,.22);

  --radius: 10px;
  --radius-sm: 7px;
  --rail: 246px;

  /* TYPE
     Microsoft system fonts, so nothing is fetched at runtime and the portal
     matches the chrome of the model-driven app it is hosted in. Segoe UI
     Variable is the Fluent 2 family and ships with Windows 11; the Text and
     Display optical sizes are real faces, not synthetic weights, so large
     headings get tighter spacing without us faking it. Everything falls back
     through plain Segoe UI and then the platform default, which keeps it
     legible on a Mac or a Linux box without loading a web font. */
  --font:         "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-small:   "Segoe UI Variable Small", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-mono:    Consolas, "Cascadia Mono", "Cascadia Code", ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0f172a; --surface: #1b2637; --surface-2: #243448; --surface-3: #2c3e56;
  --line: #33415a; --line-2: #435372;
  --ink: #e9eff8; --ink-2: #b6c3d6; --ink-3: #8b9ab2;

  --brand-ink: #f07f2d; --brand-tint: #3f2110; --brand-tint-2: #55301a; --brand-line: #7a4520;
  --navy-ink: #93b4f5; --navy-tint: #22325c; --navy-line: #3c5185;

  --ok: #34d399;   --ok-tint: #0c3b30;   --ok-line: rgba(52,211,153,.4);
  --watch: #fbbf24; --watch-tint: #3d2c07; --watch-line: rgba(251,191,36,.4);
  --risk: #f87171; --risk-tint: #3f1414; --risk-line: rgba(248,113,113,.4);
  --info: #93b4f5; --info-tint: #22325c; --info-line: rgba(147,180,245,.4);
  --muted-tint: rgba(255,255,255,.06); --muted-ink: #cbd5e1; --muted-line: rgba(255,255,255,.14);

  --p-highest: #f87171; --p-high: #fb923c; --p-medium: #facc15;
  --p-low: #4ade80; --p-lowest: #5eead4;

  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;

  --o1: #1e3252; --o2: #26456e; --o3: #2f5a91; --o4: #3f76b8; --o5: #6098d8; --o6: #93b8ec;

  --track: #33415a;
  --ve-bg: #202b3c; --ve-line: #33415a;
  --ve-s1: #7a3a1c; --ve-s0: #4d2f22; --ve-sn1: #3a2d2b; --ve-sn2: #2e2b30;
  --ve-tag: #d9b8a3; --ve-bub: #ffffff; --ve-ring: #f07f2d;
  --ve-bar: rgba(255,255,255,.72); --ve-trk: rgba(255,255,255,.12);
  --grid:  #2a3750;

  --shadow-1: none;
  --shadow-2: none;
  --shadow-3: 0 6px 24px -8px rgba(0,0,0,.5);
}

/* ---- base --------------------------------------------------------------- */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--font);
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { margin: 0; font-family: var(--font-display); font-weight: 600; letter-spacing: -.012em; text-wrap: balance; }
h1 { font-size: 23px; }
h2 { font-size: 15px; }
h3 { font-size: 13.5px; }
p { margin: 0; }
a { color: var(--brand-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 2px; border-radius: 4px; }
svg { display: block; }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num  { font-variant-numeric: tabular-nums; }
.lbl  { font-family: var(--font-small); font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--ink-3); }
.muted{ color: var(--ink-2); }
.faint{ color: var(--ink-3); }
.small{ font-size: 12.5px; }
.tiny { font-family: var(--font-small); font-size: 11.5px; }
.center { text-align: center; }
.right  { text-align: right; }
.nowrap { white-space: nowrap; }
.trunc  { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hide   { display: none !important; }

.row { display: flex; align-items: center; }
.row.top { align-items: flex-start; }
.row.base { align-items: baseline; }
.col { display: flex; flex-direction: column; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}
.gap-14{gap:14px}.gap-16{gap:16px}.gap-20{gap:20px}.gap-24{gap:24px}

.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2,minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3,minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4,minmax(0,1fr)); }
.g5 { grid-template-columns: repeat(5,minmax(0,1fr)); }
.g23 { grid-template-columns: minmax(0,2fr) minmax(0,3fr); }
.g32 { grid-template-columns: minmax(0,3fr) minmax(0,2fr); }
.g21 { grid-template-columns: minmax(0,2fr) minmax(0,1fr); }
@media (max-width:1180px){ .g5,.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g23,.g32,.g21{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){ .g5,.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)} }

/* ---- shell -------------------------------------------------------------- */
.app { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 100vh; }

.rail {
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 2px; padding: 16px 12px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 9px; flex: none;
  background: var(--brand);
  display: grid; place-items: center;
}
.brand-mark svg { width: 23px; height: 23px; }
.brand-name { font-size: 13.5px; font-weight: 700; line-height: 1.15; }
.brand-sub  { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; color: var(--brand-ink); margin-top: 1px; }

.rail-group { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--ink-3); padding: 14px 10px 5px; }
.navbtn {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 8px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--ink-2);
}
.navbtn:hover { background: var(--surface-2); color: var(--ink); }
.navbtn[aria-current="page"] { background: var(--brand); color: #fff; font-weight: 600; }
.navbtn[aria-current="page"] svg { color: #fff; }
.navbtn svg { width: 17px; height: 17px; flex: none; color: var(--ink-3); }
.navbtn .ct {
  margin-left: auto; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.navbtn[aria-current="page"] .ct { background: rgba(255,255,255,.2); color: #fff; }
.rail-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; }

.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 11px 24px; background: color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
main { padding: 22px 24px 64px; max-width: 1420px; }
/* The executive report runs edge to edge inside the content column, so it
   cancels main's padding and its own max-width. Every other view keeps it. */
main:has(.rp), main.report { padding: 0; max-width: none; }
.view { display: none; animation: fade .26s ease; }
.view.on { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

/* ---- controls ----------------------------------------------------------- */
.field {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line-2);
  border-radius: 8px; padding: 7px 11px; font-size: 13px; width: 100%;
}
.field:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
select.field { cursor: pointer; padding-right: 26px; }
textarea.field { min-height: 84px; resize: vertical; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
  border: 1px solid transparent; transition: background .14s, border-color .14s, color .14s;
}
.btn svg { width: 15px; height: 15px; }
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-hover); }
.btn-ghost { background: var(--surface); color: var(--ink-2); border-color: var(--line-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-quiet { color: var(--ink-2); padding: 6px 9px; }
.btn-quiet:hover { background: var(--surface-2); color: var(--ink); }
.btn-sm { padding: 5px 10px; font-size: 12.5px; }
.btn-sm svg { width: 13px; height: 13px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 2px; gap: 2px; }

/* View mode tabs, used by the portfolio. Same shape as the activity tabs in
   the detail drawer so a tab looks like a tab everywhere in the portal. */
.vtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.vtabs button { padding: 9px 15px; font-size: 13.5px; font-weight: 600; color: var(--ink-3);
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.vtabs button:hover { color: var(--ink); }
.vtabs button[aria-pressed="true"] { color: var(--brand-ink); border-bottom-color: var(--brand); }
.seg button { padding: 5px 11px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }

.searchwrap { position: relative; display: flex; align-items: center; }
.searchwrap svg { position: absolute; left: 10px; width: 15px; height: 15px; color: var(--ink-3); pointer-events: none; }
.searchwrap .field { padding-left: 31px; }

/* ---- surfaces ----------------------------------------------------------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-1); }
.pad { padding: 16px 18px; }
.pad-sm { padding: 12px 14px; }
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 18px; border-bottom: 1px solid var(--line);
}
.panel-head h2 { font-size: 14px; }
.panel-head .hint { font-size: 12px; color: var(--ink-3); }
.sec { margin-bottom: 20px; }
.sec-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 11px; }
.sec-hd h2 { font-size: 15px; }
.sec-hd .hint { font-size: 12px; color: var(--ink-3); }

.empty { padding: 44px 20px; text-align: center; color: var(--ink-3); font-size: 13px; }

/* The facade.
   Orange and Rockland's own building, drawn the way an architect draws an
   elevation: fine linework, not filled blocks. Filled polygons with a hard
   shine band is a dated look, and it was the first thing tried here.

   What carries it instead:
     1. hairline piers and floor lines, so it reads as drawing rather than
        as clip art
     2. an atmospheric fade upward, because distance washes detail out, which
        is what gives it depth without a single shadow
     3. one large soft light that drifts slowly, rather than a band sweeping
        across on a loop
     4. film grain over everything, which is what stops vector work from
        looking like vector work

   It sits as the first child of the banner, so paint order puts it under
   the scrim pass and under the text. */
.hero-mosaic { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
/* Over the photograph the facade only needs to suggest structure, so it
   drops back rather than competing with what is underneath. */
.rp-hero .hero-mosaic { opacity: .5; z-index: 1; }
.hero-mosaic g { will-change: transform; }

/* The drawing rises into place once, slowly, on a decelerating curve. */
.hm-arch { animation: hmRise 1.2s cubic-bezier(.16,1,.3,1) both; }
@keyframes hmRise { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }

/* A single soft light drifting back and forth. Long period and an alternate
   direction, so it never reads as a loop restarting. */
.hero-glow { animation: hmGlow 21s ease-in-out infinite alternate; will-change: transform; }
@keyframes hmGlow { from { transform: translate(-220px, 18px) } to { transform: translate(460px, -14px) } }

@media (prefers-reduced-motion: reduce) {
  .hm-arch { animation: none; }
  .hero-glow { animation: none; }
  .hero-mosaic g { transform: none !important; }
}



/* ===========================================================================
   REPORT LAYOUT (rp-)
   ---------------------------------------------------------------------------
   The executive view is a scrolling report rather than a dashboard, matching
   the Con Edison DAC report the team liked. Everything here is prefixed rp-
   so it cannot collide with the dense app chrome the operational pages use.

   Two deliberate departures from the reference:
     - Its type is Open Sans and Nunito Sans from Google. This portal loads
       nothing externally, so the same weight and spacing is done with Segoe
       UI Variable Display at 800. Same voice, no network call.
     - It leans on stock photography throughout. There is none for O&R, so
       the facade drawing already built for the banner stands in, which is
       their own building rather than a stock image of somebody else's.
   =========================================================================== */
.rp { margin: 0; background: var(--surface); overflow-x: hidden; }
.rp-sec { position: relative; z-index: 2; background: var(--surface); }
.rp-sec.grey { background: var(--surface-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.rp-band { padding: 3.4rem 3rem; display: flex; flex-direction: column; gap: 1.6rem; }
@media (max-width: 1100px){ .rp-band { padding: 2.4rem 1.6rem; } }

/* ---- hero ---------------------------------------------------------------- */
.rp-hero {
  position: relative; overflow: hidden; display: flex; align-items: center;
  min-height: 460px; height: calc(100vh - 210px); max-height: 620px;
  /* The scroll cue is absolutely positioned at the bottom, so the banner
     reserves its band here. Without this the centred block grows down into
     the cue on a short window, and the stat strip and the cue collide. */
  padding-bottom: 5rem;
  /* The gradient stays as the background even though a photograph sits on
     top of it. If the image is blocked, which is likely the first time this
     runs inside the model-driven app with a strict content policy, the
     banner degrades to black with the orange accents still on it rather
     than to an empty box. */
  background: linear-gradient(118deg, var(--banner-1) 0%, var(--banner-2) 42%, var(--banner-3) 84%, var(--banner-4) 108%);
}

/* The owner's photograph: an aerial of an operations building and its yard.
   It is 4:3 going into a banner around 2.4:1, so most of its height is
   cropped away. Anchored at 72% so the crop keeps the roofline, the brick
   front and the flag, and gives up the sky, which the black wash would flatten
   anyway. On a phone the banner turns tall and the crop falls on the centre of
   the building instead. */
.rp-hero-photo {
  position: absolute; inset: 0; z-index: 0;
  background-image: url('https://tri-stateroofing.com/wp-content/uploads/sites/51/2024/07/EIWD9223.jpg');
  background-size: cover; background-position: center 72%;
  transform: scale(1.02);
  transition: transform 14s cubic-bezier(.25,.46,.45,.94);
}
.rp-hero.zoom .rp-hero-photo { transform: scale(1.13); }

/* Black wash over the photograph. Deliberately lighter than the coloured
   versions this replaced, because the point of a black treatment is that the
   picture still reads through it. The diagonal falloff is gentle: enough that
   the wash is not dead flat, not so much that it becomes a gradient again.
   Text protection is the scrim's job, not this layer's. */
.rp-hero-tint {
  position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(118deg, rgba(0,0,0,.74) 0%, rgba(0,0,0,.60) 42%, rgba(0,0,0,.48) 84%, rgba(0,0,0,.42) 108%);
}
@media (prefers-reduced-motion: reduce){ .rp-hero.zoom .rp-hero-photo { transform: scale(1.02); } }
.rp-hero-in { position: relative; z-index: 2; padding: 3rem; width: 100%; max-width: 940px; margin: 0 auto; text-align: center; }
.rp-hero::after {
  content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 76% 86% at center, rgba(var(--banner-ink),.30) 0%, rgba(var(--banner-ink),.12) 58%, rgba(var(--banner-ink),.44) 100%);
}
.rp-eyebrow {
  display: inline-flex; align-items: center; gap: .6rem; margin-bottom: 1.4rem;
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.34);
  border-radius: 100px; padding: .45rem 1.1rem;
}
.rp-eyebrow::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: rpPulse 2.5s infinite; }
@keyframes rpPulse { 0%,100% { opacity: 1; transform: scale(1) } 50% { opacity: .35; transform: scale(1.5) } }
.rp-eyebrow span { font-size: .68rem; font-weight: 700; letter-spacing: .14em; color: #fff; }
.rp-hero h1 {
  font-family: var(--font-display); font-size: clamp(2.2rem, 4.4vw, 3.5rem); color: #fff;
  font-weight: 800; line-height: 1.08; letter-spacing: -1.4px; margin-bottom: 1rem;
}
.rp-hero h1 em { font-style: normal; color: rgba(255,255,255,.62); }
.rp-hero p { font-size: 1rem; color: rgba(255,255,255,.82); max-width: 620px; margin: 0 auto 2.2rem; line-height: 1.8; }
.rp-hstats {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 1px; max-width: 760px; margin: 0 auto;
  background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.22); border-radius: 16px; overflow: hidden;
}
.rp-hstat { padding: 1.5rem 1rem; text-align: center; background: rgba(0,0,0,.34); backdrop-filter: blur(2px); }
.rp-hstat .n { font-family: var(--font-display); font-size: 2.1rem; font-weight: 800; color: #fff; letter-spacing: -1.4px; line-height: 1; }
.rp-hstat .l { font-size: .66rem; color: rgba(255,255,255,.78); margin-top: .5rem; line-height: 1.4; font-weight: 600; }
/* Narrow: the banner gives up its fixed height, so the stat strip wraps to
   two rows instead of being clipped by max-height, and it carries enough
   bottom padding for the scroll cue to sit clear of that second row. */
@media (max-width: 860px){
  .rp-hstats { grid-template-columns: 1fr 1fr }
  .rp-hero { height: auto; max-height: none; min-height: 0; padding: 2.5rem 0 5.4rem }
  .rp-hero-in { padding: 2rem 1.4rem }
}
.rp-scroll {
  position: absolute; bottom: 1.6rem; left: 50%; transform: translateX(-50%); z-index: 2;
  display: flex; flex-direction: column; align-items: center; gap: .45rem;
  color: rgba(255,255,255,.55); font-size: .6rem; letter-spacing: .18em; animation: rpBob 3s ease-in-out infinite;
}
.rp-scroll::after { content: ''; width: 1px; height: 32px; background: linear-gradient(to bottom, rgba(255,255,255,.5), transparent); }
@keyframes rpBob { 0%,100% { transform: translateX(-50%) translateY(0) } 50% { transform: translateX(-50%) translateY(-7px) } }
/* On a short window the banner is already pinned at its minimum height and
   the cue has nowhere left to sit, so it steps out rather than colliding
   with the stat strip. The narrow layout keeps it, because there the banner
   grows to fit its contents instead of being capped. */
@media (max-height: 680px) and (min-width: 861px){ .rp-scroll { display: none } }

/* ---- section headings ---------------------------------------------------- */
.rp-tag { display: inline-flex; align-items: center; gap: .55rem; margin-bottom: .55rem; }
.rp-tag::before { content: ''; width: 24px; height: 3px; background: var(--brand); border-radius: 2px; flex: none; }
.rp-tag span { font-size: .95rem; font-weight: 700; letter-spacing: .01em; color: var(--brand-ink); }
.rp-h2 { font-family: var(--font-display); font-size: clamp(1.4rem, 2.1vw, 1.9rem); font-weight: 800; line-height: 1.18; letter-spacing: -.4px; margin-bottom: .45rem; }
.rp-p { font-size: .95rem; color: var(--ink-2); line-height: 1.8; max-width: 70ch; }
.rp-note { font-size: .8rem; color: var(--ink-3); line-height: 1.7; }

/* ---- kpi ----------------------------------------------------------------- */
.rp-kpis { display: grid; grid-template-columns: repeat(3,1fr); gap: .8rem; }
@media (max-width: 1100px){ .rp-kpis { grid-template-columns: 1fr 1fr } }
@media (max-width: 620px){ .rp-kpis { grid-template-columns: 1fr } }
.rp-kpi {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 1.3rem 1.25rem; position: relative; overflow: hidden; transition: border-color .3s;
}
.rp-sec.grey .rp-kpi { background: var(--surface); }
.rp-kpi:hover { border-color: var(--brand-line); }
.rp-kpi::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--brand);
  transform: scaleX(0); transform-origin: left;
  transition: transform .9s .1s cubic-bezier(.25,.46,.45,.94);
}
.rp-kpi.visible::before { transform: scaleX(1); }
.rp-kpi .v { font-family: var(--font-display); font-size: 1.95rem; font-weight: 800; letter-spacing: -1.3px; line-height: 1.1; display: block; }
.rp-kpi .l { font-size: .78rem; color: var(--ink-2); margin-top: .4rem; line-height: 1.4; font-weight: 700; }
.rp-kpi .s { font-size: .74rem; color: var(--ink-3); margin-top: .25rem; line-height: 1.45; }

/* ---- cards and grids ----------------------------------------------------- */
.rp-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.4rem; }
.rp-card > h4 { font-size: .85rem; color: var(--ink-2); font-weight: 700; margin-bottom: .2rem; }
.rp-card > .rp-sub { font-size: .76rem; color: var(--ink-3); margin-bottom: .9rem; line-height: 1.5; }
.rp-g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; }
.rp-g2.wide { grid-template-columns: 1.25fr .75fr; }
@media (max-width: 1100px){ .rp-g2, .rp-g2.wide { grid-template-columns: 1fr } }

/* ---- full width break ---------------------------------------------------- */
.rp-break { position: relative; padding: 6rem 3rem; overflow: hidden; text-align: center; z-index: 2;
  background: var(--brand); }
/* No overlay here. With a flat fill an overlay would just darken the brand
   colour into something that is no longer the brand colour, so the facade
   behind the text is knocked back on its own layer instead. */
.rp-break .hero-mosaic { opacity: .18; z-index: 1; }
/* The band's photograph, when one is embedded, sits under one flat wash of
   the action orange: a single colour at a single strength, so the band keeps
   the flat rule every orange surface follows, with the picture reading
   through. With no photograph the wash is fully opaque, so the band looks
   exactly as it did before this existed. */
.rp-break-photo { position: absolute; inset: 0; z-index: 0; background-size: cover; background-position: center;
  transform: scale(1.02); transition: transform 14s cubic-bezier(.25,.46,.45,.94); }
/* The same slow push in as the first banner. This band sits well down the
   page, so it starts when the band comes on screen (the chart observer adds
   .go) rather than on load, where it would mostly play out of sight. */
.rp-break.go .rp-break-photo { transform: scale(1.13); }
@media (prefers-reduced-motion: reduce){ .rp-break.go .rp-break-photo { transform: scale(1.02); } }
.rp-break-tint { position: absolute; inset: 0; z-index: 1; background: var(--brand); }
.rp-break.has-photo .rp-break-tint { opacity: .89; }
/* Over a photograph the body copy goes to full white. Measured across the
   text area, the brightest patch of a photo under the wash is where 80%
   white stops clearing 4.5:1. */
.rp-break.has-photo p { color: #fff; }
.rp-break .inner { position: relative; z-index: 3; max-width: 700px; margin: 0 auto; }
.rp-break h2 { font-family: var(--font-display); color: #fff; font-size: clamp(1.7rem, 3.2vw, 2.6rem); font-weight: 800; line-height: 1.14; letter-spacing: -.6px; margin-bottom: .8rem; }
.rp-break p { color: rgba(255,255,255,.8); line-height: 1.8; font-size: 1rem; }
.rp-pill { display: inline-flex; align-items: center; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.34); border-radius: 100px; padding: .35rem 1rem; margin-bottom: 1rem; }
.rp-pill span { font-size: .74rem; font-weight: 700; letter-spacing: .14em; color: #fff; }
@media (max-width: 1100px){ .rp-break { padding: 4rem 1.6rem } }

/* ---- footer -------------------------------------------------------------- */
.rp-foot { background: #140d08; color: rgba(255,255,255,.42); padding: 2.6rem 3rem; display: flex;
  align-items: flex-start; justify-content: space-between; gap: 2rem; flex-wrap: wrap; position: relative; z-index: 2; }
.rp-foot b { color: rgba(255,255,255,.72); font-weight: 700; }
.rp-foot .r { text-align: right; font-size: .76rem; line-height: 1.8; max-width: 52ch; }
@media (max-width: 1100px){ .rp-foot { padding: 2rem 1.6rem } .rp-foot .r { text-align: left } }

/* ---- reveal -------------------------------------------------------------- */
.rp-up { opacity: 0; transform: translateY(30px); transition: opacity .9s cubic-bezier(.25,.46,.45,.94), transform .9s cubic-bezier(.25,.46,.45,.94); }
.rp-up.visible { opacity: 1; transform: none; }
.rp-stag > * { opacity: 0; transform: translateY(20px); transition: opacity .7s cubic-bezier(.25,.46,.45,.94), transform .7s cubic-bezier(.25,.46,.45,.94); }
.rp-stag.visible > *:nth-child(1){ opacity:1; transform:none; transition-delay:.05s }
.rp-stag.visible > *:nth-child(2){ opacity:1; transform:none; transition-delay:.13s }
.rp-stag.visible > *:nth-child(3){ opacity:1; transform:none; transition-delay:.21s }
.rp-stag.visible > *:nth-child(4){ opacity:1; transform:none; transition-delay:.29s }
.rp-stag.visible > *:nth-child(5){ opacity:1; transform:none; transition-delay:.37s }
.rp-stag.visible > *:nth-child(6){ opacity:1; transform:none; transition-delay:.45s }
@media (prefers-reduced-motion: reduce){
  .rp-up, .rp-stag > * { opacity: 1 !important; transform: none !important; transition: none !important; }
  .rp-kpi::before { transform: scaleX(1) !important; transition: none !important; }
  .rp-eyebrow::before, .rp-scroll { animation: none !important; }
}


/* ---- value against effort board ----------------------------------------
   A nine cell board rather than a scatter. Both inputs are three step
   ratings, so a scatter puts dots on an invisible grid and asks the reader
   to reconstruct it. Drawing the grid instead says what the ratings are, and
   lets each initiative sit in a named cell you can point at in a meeting.

   The high value, low effort cell is the whole argument of the page, so it
   is the one cell that carries the brand gradient. */
.rp-ve { display: grid; grid-template-columns: 46px repeat(3, 1fr); gap: 8px; }
.rp-ve-cnr { }
.rp-ve-col { font-size: .64rem; font-weight: 700; letter-spacing: .09em; color: var(--ink-3); text-align: center; padding-bottom: 2px; }
.rp-ve-row { font-size: .64rem; font-weight: 700; letter-spacing: .09em; color: var(--ink-3);
  writing-mode: vertical-rl; transform: rotate(180deg); display: flex; align-items: center; justify-content: center; }
.rp-ve-cell {
  border: 1px solid var(--line); border-radius: 12px; min-height: 104px; padding: 9px;
  background: var(--surface); position: relative;
  opacity: 0; transform: scale(.94);
  transition: opacity .55s cubic-bezier(.25,.46,.45,.94), transform .55s cubic-bezier(.25,.46,.45,.94);
}
.rp-ve.visible .rp-ve-cell { opacity: 1; transform: none; }
.rp-ve-cell.empty { background: transparent; border-style: dashed; border-color: var(--line); }
.rp-ve-cell.hot {
  background: var(--brand);
  border-color: transparent;
}
.rp-ve-cell .cl { font-size: .58rem; font-weight: 700; letter-spacing: .08em; color: var(--ink-3); }
.rp-ve-cell.hot .cl { color: rgba(255,255,255,.8); }
.rp-ve-cell.hot .cl::after { content: ' \00b7 Do First'; }

.rp-ini {
  display: block; width: 100%; text-align: left; margin-top: 7px; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px;
  opacity: 0; transform: translateY(10px) scale(.97);
  transition: opacity .5s cubic-bezier(.25,.46,.45,.94), transform .5s cubic-bezier(.25,.46,.45,.94),
              border-color .18s, background .18s;
}
.rp-ve.visible .rp-ini { opacity: 1; transform: none; }
.rp-ini:hover { border-color: var(--brand-line); background: var(--brand-tint); }
.rp-ini .nm { font-size: .78rem; font-weight: 600; line-height: 1.3; }
.rp-ini .mt { font-size: .66rem; color: var(--ink-3); margin-top: 2px; display: flex; gap: 7px; align-items: center; }
.rp-ve-cell.hot .rp-ini { background: rgba(255,255,255,.17); border-color: rgba(255,255,255,.32); color: #fff; }
.rp-ve-cell.hot .rp-ini:hover { background: rgba(255,255,255,.26); border-color: rgba(255,255,255,.5); }
.rp-ve-cell.hot .rp-ini .mt { color: rgba(255,255,255,.8); }
.rp-ini .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); flex: none; }
.rp-ve-cell.hot .rp-ini .dot { background: #fff; }

/* ---- value against effort, the executive stage --------------------------
   The same nine cell board the ratings allow, drawn as a dark stage so the
   one cell that matters can carry the brand colour against it. Each cell is
   shaded by how much value it returns for its effort, from near black at low
   value and high effort up to flat brand orange at high value and low effort.
   Initiatives are circles whose area is people reached; a ring marks work in
   progress. The distribution of the two ratings runs along the top and the
   right edge, which is where a count by row and by column belongs.

   Entrance, driven by the chart mechanism: cells rise in a diagonal wave from
   the do first corner, the edge totals grow, the circles drop in with a small
   overshoot in priority order, and the do first corner lights up last. */
.ve2 { background: var(--ve-bg); border: 1px solid var(--ve-line); border-radius: 18px; padding: 1.8rem 1.8rem 1.3rem; color: var(--ink); }
.ve2-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1.2rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.ve2-eyebrow { font-size: .8rem; font-weight: 700; color: var(--brand-ink); margin-bottom: .7rem; }
.ve2-headline { display: flex; align-items: center; gap: 1.1rem; }
.ve2-big { font-family: var(--font-display); font-size: 3.8rem; font-weight: 800; line-height: .9; letter-spacing: -2px; color: var(--brand-ink); min-width: 1ch; }
.ve2-hl { font-size: 1.08rem; font-weight: 700; }
.ve2-desc { font-size: .86rem; color: var(--ink-2); line-height: 1.6; max-width: 54ch; margin-top: .25rem; }
.ve2-key { display: flex; flex-direction: column; gap: .5rem; font-size: .72rem; color: var(--ink-3); }
.ve2-key span { display: inline-flex; align-items: center; gap: .55rem; }
.ve2-key i { width: 13px; height: 13px; border-radius: 50%; background: var(--ve-bub); flex: none; }
.ve2-key i.ring { border: 3px solid var(--ve-ring); }

.ve2-grid { display: grid; grid-template-columns: 84px repeat(3, minmax(0, 1fr)) 128px; gap: 6px; }
.ve2-ch { padding: 0 2px 9px; }
.ve2-cl { display: flex; justify-content: space-between; gap: 8px; font-size: .74rem; color: var(--ink-2); margin-bottom: 6px; }
.ve2-cl b { color: var(--ink); font-weight: 700; white-space: nowrap; }
.ve2-trk { display: block; height: 5px; background: var(--ve-trk); border-radius: 3px; overflow: hidden; }
.ve2-trk > span { display: block; height: 100%; background: var(--ve-bar); border-radius: 3px; }
.ve2-rh { display: flex; flex-direction: column; justify-content: center; align-items: flex-end; text-align: right;
  font-size: .76rem; font-weight: 600; color: var(--ink-2); padding-right: 6px; line-height: 1.25; }
.ve2-rh b { display: none; font-weight: 700; color: var(--ink); margin-top: 3px; }
.ve2-rm { display: flex; flex-direction: column; justify-content: center; padding-left: 8px; }

.ve2-cell { position: relative; min-height: 158px; border-radius: 12px; padding: 10px 11px; display: flex; flex-direction: column;
  border: 1px solid var(--ve-line); }
.ve2-cell.s2  { background: var(--brand); border-color: transparent; }
.ve2-cell.s1  { background: var(--ve-s1); }
.ve2-cell.s0  { background: var(--ve-s0); }
.ve2-cell.sn1 { background: var(--ve-sn1); }
.ve2-cell.sn2 { background: var(--ve-sn2); }
/* The do first corner is drawn orange and covered by a layer in the colour
   of its neighbours, which fades out last, so the corner appears to light up. */
.ve2-hot::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--ve-s0); opacity: 0; }
.ve2-tag { position: relative; z-index: 1; font-size: .72rem; font-weight: 700; color: var(--ve-tag); }
.ve2-hot .ve2-tag { color: #fff; }
.ve2-bubs { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; padding: 6px 0 2px; }
.ve2-b { background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; font: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 7px; max-width: 136px; text-align: center; }
.ve2-hot .ve2-b { color: #fff; }
.ve2-dot { display: block; width: var(--d); height: var(--d); border-radius: 50%; background: var(--ve-bub); transition: transform .2s cubic-bezier(.22,1,.36,1); }
.ve2-hot .ve2-dot { background: #fff; }
.ve2-b.on .ve2-dot { border: 3px solid var(--ve-ring); }
.ve2-hot .ve2-b.on .ve2-dot { border-color: var(--navy); }
.ve2-b:hover .ve2-dot, .ve2-b:focus-visible .ve2-dot { transform: scale(1.08); }
.ve2-nm { font-size: .8rem; font-weight: 600; line-height: 1.25; }
.ve2-mt { font-size: .68rem; color: var(--ink-2); }
.ve2-hot .ve2-mt { color: rgba(255,255,255,.88); }
.ve2-foot { margin-top: 1rem; font-size: .72rem; color: var(--ink-3); line-height: 1.6; }

@keyframes chRise { from { opacity: 0; transform: translateY(16px) scale(.97); } }
@keyframes chBub  { from { transform: scale(0); } }
@keyframes veLand { from { opacity: 1; } }
.ch-armed .ch .cm.rise { animation-name: chRise; animation-duration: .8s; }
.ch-armed .ch .cm.bub  { animation-name: chBub; animation-duration: .75s; animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
.ch-armed .ch .ve2-hot::before { animation: veLand 1s cubic-bezier(.22,1,.36,1) 1.35s both paused; }
.ch-armed .ch.go .ve2-hot::before { animation-play-state: running; }

@media (prefers-reduced-motion: reduce){
  .rp-ve-cell, .rp-ini { opacity: 1 !important; transform: none !important; transition: none !important; }
  .ch-armed .ch .ve2-hot::before { animation: none !important; }
}
@media (max-width: 760px){
  .ve2 { padding: 1.2rem 1rem 1rem; }
  .ve2-grid { grid-template-columns: 58px repeat(3, minmax(0, 1fr)); gap: 4px; }
  .ve2-rm, .ve2-mh { display: none; }
  .ve2-rh b { display: block; }
  /* Label over count on a phone, rather than side by side in a column a
     third of the screen wide. */
  .ve2-cl { flex-direction: column; gap: 1px; font-size: .68rem; }
  .ve2-cell { min-height: 120px; padding: 7px; }
  .ve2-dot { width: calc(var(--d) * .6); height: calc(var(--d) * .6); }
  .ve2-nm { font-size: .68rem; }
  .ve2-mt { display: none; }
  .ve2-big { font-size: 2.7rem; }
}
@media (max-width: 760px){
  .rp-ve { grid-template-columns: 28px repeat(3, 1fr); gap: 5px; }
  .rp-ve-cell { min-height: 82px; padding: 6px; }
}

/* ---- badges: status pills and priority chips ---------------------------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px;
  border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
  border: 1px solid transparent;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.pill.ok    { background: var(--ok-tint);    color: var(--ok);    border-color: var(--ok-line); }
.pill.watch { background: var(--watch-tint); color: var(--watch); border-color: var(--watch-line); }
.pill.risk  { background: var(--risk-tint);  color: var(--risk);  border-color: var(--risk-line); }
.pill.info  { background: var(--info-tint);  color: var(--info);  border-color: var(--info-line); }
.pill.mute  { background: var(--muted-tint); color: var(--muted-ink); border-color: var(--muted-line); }
.pill.brand { background: var(--brand-tint); color: var(--brand-ink); border-color: var(--brand-line); }
.pill.solid { background: var(--ok); color: #fff; border-color: var(--ok); }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px;
  border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: .01em;
  border: 1px solid currentColor; background: transparent; white-space: nowrap;
}
.chip .gl { font-size: 10px; line-height: 1; }
.chip.highest { color: var(--p-highest); }
.chip.high    { color: var(--p-high); }
.chip.medium  { color: var(--p-medium); }
.chip.low     { color: var(--p-low); }
.chip.lowest  { color: var(--p-lowest); }

.tag {
  display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--line); white-space: nowrap;
}
.epic {
  display: inline-flex; align-items: center; gap: 5px; max-width: 100%;
  padding: 1px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
  color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---- avatars ------------------------------------------------------------ */
.av {
  width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-size: 10.5px; font-weight: 700; color: #fff; letter-spacing: -.02em;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.28);
}
.av.xs { width: 20px; height: 20px; font-size: 9px; }
.av.sm { width: 24px; height: 24px; font-size: 10px; }
.av.lg { width: 34px; height: 34px; font-size: 12.5px; }
.avstack { display: flex; }
.avstack .av { margin-left: -7px; box-shadow: 0 0 0 2px var(--surface); }
.avstack .av:first-child { margin-left: 0; }
.avstack .more {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); color: var(--ink-2); font-size: 10.5px; font-weight: 700;
  margin-left: -7px; box-shadow: 0 0 0 2px var(--surface);
}
.who { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unassigned { color: var(--ink-3); font-style: italic; font-size: 12.5px; }

/* ---- tables ------------------------------------------------------------- */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--ink-3);
  padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--surface);
  position: sticky; top: 0; white-space: nowrap;
}
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { color: var(--ink); }
tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--surface-2); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

/* ---- stat tiles --------------------------------------------------------- */
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow-1); position: relative; overflow: hidden; }
.tile .k { font-size: 11.5px; font-weight: 600; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.tile .v { font-family: var(--font-display); font-size: 27px; font-weight: 700; letter-spacing: -.8px; margin-top: 5px; font-variant-numeric: tabular-nums; line-height: 1.05; }
.tile .v .u { font-size: 15px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; }
.tile .sub { font-size: 12px; color: var(--ink-2); margin-top: 5px; }
.tile .foot { margin-top: 10px; }
.tile.accent { border-left: 3px solid var(--brand); }
.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 700; }
.delta.up { color: var(--ok); } .delta.down { color: var(--risk); } .delta.flat { color: var(--ink-3); }

.bar-track { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; display: flex; }
.bar-track > i { display: block; height: 100%; }
.bar-track > i + i { margin-left: 2px; }
.mini-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; }
.mini-legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-2); }
.mini-legend i { width: 9px; height: 9px; border-radius: 2px; flex: none; }

/* ---- charts ------------------------------------------------------------- */
.chartbox { position: relative; }
.chartbox svg { width: 100%; height: auto; overflow: visible; }
.axis-line { stroke: var(--line-2); stroke-width: 1; }
.gridline  { stroke: var(--grid); stroke-width: 1; }
.axis-txt  { font-size: 10.5px; fill: var(--ink-3); font-family: inherit; }
.val-txt   { font-size: 11px; fill: var(--ink-2); font-family: inherit; font-weight: 600; font-variant-numeric: tabular-nums; }
.lead-txt  { font-size: 12px; fill: var(--ink); font-family: inherit; font-weight: 600; }
.mark { transition: opacity .12s; cursor: default; }

/* ---- chart entrance ------------------------------------------------------
   Every chart grows into place the first time it is on screen: bars from
   their baseline, columns up from the axis, trend lines drawn left to right,
   heat cells in a diagonal wave. One mechanism for all of them. Each mark
   (.cm) holds its animation paused on its first frame, staggered by --i, and
   wireCharts() adds .go to the chart (.ch) when it scrolls into view.

   The paused first frame only applies once the script has armed the page
   with html.ch-armed, so if anything goes wrong before that the charts are
   simply drawn, never left empty. Keyframes carry only a "from", so every
   mark animates to exactly the geometry it was drawn with. */
@keyframes chGrowX { from { transform: scaleX(0); } }
@keyframes chGrowY { from { transform: scaleY(0); } }
@keyframes chWipe  { from { clip-path: inset(0 100% 0 0); } }
@keyframes chPop   { from { opacity: 0; transform: scale(.55); } }
.ch-armed .ch .cm {
  animation-duration: .9s; animation-timing-function: cubic-bezier(.22,1,.36,1);
  animation-fill-mode: both; animation-play-state: paused;
  animation-delay: calc(var(--base, 0ms) + var(--i, 0) * var(--ch-step, 45ms));
}
.ch-armed .ch.go .cm { animation-play-state: running; }
.ch-armed .ch .cm.gx   { animation-name: chGrowX; transform-box: fill-box; transform-origin: left center; }
.ch-armed .ch .cm.gxr  { animation-name: chGrowX; transform-box: fill-box; transform-origin: right center; }
.ch-armed .ch .cm.gy   { animation-name: chGrowY; transform-box: fill-box; transform-origin: center bottom; }
.ch-armed .ch .cm.wipe { animation-name: chWipe; animation-duration: 1.2s; animation-timing-function: cubic-bezier(.45,0,.2,1); }
.ch-armed .ch .cm.pop  { animation-name: chPop; animation-duration: .55s; }
@media (prefers-reduced-motion: reduce){ .ch-armed .ch .cm { animation: none !important; } }
.chartbox:hover .mark { opacity: .55; }
.chartbox .mark:hover { opacity: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend i.ln { height: 3px; border-radius: 2px; width: 14px; }

.tip {
  position: fixed; z-index: 200; pointer-events: none; opacity: 0; transition: opacity .1s;
  background: var(--ink); color: #fff; border-radius: 7px; padding: 8px 10px;
  font-size: 11.5px; line-height: 1.45; max-width: 260px;
}
.tip.on { opacity: 1; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r em { font-style: normal; opacity: .75; }

/* heatmap */
.heatwrap { overflow-x: auto; }
.heat { display: grid; gap: 3px; min-width: 420px; }
.heat .hc { aspect-ratio: 1.9; border-radius: 5px; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; cursor: default; }
.heat .hh { font-size: 10.5px; font-weight: 600; color: var(--ink-3); display: flex; align-items: flex-end; padding-bottom: 4px; line-height: 1.2; }
.heat .hr { font-size: 11.5px; font-weight: 500; color: var(--ink-2); display: flex; align-items: center; justify-content: flex-end; padding-right: 9px; text-align: right; line-height: 1.2; }

/* waffle */
.waffle { display: flex; flex-wrap: wrap; gap: 3px; }
.waffle i { width: 13px; height: 13px; border-radius: 3px; cursor: pointer; transition: transform .1s; }
.waffle i:hover { transform: scale(1.25); }

/* funnel */
.funnel { display: flex; align-items: stretch; gap: 3px; }
.fstep { flex: 1; min-width: 0; position: relative; }
.fstep .fbar { border-radius: 6px; display: flex; align-items: flex-end; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; padding-bottom: 7px; }
.fstep .fname { font-size: 11.5px; font-weight: 600; color: var(--ink-2); margin-top: 7px; text-align: center; line-height: 1.25; }
.fstep .fmeta { font-size: 10.5px; color: var(--ink-3); text-align: center; margin-top: 2px; }
.fconv { position: absolute; top: 50%; right: -3px; transform: translate(50%,-50%); z-index: 2;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 999px;
  font-size: 10px; font-weight: 700; padding: 1px 6px; color: var(--ink-2); }

/* roadmap swimlanes */
.lanes { display: grid; grid-template-columns: 172px 1fr; gap: 0; }
.lanes .lhd { font-size: 11px; font-weight: 600; color: var(--ink-3); padding: 0 10px 7px 0; }
.lanes .lname { font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 9px 10px 9px 0; border-top: 1px solid var(--line); display: flex; align-items: center; }
.lanes .ltrack { position: relative; border-top: 1px solid var(--line); border-left: 1px solid var(--line); min-height: 40px; }
.lanes .lgrid { position: absolute; inset: 0; display: grid; }
.lanes .lgrid i { border-right: 1px solid var(--grid); }
.lanes .qhd { display: grid; }
.lanes .qhd span { font-size: 11px; font-weight: 600; color: var(--ink-3); text-align: center; padding-bottom: 7px; border-left: 1px solid transparent; }
.lbar { position: absolute; height: 21px; border-radius: 5px; display: flex; align-items: center; padding: 0 8px;
  font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; cursor: pointer;
  }
.lbar:hover { filter: brightness(1.07); }
.lgate { position: absolute; width: 9px; height: 9px; background: var(--surface); border: 2px solid var(--ink); transform: rotate(45deg); border-radius: 1px; }
.ltoday { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--brand); opacity: .7; }

/* ---- kanban board ------------------------------------------------------- */
.boardwrap { overflow-x: auto; padding-bottom: 10px; }
.board { display: flex; gap: 10px; align-items: flex-start; min-height: 420px; }
.bcol { width: 264px; flex: none; background: var(--surface-2); border-radius: var(--radius); display: flex; flex-direction: column; max-height: calc(100vh - 210px); }
.bcol.over { background: var(--brand-tint); outline: 2px dashed var(--brand-line); outline-offset: -2px; }
.bcol-hd { display: flex; align-items: center; gap: 8px; padding: 11px 12px 8px; position: sticky; top: 0; }
.bcol-hd .nm { font-size: 11.5px; font-weight: 700; letter-spacing: .03em; color: var(--ink-2); }
.bcol-hd .ct { font-size: 11px; font-weight: 700; color: var(--ink-3); background: var(--surface-3); border-radius: 999px; padding: 0 7px; font-variant-numeric: tabular-nums; }
.bcol-hd .wip { font-size: 10.5px; font-weight: 700; color: var(--risk); background: var(--risk-tint); border-radius: 999px; padding: 0 7px; }

.kcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;

}
