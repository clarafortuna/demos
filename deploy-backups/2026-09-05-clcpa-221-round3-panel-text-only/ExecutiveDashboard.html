<!DOCTYPE html>

<head>
  <script>
  /* Page password gate.

     Inside Dataverse this is redundant friction: the Microsoft login and the
     Dataverse privilege checks already decide who reaches this page, and a
     second password in front of them buys nothing.

     On the public demo origin it is the only access control there is, so it
     stays. Skipping it there would publish this app to anyone with the URL.

     Note what this gate is and is not: it redirects THIS PAGE only. It has
     never protected the data files next to it, which are fetchable directly on
     a public origin regardless. Do not read its presence as protection. */
  if (!/\.crm\.dynamics\.com$/.test(location.hostname) &&
      sessionStorage.getItem('dac_authenticated') !== 'true') {
    window.location.href = 'index.html';
  }
</script>

    .emf-src-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }

    .emf-chip-ref { background: var(--dusk-tint); color: var(--dusk); }

    .emf-drawer-kicker { font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--dusk); font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }

    .emf-drawer-close:hover { background: var(--line); color: var(--ink); }
    .emf-drawer-body { padding: 18px 22px 26px; overflow-y: auto; }
    .emf-drawer-body ol { margin: 0; padding-left: 20px; }

    .emf-drawer-body li strong { color: var(--ink); }

    .emf-info { border: none; background: var(--dusk-tint); color: var(--dusk); width: 18px; height: 18px; border-radius: 50%; font-size: 11px; font-weight: 700; font-style: normal; cursor: pointer; margin-left: 6px; line-height: 18px; padding: 0; vertical-align: middle; }
    .emf-info-note { display: block; margin-top: 8px; padding: 10px 12px; background: var(--white-smoke); border: 1px solid var(--line); border-radius: 7px; font-size: 12px; color: var(--text-3); line-height: 1.5; }
    /* Update panel as a card beside the selected source (falls back to below at narrow widths) */
    .emf-popover { position: absolute; z-index: 30; width: 380px; max-width: 92vw; background: var(--white); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 34px rgba(3,24,36,0.18); display: flex; flex-direction: column; max-height: 78vh; }
