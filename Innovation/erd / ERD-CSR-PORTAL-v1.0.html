<html lang="en">
<head>
<meta charset="UTF-8">

<title>Unified CSR Portal — Entity Relationship Diagram</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3352;
    --accent: #4f7cff;
    --accent2: #7c4fff;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --pk: #fbbf24;
    --fk: #60a5fa;
    --header-h: 36px;
    --row-h: 26px;
    --card-w: 210px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* ── TOOLBAR ── */
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 54px;
    background: rgba(15,17,23,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    padding: 0 20px;
  }
  #toolbar h1 {
    font-size: 14px; font-weight: 700; color: var(--text);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  #toolbar h1 span { color: var(--accent); }
  .tb-sep { width: 1px; height: 28px; background: var(--border); margin: 0 4px; }
  .tb-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 5px 12px; border-radius: 6px;
    font-size: 12px; cursor: pointer; transition: all .15s;
    white-space: nowrap;
  }
  .tb-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tb-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #zoom-label { font-size: 12px; color: var(--text-muted); min-width: 44px; text-align: center; }
  #search-box {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 5px 12px; border-radius: 6px;
    font-size: 12px; outline: none; width: 180px;
    transition: border .15s;
  }
  #search-box:focus { border-color: var(--accent); }
  #search-box::placeholder { color: var(--text-muted); }
  .tb-legend { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .leg-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
  .leg-dot { width: 10px; height: 10px; border-radius: 2px; }

  /* ── CANVAS ── */
  #canvas-wrap {
    position: fixed; top: 54px; left: 0; right: 0; bottom: 0;
    overflow: hidden; cursor: grab;
  }
  #canvas-wrap.grabbing { cursor: grabbing; }
  #canvas {
    position: absolute;
    transform-origin: 0 0;
  }

  /* ── SVG LINES ── */
  #svg-layer {
    position: absolute; top: 0; left: 0;
    pointer-events: none;
    overflow: visible;
  }

  /* ── ENTITY CARD ── */
  .entity {
    position: absolute;
    width: var(--card-w);
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: move;
    transition: box-shadow .2s, border-color .2s;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
  }
  .entity:hover, .entity.highlighted {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(79,124,255,.25), 0 4px 32px rgba(0,0,0,.6);
    z-index: 50 !important;
  }
  .entity.dimmed { opacity: .25; }
  .entity-header {
    height: var(--header-h);
    display: flex; align-items: center; padding: 0 10px;
    font-size: 12px; font-weight: 700; letter-spacing: .03em;
    border-bottom: 1px solid var(--border);
    gap: 7px;
  }
  .entity-header .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .entity-header .logical {
    font-size: 9px; color: var(--text-muted); font-weight: 400;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .entity-fields { padding: 4px 0 6px; }
  .field-row {
    display: flex; align-items: center;
    height: var(--row-h); padding: 0 8px; gap: 6px;
    font-size: 11px; color: var(--text-muted);
    transition: background .1s;
  }
  .field-row:hover { background: var(--surface2); color: var(--text); }
  .field-badge {
    font-size: 9px; font-weight: 700; padding: 1px 4px;
    border-radius: 3px; min-width: 22px; text-align: center;
    flex-shrink: 0;
  }
  .badge-pk { background: rgba(251,191,36,.15); color: var(--pk); }
  .badge-fk { background: rgba(96,165,250,.15); color: var(--fk); }
  .field-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field-type { font-size: 9px; color: #64748b; flex-shrink: 0; }
  .entity-footer {
    border-top: 1px solid var(--border);
    padding: 3px 8px;
    font-size: 10px; color: #475569;
    text-align: right;
  }

  /* ── MINIMAP ── */
  #minimap {
    position: fixed; bottom: 20px; right: 20px; z-index: 99;
    width: 160px; height: 110px;
    background: rgba(26,29,39,.9);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  #minimap canvas { width: 100%; height: 100%; }

  /* ── TOOLTIP ── */
  #tooltip {
    position: fixed; z-index: 200;
    background: rgba(34,38,58,.98);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px;
    font-size: 12px; pointer-events: none;
    display: none; max-width: 260px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
  }
  #tooltip .tt-title { font-weight: 700; color: var(--text); margin-bottom: 6px; }
  #tooltip .tt-row { color: var(--text-muted); margin-bottom: 2px; }
  #tooltip .tt-row strong { color: var(--text); }

  /* ── RELATION LINE ── */
  .rel-line { stroke: var(--border); stroke-width: 1.5; fill: none; opacity: .7; transition: all .2s; }
  .rel-line.active { stroke: var(--accent); stroke-width: 2; opacity: 1; }
  .rel-end-mark { stroke: var(--border); stroke-width: 1.5; fill: none; opacity: .7; transition: all .2s; }
  .rel-end-mark.active { stroke: var(--accent); stroke-width: 2; opacity: 1; }
  .rel-cardinality { fill: #64748b; font-size: 11px; font-weight: 700; font-family: 'Segoe UI', monospace; transition: fill .2s; }
  .rel-cardinality.active { fill: var(--accent); }
</style>
</head>

<style>

.cf-card{width:340px;text-align:center;padding:0 24px}
.cf-logo{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#2a9d8f;margin-bottom:28px}

.cf-sub{font-size:12px;color:rgba(255,255,255,.35);margin-bottom:36px;letter-spacing:.05em}
.cf-input{width:100%;padding:13px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#fff;font-size:14px;letter-spacing:.08em;outline:none;transition:border-color .2s;box-sizing:border-box}
.cf-input:focus{border-color:#2a9d8f}
.cf-input.err{border-color:#e76f51;animation:cfshake .3s ease}
.cf-error{font-size:11px;color:#e76f51;height:16px;margin:8px 0}
.cf-btn{width:100%;padding:13px;background:#2a9d8f;border:none;border-radius:8px;color:#fff;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.cf-btn:hover{background:#1a7a6e}
.cf-hint{margin-top:20px;font-size:10px;color:rgba(255,255,255,.18);letter-spacing:.05em}
@keyframes cfshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
<div id="cf-lock">
  <div class="cf-card">
    <div class="cf-logo">Clara Fortuna · Innovation</div>
    <div class="cf-title">Restricted Access</div>
    <div class="cf-sub">Enter your password to view this document</div>
    <input class="cf-input" id="cf-pwd" type="password" placeholder="Password" autocomplete="off" onkeydown="if(event.key==='Enter')cfCheck()"/>
    <div class="cf-error" id="cf-err"></div>
    <button class="cf-btn" onclick="cfCheck()">Access Document</button>
    <div class="cf-hint">Clara Fortuna · Innovation Department</div>
  </div>
</div>
<script>
(function(){
  var PASS={internal:'clarainnov2026\',client:'AILabClient2026'};
  var KEY='cf_innovation_auth';
  function unlock(){document.getElementById('cf-lock').classList.add('hidden')}
  function cfCheck(){
    var v=document.getElementById('cf-pwd').value.trim();
    if(v===PASS.internal||v===PASS.client){sessionStorage.setItem(KEY,'1');unlock();}
    else{
      var i=document.getElementById('cf-pwd');
      i.classList.add('err');
      document.getElementById('cf-err').textContent='Incorrect password. Try again.';
      i.value='';
      setTimeout(function(){i.classList.remove('err')},400);
    }
  }
  window.cfCheck=cfCheck;
  if(sessionStorage.getItem(KEY))unlock();
})();
</script>

      { name: 'ClosedDayId', type: 'Uniqueidentifier', key: 'PK' },
      { name: 'ClosedDaysId', type: 'String' },
      { name: 'Date', type: 'DateTime' },
      { name: 'HolidayName', type: 'String' },
      { name: 'Reason', type: 'String' },
    ]
  },
  {
    id: 'Action', name: 'Action', logical: 'cf_action',
    color: '#94a3b8',
    fields: [
      { name: 'ActionId', type: 'Uniqueidentifier', key: 'PK' },
      { name: 'Name', type: 'String' },
      { name: 'Code', type: 'String' },
    ]
  },
];

// Relationships: { from, to, fromField, toField }
const RELATIONS = [
  { from: 'CustomerAssistance', to: 'MasterSchedule', fromField: 'cf_customerassistanceid', toField: 'cf_employeenumber' },
  { from: 'CustomerAssistance', to: 'LeaveRequest', fromField: 'cf_customerassistanceid', toField: 'cf_employeenumber' },
  { from: 'CustomerAssistance', to: 'FullDayEquivalent', fromField: 'cf_customerassistanceid', toField: 'cf_employeenumber' },
  { from: 'CustomerAssistance', to: 'Entitlement', fromField: 'cf_customerassistanceid', toField: 'cf_employeenumber' },
  { from: 'CustomerAssistance', to: 'EmployeeInteractionLog', fromField: 'cf_customerassistanceid', toField: 'cf_employee' },
  { from: 'LeaveType', to: 'LeaveRequest', fromField: 'cf_leavetypeid', toField: 'cf_leavetype' },
  { from: 'LeaveType', to: 'Entitlement', fromField: 'cf_leavetypeid', toField: 'cf_leavetype' },
  { from: 'RequestStatus', to: 'LeaveRequestDetail', fromField: 'cf_requeststatusid', toField: 'cf_requeststatus' },
  { from: 'RecordStatus', to: 'Entitlement', fromField: 'cf_recordstatusid', toField: 'cf_entitlementstatus' },
  { from: 'FunctionDetailed', to: 'FunctionAllotment', fromField: 'cf_functiondetailedid', toField: 'cf_functionid' },
  { from: 'FunctionAllotment', to: 'LeaveRequestDetail', fromField: 'cf_functionallotmentid', toField: 'cf_functionallotmentid' },
  { from: 'LeaveRequest', to: 'LeaveRequestDetail', fromField: 'cf_leaverequestid', toField: 'cf_lrequestid' },
  { from: 'InteractionType', to: 'EmployeeInteractionLog', fromField: 'cf_interactiontypeid', toField: 'cf_interactiontype' },
  { from: 'Entitlement', to: 'LeaveRequest', fromField: 'cf_entitlementid', toField: 'cf_entitlement' },
];

// ═══════════════════════════════════════════════
// LAYOUT — manual grid for visual clarity
// ═══════════════════════════════════════════════
const LAYOUT = {
  CustomerAssistance:     { x: 580, y: 340 },
  MasterSchedule:         { x: 230, y: 160 },
  LeaveRequest:           { x: 580, y: 720 },
  LeaveRequestDetail:     { x: 960, y: 720 },
  LeaveType:              { x: 230, y: 720 },
  Entitlement:            { x: 960, y: 340 },
  FunctionAllotment:      { x: 1340, y: 720 },
  FunctionDetailed:       { x: 1340, y: 360 },
  FullDayEquivalent:      { x: 230, y: 420 },
  RequestStatus:          { x: 1340, y: 970 },
  RecordStatus:           { x: 1340, y: 160 },
  InteractionType:        { x: 230, y: 1000 },
  EmployeeInteractionLog: { x: 580, y: 1060 },
  EmployeeFeedback:       { x: 960, y: 1060 },
  EmployeeInteractions:   { x: 1340, y: 1140 },
  EmployeePerformance:    { x: 960, y: 160 },
  Supervisor:             { x: 50,  y: 340 },
  Role:                   { x: 50,  y: 560 },
  SectionDetailed:        { x: 50,  y: 720 },
  ProcessPhaseFlags:      { x: 50,  y: 880 },
  Override:               { x: 50,  y: 1020 },
  Admin:                  { x: 50,  y: 1140 },
  Developer:              { x: 580, y: 160 },
  ClosedDay:              { x: 1340, y: 540 },
  Action:                 { x: 230, y: 1140 },
};

// ═══════════════════════════════════════════════
// RENDER ENGINE
// ═══════════════════════════════════════════════
const canvas = document.getElementById('canvas');
const svgLayer = document.getElementById('svg-layer');
const wrap = document.getElementById('canvas-wrap');

let scale = 1, offX = 30, offY = 30;
let dragging = false, dragTarget = null, dragOffX = 0, dragOffY = 0;
let panStart = null;
let positions = {};   // entity id → {x, y}
let domCards = {};    // entity id → element
let highlighted = null;

function buildCards() {
  ENTITIES.forEach(ent => {
    const pos = LAYOUT[ent.id] || { x: 100, y: 100 };
    positions[ent.id] = { ...pos };

    const card = document.createElement('div');
    card.className = 'entity';
    card.id = 'card-' + ent.id;
    card.style.left = pos.x + 'px';
    card.style.top  = pos.y + 'px';
    card.style.zIndex = 10;

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'entity-header';
    hdr.innerHTML = `<div class="dot" style="background:${ent.color}"></div>
      <span>${ent.name}</span>
      <span class="logical">${ent.logical}</span>`;
    card.appendChild(hdr);

    // Fields
    const fields = document.createElement('div');
    fields.className = 'entity-fields';
    ent.fields.forEach(f => {
      const row = document.createElement('div');
      row.className = 'field-row';
      const badge = f.key
        ? `<span class="field-badge badge-${f.key.toLowerCase()}">${f.key}</span>`
        : `<span style="min-width:22px"></span>`;
      row.innerHTML = `${badge}<span class="field-name">${f.name}</span><span class="field-type">${f.type}</span>`;
      fields.appendChild(row);
    });
    card.appendChild(fields);

    // Footer
    const footer = document.createElement('div');
    footer.className = 'entity-footer';
    const pks = ent.fields.filter(f => f.key === 'PK').length;
    const fks = ent.fields.filter(f => f.key === 'FK').length;
    footer.textContent = `${ent.fields.length} fields · ${pks} PK · ${fks} FK`;
    card.appendChild(footer);

    // Events
    card.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      e.stopPropagation();
      dragTarget = ent.id;
      const rect = card.getBoundingClientRect();
      dragOffX = e.clientX - rect.left;
      dragOffY = e.clientY - rect.top;
      card.style.zIndex = 100;
      card.style.transition = 'none';
    });

    card.addEventListener('mouseenter', () => highlightEntity(ent.id));
    card.addEventListener('mouseleave', () => clearHighlight());

    canvas.appendChild(card);
    domCards[ent.id] = card;
  });
}



function buildRelations() {
  svgLayer.innerHTML = '';
  RELATIONS.forEach((rel, i) => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.id = 'relg-' + i;
    g.dataset.from = rel.from;
    g.dataset.to   = rel.to;

    // Main bezier path
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    line.setAttribute('class', 'rel-line');
    line.id = 'rel-' + i;
    g.appendChild(line);

    // "1" marker group (from side)
    const gOne = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    gOne.id = 'rel-one-' + i;
    gOne.setAttribute('class', 'rel-end-mark');
    g.appendChild(gOne);

    // Crow's foot group (to side = N)
    const gMany = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    gMany.id = 'rel-many-' + i;
    gMany.setAttribute('class', 'rel-end-mark');
    g.appendChild(gMany);

    // "1" label
    const lbl1 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lbl1.setAttribute('class', 'rel-cardinality');
    lbl1.id = 'rel-lbl1-' + i;
    lbl1.textContent = '1';
    g.appendChild(lbl1);

    // "N" label
    const lblN = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lblN.setAttribute('class', 'rel-cardinality');
    lblN.id = 'rel-lblN-' + i;
    lblN.textContent = 'N';
    g.appendChild(lblN);

    svgLayer.appendChild(g);
  });
  updateRelations();
}

function cardCenter(id) {
  const p = positions[id];
  const card = domCards[id];
  if (!p || !card) return null;
  const w = card.offsetWidth || 210;
  const h = card.offsetHeight || 200;
  return { x: p.x + w / 2, y: p.y + h / 2, l: p.x, r: p.x + w, t: p.y, b: p.y + h };
}

// Draw a single perpendicular bar ("1") near a connection point
function drawOneMarker(g, x, y, angle) {
  // perpendicular tick at distance 10 from endpoint
  const dist = 12;
  const px = x + Math.cos(angle) * dist;
  const py = y + Math.sin(angle) * dist;
  const perpX = -Math.sin(angle) * 7;
  const perpY =  Math.cos(angle) * 7;
  while (g.firstChild) g.removeChild(g.firstChild);
  const line1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line1.setAttribute('x1', px - perpX); line1.setAttribute('y1', py - perpY);
  line1.setAttribute('x2', px + perpX); line1.setAttribute('y2', py + perpY);
  g.appendChild(line1);
}

// Draw crow's foot ("N") near a connection point
function drawManyMarker(g, x, y, angle) {
  const dist = 14;
  const px = x + Math.cos(angle) * dist;
  const py = y + Math.sin(angle) * dist;
  const perpX = -Math.sin(angle) * 8;
  const perpY =  Math.cos(angle) * 8;
  while (g.firstChild) g.removeChild(g.firstChild);
  // Vertical bar (closest to entity)
  const bar = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  bar.setAttribute('x1', px - perpX); bar.setAttribute('y1', py - perpY);
  bar.setAttribute('x2', px + perpX); bar.setAttribute('y2', py + perpY);
  g.appendChild(bar);
  // Two fork lines to the tip
  const tipDist = 12;
  const tx = x + Math.cos(angle) * (dist + tipDist);
  const ty = y + Math.sin(angle) * (dist + tipDist);
  const fork1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  fork1.setAttribute('x1', tx); fork1.setAttribute('y1', ty);
  fork1.setAttribute('x2', px - perpX); fork1.setAttribute('y2', py - perpY);
  g.appendChild(fork1);
  const fork2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  fork2.setAttribute('x1', tx); fork2.setAttribute('y1', ty);
  fork2.setAttribute('x2', px + perpX); fork2.setAttribute('y2', py + perpY);
  g.appendChild(fork2);
}

function updateRelations() {
  RELATIONS.forEach((rel, i) => {
    const line  = document.getElementById('rel-' + i);
    const gOne  = document.getElementById('rel-one-' + i);
    const gMany = document.getElementById('rel-many-' + i);
    const lbl1  = document.getElementById('rel-lbl1-' + i);
    const lblN  = document.getElementById('rel-lblN-' + i);
    if (!line) return;

    const a = cardCenter(rel.from);
    const b = cardCenter(rel.to);
    if (!a || !b) return;

    // Pick connection side
    let x1, y1, x2, y2;
    const dx = b.x - a.x, dy = b.y - a.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0) { x1 = a.r; y1 = a.y; x2 = b.l; y2 = b.y; }
      else         { x1 = a.l; y1 = a.y; x2 = b.r; y2 = b.y; }
    } else {
      if (dy > 0) { x1 = a.x; y1 = a.b; x2 = b.x; y2 = b.t; }
      else        { x1 = a.x; y1 = a.t; x2 = b.x; y2 = b.b; }
    }

    // Bezier
    const mx = (x1 + x2) / 2;
    const d = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
    line.setAttribute('d', d);

    // Angles at endpoints for marker orientation
    // "1" side: angle from entity outward (from a toward b)
    const ang1 = Math.atan2(y1 - a.y, x1 - a.x); // pointing away from a
    // "N" side: angle from entity outward (from b toward a)
    const angN = Math.atan2(y2 - b.y, x2 - b.x); // pointing away from b

    // Invert to point INTO the endpoint
    drawOneMarker(gOne,   x1, y1, ang1);
    drawManyMarker(gMany, x2, y2, angN);

    // Label offsets — put them beside the markers, slightly away from line
    const off = 14;
    const perpAng1 = ang1 + Math.PI / 2;
    const perpAngN = angN + Math.PI / 2;

    lbl1.setAttribute('x', x1 + Math.cos(ang1) * 26 + Math.cos(perpAng1) * off);
    lbl1.setAttribute('y', y1 + Math.sin(ang1) * 26 + Math.sin(perpAng1) * off + 4);
    lbl1.setAttribute('text-anchor', 'middle');

    lblN.setAttribute('x', x2 + Math.cos(angN) * 32 + Math.cos(perpAngN) * off);
    lblN.setAttribute('y', y2 + Math.sin(angN) * 32 + Math.sin(perpAngN) * off + 4);
    lblN.setAttribute('text-anchor', 'middle');
  });
}

function setRelActive(i, active) {
  ['rel-', 'rel-one-', 'rel-many-', 'rel-lbl1-', 'rel-lblN-'].forEach(prefix => {
    const el = document.getElementById(prefix + i);
    if (el) el.classList.toggle('active', active);
  });
}

function highlightEntity(id) {
  highlighted = id;
  const relatedIds = new Set([id]);
  RELATIONS.forEach((rel, i) => {
    const isRel = rel.from === id || rel.to === id;
    setRelActive(i, isRel);
    if (isRel) { relatedIds.add(rel.from); relatedIds.add(rel.to); }
  });
  Object.keys(domCards).forEach(eid => {
    const card = domCards[eid];
    if (relatedIds.has(eid)) {
      card.classList.add('highlighted');
      card.classList.remove('dimmed');
    } else {
      card.classList.add('dimmed');
      card.classList.remove('highlighted');
    }
  });
}

function clearHighlight() {
  highlighted = null;
  RELATIONS.forEach((_, i) => setRelActive(i, false));
  document.querySelectorAll('.entity').forEach(c => {
    c.classList.remove('highlighted', 'dimmed');
  });
}

// ═══════════════════════════════════════════════
// PAN & ZOOM
// ═══════════════════════════════════════════════
function applyTransform() {
  canvas.style.transform = `translate(${offX}px,${offY}px) scale(${scale})`;
  document.getElementById('zoom-label').textContent = Math.round(scale * 100) + '%';
}

function zoomIn()  { scale = Math.min(scale * 1.15, 3); applyTransform(); }
function zoomOut() { scale = Math.max(scale / 1.15, .15); applyTransform(); }
function resetView() { scale = 1; offX = 30; offY = 30; applyTransform(); }

function fitAll() {
  const ids = Object.keys(positions);
  if (!ids.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  ids.forEach(id => {
    const p = positions[id];
    const card = domCards[id];
    const w = card ? card.offsetWidth : 210;
    const h = card ? card.offsetHeight : 200;
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x + w); maxY = Math.max(maxY, p.y + h);
  });
  const vw = wrap.offsetWidth, vh = wrap.offsetHeight;
  const pad = 60;
  const scaleX = (vw - pad * 2) / (maxX - minX);
  const scaleY = (vh - pad * 2) / (maxY - minY);
  scale = Math.min(scaleX, scaleY, 1.5);
  offX = pad - minX * scale;
  offY = pad - minY * scale;
  applyTransform();
}

// Mouse events
wrap.addEventListener('mousedown', e => {
  if (e.button === 0 && !dragTarget) {
    panStart = { x: e.clientX - offX, y: e.clientY - offY };
    wrap.classList.add('grabbing');
  }
});

window.addEventListener('mousemove', e => {
  if (dragTarget) {
    const x = (e.clientX - offX) / scale - dragOffX;
    const y = (e.clientY - offY) / scale - dragOffY;
    positions[dragTarget] = { x, y };
    domCards[dragTarget].style.left = x + 'px';
    domCards[dragTarget].style.top  = y + 'px';
    updateRelations();
  } else if (panStart) {
    offX = e.clientX - panStart.x;
    offY = e.clientY - panStart.y;
    applyTransform();
  }
});

window.addEventListener('mouseup', e => {
  if (dragTarget) {
    domCards[dragTarget].style.zIndex = 10;
    domCards[dragTarget].style.transition = '';
    dragTarget = null;
  }
  panStart = null;
  wrap.classList.remove('grabbing');
});

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  offX = mx - (mx - offX) * factor;
  offY = my - (my - offY) * factor;
  scale = Math.min(Math.max(scale * factor, .15), 3);
  applyTransform();
}, { passive: false });

// ═══════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════
function doSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) { clearHighlight(); return; }
  const matched = ENTITIES
    .filter(e => e.name.toLowerCase().includes(q) ||
                 e.logical.toLowerCase().includes(q) ||
                 e.fields.some(f => f.name.toLowerCase().includes(q)))
    .map(e => e.id);
  if (!matched.length) { clearHighlight(); return; }
  Object.keys(domCards).forEach(id => {
    const card = domCards[id];
    if (matched.includes(id)) {
      card.classList.remove('dimmed'); card.classList.add('highlighted');
    } else {
      card.classList.add('dimmed'); card.classList.remove('highlighted');
    }
  });
  document.querySelectorAll('.rel-line').forEach((l, i) => {
    const isRel = matched.includes(l.dataset.from) && matched.includes(l.dataset.to);
    setRelActive(i, isRel);
  });
}

// ═══════════════════════════════════════════════
// MINIMAP
// ═══════════════════════════════════════════════
function drawMinimap() {
  const mm = document.getElementById('mm-canvas');
  const ctx = mm.getContext('2d');
  mm.width = 160; mm.height = 110;
  ctx.fillStyle = '#0f1117';
  ctx.fillRect(0, 0, 160, 110);

  const ids = Object.keys(positions);
  if (!ids.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  ids.forEach(id => {
    const p = positions[id];
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x + 210); maxY = Math.max(maxY, p.y + 200);
  });
  const sx = 150 / (maxX - minX + 1);
  const sy = 100 / (maxY - minY + 1);
  const s = Math.min(sx, sy);

  ENTITIES.forEach(ent => {
    const p = positions[ent.id];
    ctx.fillStyle = ent.color + '88';
    ctx.fillRect(
      5 + (p.x - minX) * s, 5 + (p.y - minY) * s,
      Math.max(4, 210 * s), Math.max(3, 50 * s)
    );
  });
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
buildCards();
buildRelations();
applyTransform();
setTimeout(() => { drawMinimap(); }, 300);
setInterval(drawMinimap, 1000);
</script>
